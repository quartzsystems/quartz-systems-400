# ---------------------------------------------------------------------
# QS00SS1: the operating system.
[[package]]
[package.product]
id = "QS00SS1"
ibm_alias = "5770SS1"
text = "Quartz Systems/400 Operating System"
library = "QSYS"
first_copyright = 2026
current_copyright = 2026
ccsids = [37, 1208]
status = "shipped"

[[package.option]]
option = "*BASE"
text = "Quartz Systems/400 Operating System"
msgid = "QSZ0000"
feature = "5050"
libraries = [{ name = "QSYS" }, { name = "QSYS2" }, { name = "QUSRSYS" }, { name = "QGPL" }]
components = [
    "slic", "store", "db", "dds", "jrn", "sql", "qdecimal", "qir", "codegen", "mi", "ile",
    "sysapi", "msgf", "wm", "qsjob", "spool", "print", "sec", "cmd", "sys-cpps", "cl",
    "tn5250", "dspf", "uim", "menus", "edtf", "ifs", "ifscmd", "qsyslib", "netlink", "tcpcfg",
    "sockets", "tls", "cmncfg", "nettools", "ddm", "servers", "qrpgrt",
]
ibm = "5770SS1 *BASE; DDM/DRDA, TCP/IP, TLS and the host print transform are base there too"

[[package.option]]
option = 12
text = "Host servers"
msgid = "QSZ0012"
feature = "5050"
components = ["hostsvr", "hostserver", "regfac"]
ibm = "5770SS1 option 12, Host Servers"

[[package.option]]
option = 18
text = "Media and storage extensions"
msgid = "QSZ0018"
feature = "5050"
components = ["image catalogs (*IMGCLG)", "virtual optical (/QOPT)", "save and restore media exits"]
ibm = "5770SS1 option 18, Media and Storage Extensions"

[[package.option]]
option = 30
text = "Qshell"
msgid = "QSZ0030"
feature = "5050"
components = ["qsh", "qsh-utils", "qsh-job", "qshterm"]
directories = [{ path = "/QIBM/ProdData/qsh" }]
ibm = "5770SS1 option 30, Qshell"

[[package.option]]
option = 33
text = "Portable application environment"
msgid = "QSZ0033"
feature = "5050"
components = ["pase (the loader and system call layer)"]
directories = [{ path = "/QOpenSys" }]
ibm = "5770SS1 option 33, PASE; the runtime libraries are QS00PSE"

[[package.option]]
option = 34
text = "Digital certificate manager"
msgid = "QSZ0034"
feature = "5050"
requires = ["QS00SS1:12"]
components = ["certs"]
directories = [{ path = "/QIBM/UserData/ICSS" }]
ibm = "5770SS1 option 34, Digital Certificate Manager"

