[package]
name = "sql"
description = "QS/400 SQL: the Db2 for i SQL dialect, planner and executor over the database"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["front", "lower"]
# The parser as a library: the lexer, the tree, the parser and
# analysis::analyze, with compdiag's diagnostics.
front = ["dep:compdiag"]
# The planner and executor over the database, the store and the job.
lower = [
    "front",
    "dep:db",
    "dep:jrn",
    "dep:store",
    "dep:dds",
    "dep:qsname",
    "dep:ccsid",
    "dep:sec",
    "dep:spool",
    "dep:nettools",
    "dep:regex",
    "dep:sha1",
    "dep:sha2",
    "dep:qir",
    "dep:ile",
    "dep:wm",
    "dep:msgf",
    "dep:tracing",
]

[dependencies]
db = { path = "../../database/db", version = "0.1.0", optional = true }
jrn = { path = "../../database/jrn", version = "0.1.0", optional = true }
store = { path = "../../storage/store", version = "0.1.0", optional = true }
dds = { path = "../../database/dds", version = "0.1.0", optional = true }
qdecimal = { path = "../../database/qdecimal", version = "0.1.0" }
qsname = { path = "../../storage/qsname", version = "0.1.0", optional = true }
ccsid = { path = "../../storage/ccsid", version = "0.1.0", optional = true }
sec = { path = "../../security/sec", version = "0.1.0", optional = true }
spool = { path = "../../work/spool", version = "0.1.0", optional = true }
nettools = { path = "../../net/nettools", version = "0.1.0", optional = true }
regex = { version = "1.11.0", optional = true }
sha1 = { version = "0.11.0", optional = true }
sha2 = { workspace = true, optional = true }
qir = { path = "../../runtime/qir", version = "0.1.0", optional = true }
ile = { path = "../../runtime/ile", version = "0.1.0", optional = true }
wm = { path = "../../work/wm", version = "0.1.0", optional = true }
msgf = { path = "../../runtime/msgf", version = "0.1.0", optional = true }
compdiag = { path = "../../rpg/compdiag", version = "0.1.0", optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
blockdev = { path = "../../lic/blockdev", version = "0.1.0" }

[lints]
workspace = true

