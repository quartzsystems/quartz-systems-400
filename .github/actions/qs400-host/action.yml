# A GitHub-hosted Ubuntu runner made into a QS/400 build host
# (docs/TOOLS.md, "CI and its runners"): room on the disk, KVM for QEMU,
# LLVM 21 for the kernel, QEMU and OVMF for the suites, and the pinned Rust
# toolchain. `build doctor` checks the result.

name: qs400 build host
description: Disk space, KVM, LLVM 21, QEMU, OVMF and the pinned toolchain.

runs:
  using: composite
  steps:
    - name: Room on the disk
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        df -h /

    - name: KVM for QEMU
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    - name: Packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          make flex bison bc perl xz-utils gpg gzip tar git libelf-dev libssl-dev \
          qemu-system-x86 qemu-utils ovmf lsb-release wget software-properties-common gnupg
        wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
        sudo bash /tmp/llvm.sh 21
        sudo apt-get install -y --no-install-recommends lld-21 llvm-21
        echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

    - name: Toolchain (rust-toolchain.toml)
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    - name: cargo-deny (prebuilt)
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny

    # The JDBC steps (132, 137) and the host-server steps drive QS/400
    # with JTOpen, the same release the oracle captures used.
    - name: JDK for the JTOpen steps
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "25"

    - name: JTOpen (jt400.jar, pinned)
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/jtopen"
        curl -fsSLo "$RUNNER_TEMP/jtopen/jt400.jar" \
          https://repo1.maven.org/maven2/net/sf/jt400/jt400/20.0.7/jt400-20.0.7.jar
        echo "QS_JT400_JAR=$RUNNER_TEMP/jtopen/jt400.jar" >> "$GITHUB_ENV"
        echo "QS_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

    # The kernel source and build, the crates' downloads and the compiled
    # dependencies, from the newest run on main (only main saves: see the
    # workflows' last step). A branch's own crates still rebuild, as their
    # sources are new to the runner.
    - name: Build cache (restore)
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/src
          target/kernel
          target/x86_64-unknown-linux-musl
          target/debug
        key: qs400-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'kernel/VERSION', 'kernel/config/**') }}-${{ github.run_id }}
        restore-keys: |
          qs400-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'kernel/VERSION', 'kernel/config/**') }}-
          qs400-build-

    - name: build doctor
      shell: bash
      run: cargo run -q -p build -- doctor
