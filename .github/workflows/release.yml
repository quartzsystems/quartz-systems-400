#
# A tag v<VERSION> publishes a GitHub release: the tag is checked against
# VERSION and CHANGELOG.md, every check in ci.yml runs (the QEMU suites
# among them), the release is built and signed on a GitHub-hosted runner
# with the keys in the `release` environment's secrets (only v* tags may
# use that environment), and the ISO, the
# UKIs, SHA256SUMS and its signature, the manifest, NOTICES.txt, the
# source offer, the Secure Boot certificate and CHANGELOG.md's section for
# the version are published. See docs/releasing.md.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: tag, VERSION and CHANGELOG.md agree
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          ci/version.sh check "$GITHUB_REF_NAME"
          echo "version=$(ci/version.sh)" >> "$GITHUB_OUTPUT"
          echo "release=$(ci/version.sh release)" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: build and sign ${{ needs.version.outputs.release }}
    needs: [version, ci]
    runs-on: ubuntu-24.04
    # Holds the release keys; its deployment rule admits v* tags only.
    environment: release
    timeout-minutes: 360
    env:
      QS400_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qs400-host
      # The keys go to a directory only this job's user can read, for the
      # signing step alone, and are removed whatever happens (the runner
      # itself is discarded after the job). Without all
      # three the release would be signed with the development keys, so
      # the job stops.
      - name: Release keys from the release environment
        env:
          SIGNING_KEY: ${{ secrets.QS400_SIGNING_KEY }}
          SB_KEY: ${{ secrets.QS400_SB_KEY }}
          SB_CERT_B64: ${{ secrets.QS400_SB_CERT_B64 }}
        run: |
          for k in SIGNING_KEY SB_KEY SB_CERT_B64; do
            [ -n "${!k}" ] || { echo "secret for $k is missing in the release environment (docs/releasing.md)" >&2; exit 1; }
          done
          umask 077
          dir=$(mktemp -d)
          printf '%s' "$SIGNING_KEY" > "$dir/release.ed25519"
          printf '%s\n' "$SB_KEY" > "$dir/qs400-db.key"
          printf '%s' "$SB_CERT_B64" | base64 -d > "$dir/qs400-db.cer"
          echo "KEYDIR=$dir" >> "$GITHUB_ENV"
      - run: cargo run -q -p build -- all --release
      - name: build release (signed)
        run: |
          QS400_SIGNING_KEY="$KEYDIR/release.ed25519" \
          QS400_SB_KEY="$KEYDIR/qs400-db.key" \
          QS400_SB_CERT="$KEYDIR/qs400-db.cer" \
            cargo run -q -p build -- release
      - name: Remove the keys
        if: always()
        run: '[ -z "${KEYDIR:-}" ] || rm -rf "$KEYDIR"'
      - name: Release files
        run: |
          out="$QS400_TARGET_DIR/release/${{ needs.version.outputs.release }}"
          mkdir -p dist
          cp "$out"/*.iso "$out"/*.efi "$out"/SHA256SUMS "$out"/SHA256SUMS.sig \
             "$out"/MANIFEST.json "$out"/MANIFEST.sig "$out"/NOTICES.txt \
             "$out"/SOURCE-OFFER.txt "$out"/qs400-db.cer dist/ 2>/dev/null || true
          test -n "$(ls dist/*.iso)"
          ( cd dist && sha256sum -c SHA256SUMS --ignore-missing )
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/

  publish:
    name: publish ${{ needs.version.outputs.release }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          {
            ci/version.sh notes
            echo
            echo "Check a download against SHA256SUMS, which is signed with the QS/400 release key (SHA256SUMS.sig). The full release notes are RELEASE_NOTES_${{ needs.version.outputs.release }}.md at the root of the ISO."
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "QS/400 ${{ needs.version.outputs.release }} (${{ needs.version.outputs.version }})" \
            --notes-file notes.md
