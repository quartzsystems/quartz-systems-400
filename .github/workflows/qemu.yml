#
# Chosen QEMU steps of one suite on a GitHub-hosted runner, on demand, for
# any branch: `gh workflow run qemu.yml --ref BRANCH -f suite=disk -f
# only=146,147` (docs/TOOLS.md, "CI and its runners"). The boot step always
# runs; steps that need an earlier one name it too (54 before 55).

name: qemu

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "disk, media or install"
        type: choice
        options: [disk, media, install]
        default: disk
      only:
        description: "Step prefixes, comma separated (empty: the whole suite)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: qemu-${{ github.ref }}-${{ inputs.suite }}-${{ inputs.only }}
  cancel-in-progress: true

jobs:
  qemu:
    name: QEMU ${{ inputs.suite }} ${{ inputs.only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qs400-host
      - run: cargo run -q -p build -- all
      - name: Build cache (save, main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/src
            target/kernel
            target/x86_64-unknown-linux-musl
            target/debug
          key: qs400-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'kernel/VERSION', 'kernel/config/**') }}-${{ github.run_id }}
      - name: Install media
        if: inputs.suite != 'disk'
        run: cargo run -q -p build -- iso
      - name: The steps
        run: |
          case "${{ inputs.suite }}" in
            disk) media=() ;;
            media) media=(--media iso) ;;
            install) media=(--media iso --install) ;;
          esac
          only=()
          [ -n "${{ inputs.only }}" ] && only=(--only "${{ inputs.only }}")
          if [ ${#only[@]} -eq 0 ]; then
            cargo run -q -p build -- test "${media[@]}"
          else
            cargo run -q -p conformance -- "${media[@]}" "${only[@]}"
          fi
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: target/logs/
          if-no-files-found: ignore
