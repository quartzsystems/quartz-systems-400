#
# QS/400 CI (docs/TOOLS.md, "CI and its runners"). Every job runs on
# GitHub's Ubuntu runners with the toolchain rust-toolchain.toml pins; the
# QEMU suites, the soak and the release run there too, under KVM, on a
# runner the qs400-host action makes into a build host. No self-hosted
# runner: nothing runs on a developer's machine.

name: ci

on:
  # Branches only: a tag runs this through release.yml instead.
  push:
    # rel/* are agents' work branches: qemu.yml runs their steps.
    branches: ["**", "!rel/**"]
  pull_request:
  # release.yml runs every check before it publishes.
  workflow_call:
  schedule:
    # Nightly, 02:00 UTC: the soak and a release with the development key.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Until the BLOCKED(rel) rename lands, the release notes check accepts
  # the older marker forms; drop this line after it.
  QS400_MARKERS: legacy

jobs:
  fmt:
    name: rustfmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy -D warnings
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host packages (clang links the host tools)
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Linux-only crates' real code is cfg(target_os = "linux").
      - run: cargo clippy -p slic -p console -p qsjob --all-targets --locked --target x86_64-unknown-linux-musl -- -D warnings

  deny:
    name: build deny, notices, release notes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo-deny
        run: cargo install cargo-deny --locked
      - name: VERSION, the release and CHANGELOG.md agree
        run: ci/version.sh check
      - run: cargo run -q -p build -- deny
      - run: cargo run -q -p build -- notices --check
      - run: cargo run -q -p kcbuild -- notes
      - run: cargo run -q -p fmtcheck

  test:
    name: host tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo test --workspace --locked --no-fail-fast

  fuzz:
    name: build fuzz (60 s a target)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo run -q -p build -- fuzz --secs 60 --jobs 4
      - name: Crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: tools/fuzz/crashes/

  qemu:
    name: build test (QEMU, ${{ matrix.suite }})
    # The suites run for main, tags (release.yml) and on demand; a push to
    # another branch gets the host checks above.
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_call' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/'))
    needs: [clippy, deny, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: disk
            args: ""
          - suite: media
            args: "--media iso"
          # Step 10 (the V1R0M0 upgrade) skips without QS400_OLD_ISO.
          - suite: install
            args: "--media iso --install"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qs400-host
      - run: cargo run -q -p build -- all
      - if: matrix.suite != 'disk'
        run: cargo run -q -p build -- iso
      - run: cargo run -q -p build -- test ${{ matrix.args }}
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs-${{ matrix.suite }}
          path: target/logs/
          if-no-files-found: ignore

  nightly:
    name: soak and release (development key)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qs400-host
      - run: cargo run -q -p build -- all
      - run: cargo run -q -p build -- soak --secs 3600
      # No QS400_SIGNING_KEY or QS400_SB_KEY here: the development keys.
      - run: cargo run -q -p build -- release
      - uses: actions/upload-artifact@v4
        with:
          name: qs400-release-dev
          path: |
            target/release/V*/*.iso
            target/release/V*/SHA256SUMS
            target/release/V*/SHA256SUMS.sig
            target/release/V*/MANIFEST.json
            target/release/V*/NOTICES.txt
            target/release/V*/SOURCE-OFFER.txt
          retention-days: 14
