#
# The reproducibility check (docs/TOOLS.md, "Reproducible releases"): a
# release built from scratch with the development keys on a fresh
# GitHub-hosted runner, its SHA256SUMS uploaded. Two runs of the same
# commit must give the same sums for every file but the signatures.
# On demand: `gh workflow run release-check.yml --ref main`.

name: release-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: build release (development keys)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qs400-host
      # A fixed, public test key: without one each build makes a random
      # development key, whose public half is in the image (the trust
      # anchor) and which signs the PTF baseline, so no two runs could
      # agree. This key signs nothing that ships.
      - name: The check's fixed signing key
        run: |
          printf '%s' "$(printf 'qs400 release-check, not a release key' | sha256sum | cut -c1-64)" > "$RUNNER_TEMP/check.ed25519"
          echo "QS400_SIGNING_KEY=$RUNNER_TEMP/check.ed25519" >> "$GITHUB_ENV"
      - run: cargo run -q -p build -- all --release
      - run: cargo run -q -p build -- release
      - name: Sums
        run: |
          out=$(ls -d target/release/V*)
          cat "$out/SHA256SUMS"
          cp "$out/SHA256SUMS" "SHA256SUMS-${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sha256sums-${{ github.run_id }}
          path: SHA256SUMS-${{ github.run_id }}
