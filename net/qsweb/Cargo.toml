[package]
name = "qsweb"
description = "QS/400 web products' shared layer: HTTP/1.1, forms and uploads, sessions and CSRF, the page frame and its partials, golden comparison"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
release = { path = "../../lic/release", version = "0.1.0" }
thiserror.workspace = true
hex.workspace = true
# Session IDs and CSRF tokens.
graviola = "0.4.1"
# Compile-time templates: the same DOM on every request.
# No config-file support: it needs an unmaintained TOML parser.
askama = { version = "0.16.1", default-features = false, features = ["derive", "std", "urlencode"] }

# A failed request's thread stays parked inside the panic hook, so the
# test owns its main: libtest's own hook handling would wait on it.
[[test]]
name = "guard"
harness = false

[lints]
workspace = true
