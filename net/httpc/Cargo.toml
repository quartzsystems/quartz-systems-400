[package]
name = "httpc"
description = "An HTTP/1.1 client over TCP or TLS: the caller chooses what is trusted (roots it gives, one pinned certificate, or a configuration of its own); bodies whole or streamed to a writer with a size limit and resumed by range"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
sha2.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"

[dev-dependencies]
x509kit = { path = "../../net/x509kit", version = "0.1.0" }

[lints]
workspace = true
