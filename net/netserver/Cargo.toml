[package]
name = "netserver"
description = "QS/400 NetServer: an SMB 2.0.2 to 3.1.1 server with NTLMv2 over SPNEGO, signing, encryption, leases and durable handles, and srvsvc/wkssvc RPC, over backend traits"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
# The SMB2/3 protocol: rust-smb-server 0.10.0 (MIT), vendored with QS/400's hooks.
smb-server = { path = "../smb-server", version = "=0.10.0", default-features = false }

[lints]
workspace = true
