[package]
edition = "2024"
rust-version = "1.95"
name = "smb-server"
version = "0.10.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "SMB2/3 file-sharing server library with pluggable storage backends."
readme = "README.md"
license = "MIT"
repository = "https://github.com/paltaio/rust-smb-server"
resolver = "2"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["localfs"]
# QS/400: `smb_server::fuzzing` without `--cfg fuzzing`, for tools/fuzz.
fuzzing = []
discovery = [
    "dep:mdns-sd",
    "dep:zbus",
    "dep:if-addrs",
    "dep:quick-xml",
    "socket2/all",
    "uuid/v8",
    "windows-sys/Win32_Foundation",
    "windows-sys/Win32_NetworkManagement_Dns",
    "windows-sys/Win32_System_SystemInformation",
]
localfs = [
    "dep:cap-std",
    "dep:cap-primitives",
    "dep:rustix",
    "dep:windows-sys",
]

[lib]
name = "smb_server"
path = "src/lib.rs"

