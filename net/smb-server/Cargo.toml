version = "1.40"
features = [
    "full",
    "test-util",
]

[dev-dependencies.tracing-subscriber]
version = "0.3"

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies.mdns-sd]
version = "0.21.6"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.zbus]
version = "6.2"
features = ["tokio"]
optional = true
default-features = false

[target."cfg(unix)".dependencies.libc]
version = "0.2.173"

[target."cfg(unix)".dependencies.quick-xml]
version = "0.42"
optional = true

[target."cfg(unix)".dependencies.rustix]
version = "1"
features = ["fs"]
optional = true

[target."cfg(windows)".dependencies.cap-primitives]
version = "~3.4"
