# Configuration for HTTP server instance WEBSTORE
# Generated by QS/400 HTTP Server Administration 10/27/26 18:40:55
ServerRoot /www/webstore
Listen *:80
Listen *:443
DocumentRoot /www/webstore/htdocs
ServerName webstore.quartz.example
ServerUserID QTMHHTTP
ThreadsPerChild 40
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog logs/access_log combined
ErrorLog logs/error_log
LogLevel warn
LogMaint logs/access_log 30 0
LogMaint logs/error_log 30 0
DirectoryIndex index.html index.htm
Options -Indexes +FollowSymLinks

Alias /images/ /www/shared/images/
Alias /downloads/ /home/WEBSTORE/downloads/
ScriptAlias /cgi-bin/ /QSYS.LIB/WEBSTORE.LIB/

<Directory />
   Order Deny,Allow
   Deny From all
</Directory>
<Directory /www/webstore/htdocs>
   Order Allow,Deny
   Allow From all
</Directory>
<Directory /www/webstore/admin>
   Order Deny,Allow
   Deny From all
   Allow From 10.0.0.0/8
   AuthType Basic
   AuthName "Web store administration"
   PasswdFile WEBSTORE/ADMINS
   Require valid-user
</Directory>

<VirtualHost *:443>
   SSLEngine On
   SSLAppName QS400_HTTP_SERVER_WEBSTORE
   SSLProtocolDisable TLSv1 TLSv1.1
</VirtualHost>
