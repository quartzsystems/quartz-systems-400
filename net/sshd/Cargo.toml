[package]
name = "sshd"
description = "QS/400 SSH-2 server: transport over graviola, sshd_config subset, password and public-key sign-on, QSH sessions, SFTP v3 and scp over the IFS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
release = { path = "../../lic/release", version = "0.1.0" }
ifs = { path = "../../ifs/ifs", version = "0.1.0" }
sockets = { path = "../../net/sockets", version = "0.1.0" }
qsh = { path = "../../qsh/qsh", version = "0.1.0" }
# Key exchange, host keys, AES-GCM, hashes and randomness: pure Rust.
graviola = "=0.4.1"
base64ct = { version = "=1.8.3", features = ["alloc"] }

[dev-dependencies]
sec = { path = "../../security/sec", version = "0.1.0" }
store = { path = "../../storage/store", version = "0.1.0" }
blockdev = { path = "../../lic/blockdev", version = "0.1.0" }
qsname = { path = "../../storage/qsname", version = "0.1.0" }
ccsid = { path = "../../storage/ccsid", version = "0.1.0" }

[lints]
workspace = true
