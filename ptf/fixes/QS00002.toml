#
# QS00002: the fixes after QS00001. A LIC PTF (this build's slot A and B
# images) and the message file whose messages changed.
# `cargo run -p build -- ptf ptf/fixes/QS00002.toml`; the tag
# `ptf-QS00002` builds and signs it in CI (docs/releasing.md).

ptf = "QS00002"
product = "QS00SS1"
kind = "delayed"
lic = "*BUILD"
prereqs = ["QS00001"]
cover = """
Fixes after QS00001: TLS sessions, automatic sign-on, devices and Navigator.

Problem corrected:
- A display device in use when the system ended stayed in recovery
  pending after the IPL and refused sessions that named it.
- An Access for Web 5250 session with TLS ended at once: the session
  did not trust the system's own Telnet certificate. Keys and clicks
  took effect slowly.
- Telnet on port 992 made a new certificate each time it started, so
  clients saw a different certificate after every restart. The system's
  certificate is now kept for every server.
- Automatic sign-on with a password over TLS was refused without a
  reason; refusals now go to QSYSOPR as TCP1A64.
- Navigator: the PTF list showed no load date; System activity showed
  0.0 CPU on its first display; utilization bars in shaded rows were
  empty; the ASP's protection did not name the RAID level. System
  status now shows main storage in use and the jobs holding the most.

What the PTF changes:
- Replaces the Licensed Internal Code, and message file QSYS/QTCPMSG
  (TCP1A64, an automatic sign-on refused).
- A replaced object that a job holds goes to QRPLOBJ.

Special instructions:
- QS00001 is a prerequisite.
- This PTF replaces the Licensed Internal Code. APYPTF writes the new
  image into the slot not in use; the next IPL starts from it.
  RMVPTF and an IPL return to the previous image.
"""

[[object]]
library = "QSYS"
name = "QTCPMSG"
type = "*MSGF"
