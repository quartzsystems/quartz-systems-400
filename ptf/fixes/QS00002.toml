#
# QS00002: the fixes after QS00001. A LIC PTF (this build's slot A and B
# images) and the message file whose messages changed.
# `cargo run -p build -- ptf ptf/fixes/QS00002.toml`; the tag
# `ptf-QS00002` builds and signs it in CI (docs/releasing.md).

ptf = "QS00002"
product = "QS00SS1"
kind = "delayed"
lic = "*BUILD"
prereqs = ["QS00001"]
cover = """
Fixes after QS00001: TLS sessions, sign-on, name servers, devices, fixes
and the web consoles.

Problem corrected:
- A display device in use when the system ended stayed in recovery
  pending after the IPL and refused sessions that named it. This held
  for every virtual device: displays the system named, displays a
  client named (DEVNAME) and printer sessions' devices.
- An Access for Web 5250 session with TLS ended at once: the session
  did not trust the system's own Telnet certificate. Keys, clicks and
  cursor moves took effect slowly: the browser redrew the whole screen
  for each one. It now redraws only what changed.
- An Access for Web 5250 session that could not connect showed "Not
  found" with a garbled message. It now shows the disconnected screen
  with the reason, and a session the Access for Web job did not answer
  in time is no longer reported as refused.
- Checking for fixes offered a cumulative package whose PTFs were all
  on the system already. Navigator's Fixes showed every fix as 0.0 MB
  released today; it now shows the size and the package's date.
- Telnet on port 992 made a new certificate each time it started, so
  clients saw a different certificate after every restart. The system's
  certificate is now kept for every server.
- Automatic sign-on with a password over TLS was refused without a
  reason; refusals now go to QSYSOPR as TCP1A64.
- The name servers of CHGTCPDMN did not reach the system's own clients:
  checking for fixes ended with CPF8C24 (failed to look up the address),
  as did SNDSMTPEMM, the FTP client and QSYS2.HTTP functions by name.
- Navigator: the PTF list showed no load date; System activity showed
  0.0 CPU on its first display; utilization bars in shaded rows were
  empty; the ASP's protection did not name the RAID level. System
  status now shows main storage in use and the jobs holding the most.
- Navigator, HTTP Server Administration and Access for Web: Close window
  on a help page did nothing; it now returns to the previous page, or
  closes a help window of its own.

New function:
- In Navigator, HTTP Server Administration and Access for Web, every
  list sorts by a click on a column's heading (A to Z, then Z to A,
  then the original order) and has a filter under each heading that
  keeps the rows containing its text. Both work on the rows the page
  shows.

What the PTF changes:
- Replaces the Licensed Internal Code, and message file QSYS/QTCPMSG
  (TCP1A64, an automatic sign-on refused).
- A replaced object that a job holds goes to QRPLOBJ.

Special instructions:
- QS00001 is a prerequisite.
- This PTF replaces the Licensed Internal Code. APYPTF writes the new
  image into the slot not in use; the next IPL starts from it.
  RMVPTF and an IPL return to the previous image.
- Devices held in use since before this PTF are freed by the IPL that
  starts the new image.
"""

[[object]]
library = "QSYS"
name = "QTCPMSG"
type = "*MSGF"
