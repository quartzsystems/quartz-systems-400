#
# QS00004: the fixes after QS00003. A LIC PTF (this build's slot A and B
# images) and the message file whose messages changed. The first line of
# the cover letter is the PTF's description: keep it to one line.
# `cargo run -p build -- ptf ptf/fixes/QS00004.toml`; the tag
# `ptf-QS00004` builds and signs it in CI (docs/releasing.md).

ptf = "QS00004"
product = "QS00SS1"
kind = "delayed"
lic = "*BUILD"
prereqs = ["QS00003"]
cover = """
Fixes after QS00003: automatic sign-on, web 5250, Navigator fixes, wording.

Problem corrected:
- Automatic sign-on with a one-time ticket (Access for Web, QS/400
  Access for Desktop) was always refused: the system accepted a ticket
  only from the Telnet server's own job, not from the session's job.
  The refused ticket was then tried as a password, so each attempt
  counted as a wrong password and could disable the profile
  (QMAXSIGN, QMAXSGNACN). A ticket is now never tried as a password.
- Message TCP1A64 showed no user, device or reason.
- Access for Web 5250: a session whose system name was not this
  system's current name was refused ("Connection to ... refused")
  without connecting, even when its host was this system. A session to
  any of this system's names, localhost or one of its own addresses now
  connects; a refusal names the system to choose. A failed Connect no
  longer shows its message twice.
- Navigator: Apply PTF with "Schedule IPL now" applied the PTFs but did
  not IPL. The system now ends its jobs and restarts one minute after
  the PTFs are applied.
- Navigator: the cover letter of a fix still on the update server was
  "not found". Its letter is now ordered from the update server (only
  the letter; nothing is loaded) and shown. A cumulative package shows
  the letters of its PTFs this system has not applied.
- Checking for fixes counted a PTF whose save file or cover letter
  alone had arrived as on the system, and stopped offering the
  cumulative package once its manifest had arrived.
- Navigator's PTFs page showed "Cumulative level ." with no package
  installed; it now shows None.
- Message CPI3599 read "1 fixes are available"; it now gives the count
  after the sentence.
- Text named the company "Quartz" instead of "Quartz Systems": the
  update server in Navigator, the FTP server's greeting and status, the
  certificate store errors, product packaging and command help.

New function:
- Navigator: System > Power down / IPL ends every job and IPLs the
  system or powers it off (PWRDWNSYS): controlled with a delay or
  immediately, from the next image or slot A or B, after a
  confirmation. It needs special authority *JOBCTL.

What the PTF changes:
- Replaces the Licensed Internal Code, and message file QSYS/QCPFMSG
  (CPI3599, CPF3586).
- A replaced object that a job holds goes to QRPLOBJ.

Special instructions:
- QS00003 is a prerequisite.
- This PTF replaces the Licensed Internal Code. APYPTF writes the new
  image into the slot not in use; the next IPL starts from it.
  RMVPTF and an IPL return to the previous image.
"""

[[object]]
library = "QSYS"
name = "QCPFMSG"
type = "*MSGF"
