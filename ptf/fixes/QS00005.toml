# QS00005: the first PTF for V1R2M0. A LIC PTF (this build's slot A and
# B images); no object changed. The first line of the cover letter is
# the PTF's description: keep it to one line.
# `cargo run -p build -- ptf ptf/fixes/QS00005.toml`; the tag
# `ptf-QS00005` builds and signs it in CI (docs/releasing.md).

ptf = "QS00005"
product = "QS00SS1"
kind = "delayed"
lic = "*BUILD"
prereqs = []
cover = """
Fixes after V1R2M0: IFS free space, IFS growth, QSI system resources.

Problem corrected:
- The integrated file system reported only its volume's current free
  space, not the room in ASP 1 it grows into. A Windows copy to a
  NetServer share larger than that free space was refused before it
  started, and NFS clients and QSH df showed a nearly full file
  system. The room the IFS can still grow into, below the ASP
  threshold, now counts as both total and free space.
- The IFS checked its free space once a minute, so a large copy could
  fill it before it grew. It now checks every second and also grows
  when less than one growth step is free; after a growth fails it
  waits a minute before trying again.

New function:
- QSI: a standalone system answers a management console's request for
  its resources (capability bit 28): processors, processor used, main
  storage, the system ASP and its use, temporary storage, jobs and
  threads, as WRKSYSSTS counts them.

What the PTF changes:
- Replaces the Licensed Internal Code.

Special instructions:
- This PTF replaces the Licensed Internal Code. APYPTF writes the new
  image into the slot not in use; the next IPL starts from it.
  RMVPTF and an IPL return to the previous image.
"""
