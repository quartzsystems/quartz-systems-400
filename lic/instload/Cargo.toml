[package]
name = "instload"
description = "The installation media locator, and the media UKI's /init: the loader that takes slic and the job program from the signed media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
optical = { path = "../../media/optical", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
diskimg = { path = "../diskimg", version = "0.1.0" }
instmedia = { path = "../../media/instmedia", version = "0.1.0" }
release = { path = "../release", version = "0.1.0" }
rustix = { version = "1.1.5", features = ["fs", "mount", "process"] }

[lints]
workspace = true
