[package]
name = "svctools"
description = "QS/400 service tools: DST screens, service tools user IDs, the install flow screens"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
console = { path = "../../lic/console", version = "0.1.0" }
scrkit = { path = "../../lic/scrkit", version = "0.1.0" }
svcusers = { path = "../../lic/svcusers", version = "0.1.0" }
licpart = { path = "../../lic/licpart", version = "0.1.0" }
release = { path = "../../lic/release", version = "0.1.0" }
thiserror.workspace = true
ipc = { path = "../../work/ipc", version = "0.1.0", optional = true }

[features]
# The process-message encoding SST's storage requests carry.
wire = ["dep:ipc", "svcusers/wire"]

[dev-dependencies]
hwqual = { path = "../hwqual", version = "0.1.0" }

[lints]
workspace = true
