# QS/400 system value catalog.
#
# One [[sysval]] per IBM i system value name. The names are the
# compatibility interface; every default and every line of text here is
# Quartz's own. Fields:
#   name              the system value name
#   type              char | dec | list
#   len               characters (char) or characters per element (list)
#   elems             maximum elements (list)
#   default           the value a fresh system has
#   allowed           permitted values (char), optional
#   range             [min, max] (dec), optional
#   restart_required  the change takes effect at the next IPL
#   readonly          set by the system, never by a user
#   text              one line, Quartz-written
#   group             DATTIM EDT LIBL ALC MSG SEC STG SYSCTL NET

# ---------------------------------------------------------------- DATTIM

[[sysval]]
name = "QCENTURY"
type = "char"
len = 1
default = "1"
readonly = true
text = "Century digit: 0 for 19xx, 1 for 20xx; derived from the clock"
group = "DATTIM"

[[sysval]]
name = "QDATE"
type = "char"
len = 6
default = "000000"
readonly = true
text = "System date in QDATFMT order; derived from the clock"
group = "DATTIM"

[[sysval]]
name = "QDATETIME"
type = "char"
len = 20
default = "00000000000000000000"
readonly = true
text = "Date and time as YYYYMMDDHHMMSSmmmuuu; derived from the clock"
group = "DATTIM"

[[sysval]]
name = "QDAY"
type = "char"
len = 2
default = "01"
readonly = true
text = "Day of month, or day of year under the JUL date format; derived"
group = "DATTIM"

[[sysval]]
name = "QDAYOFWEEK"
type = "char"
len = 4
default = "*SUN"
readonly = true
text = "Day of the week as *SUN through *SAT; derived from the clock"
group = "DATTIM"

[[sysval]]
name = "QHOUR"
type = "char"
len = 2
default = "00"
readonly = true
text = "Hour of the day, 00 to 23; derived from the clock"
group = "DATTIM"

[[sysval]]
name = "QLEAPADJ"
type = "dec"
default = 0
range = [0, 3]
restart_required = true
text = "Leap year adjustment for calendars whose cycle is offset from the Gregorian one"
group = "DATTIM"

[[sysval]]
name = "QMINUTE"
type = "char"
len = 2
default = "00"
readonly = true
text = "Minute of the hour; derived from the clock"
group = "DATTIM"

[[sysval]]
name = "QMONTH"
type = "char"
len = 2
default = "01"
readonly = true
text = "Month of the year; derived from the clock"
group = "DATTIM"

[[sysval]]
name = "QSECOND"
type = "char"
len = 2
default = "00"
readonly = true
text = "Second of the minute; derived from the clock"
group = "DATTIM"

[[sysval]]
name = "QTIME"
type = "char"
len = 6
default = "000000"
readonly = true
text = "Time of day as HHMMSS; derived from the clock"
group = "DATTIM"

[[sysval]]
name = "QTIMADJ"
type = "char"
len = 30
default = "*NONE"
text = "Time adjustment source; *NONE means the clock is set only at IPL"
group = "DATTIM"

[[sysval]]
name = "QTIMZON"
type = "char"
len = 10
default = "QN0000UTC"
text = "Time zone description that converts the UTC clock to local time"
group = "DATTIM"

[[sysval]]
name = "QUTCOFFSET"
type = "char"
len = 5
default = "+0000"
readonly = true
text = "Offset of local time from UTC as sHHMM; derived from QTIMZON"
group = "DATTIM"

[[sysval]]
name = "QYEAR"
type = "char"
len = 2
default = "00"
readonly = true
text = "Last two digits of the year; derived from the clock"
group = "DATTIM"

