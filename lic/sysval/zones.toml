# The time zone descriptions QS/400 ships in QSYS (*TIMZON), IBM's set as
# the primary oracle (V7R1M0) lists them with WRKTIMZON
# (tools/conformance/oracle/timzon/). Names, offsets (minutes east of
# UTC), abbreviations, message identifiers and alternate names are the
# compatibility interface; the message texts below are Quartz's.
#
# A zone's daylight saving rule comes from the IANA tz database vendored
# in tzdata/: `year` names the year whose rule of the `alt` zone the
# description holds (the build reads it from tzdata). IBM ships some
# variants whose rule no tzdata year gives; those carry `start`, `end`
# and `shift` as IBM has them (MONTH DAY WEEK HH:MM:SS, WEEK 1 to 4 or
# LAST). A zone without `dst` has no saving; its `year`, when given,
# only checks the offset against tzdata.

[[zone]]
name = "Q0000GMT"
offset = 0
std = ["GMT", "CPX0911"]
alt = "GMT"
year = 2026

