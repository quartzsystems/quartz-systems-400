fns = ["change_attr", "replace_formats"]

[file."database/db/src/file/mod.rs"]
reason = "creation is checked by the store's create (lib.create-in on the library); describe and dependents are called after the caller's check; prune_dependents only from RSTOBJ/RSTLIB on a file the restore just made, after the hooks allowed it (obj.restore or lib.create-in); add_lf_member_paused is called by add_lf_member and by CRTLF (svc/db/files.rs build_lf_member) and CREATE INDEX/VIEW (sql exec/ddl.rs) right after create_lf, which checked lib.create-in and file.base-on on each based-on file"
fns = ["create_pf", "create_pf_rcdlen", "create_pf_fields", "create_srcpf", "describe", "add_lf_member", "add_dependent", "prune_dependents", "add_lf_member_paused"]

