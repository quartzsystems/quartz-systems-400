# Store, database, journal and work management functions that reach
# the store without checking authority themselves, and why.
# security/sec/tests/exempt.rs fails on a function that checks nothing
# and is not here, and on an entry here that no longer needs to be.

[file."database/db/src/cmt/mod.rs"]
reason = "commitment control acts on the job's own commitment definition; the files were checked when opened; savepoints and their rollbacks are the job's own, as IBM needs no authority for SAVEPOINT, RELEASE and ROLLBACK TO SAVEPOINT"
fns = ["start", "begin_change", "commit", "rollback", "end", "rollback_paused", "set_savepoint", "nest_savepoint", "rollback_to_savepoint"]

[file."database/db/src/chg/mod.rs"]
reason = "chgpf_srcfile only calls chgpf_srcfile_paused, which checks the file (file.change)"
fns = ["chgpf_srcfile"]

