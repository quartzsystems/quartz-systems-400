[workspace]
resolver = "3"
members = [
    # Host tools: the build orchestrator and the conformance harness.
    "tools/build",
    "tools/conformance",
    # Licensed Internal Code: IPL, platform, console, DST, disks.
    "lic/slic",
    "lic/licpart",
    "lic/sysval",
    "lic/release",
    "lic/console",
    "lic/svctools",
    "lic/diskimg",
    "lic/blockdev",
    # Object store and the names and code pages it holds.
    "storage/store",
    "storage/qsname",
    "storage/ccsid",
    # Database: DDS, decimal, files, journals, SQL.
    "database/db",
    "database/dds",
    "database/jrn",
    "database/sql",
    "database/qdecimal",
    # ILE: IR, code generator, runtime, objects, APIs, messages.
    "runtime/qir",
    "runtime/codegen",
    "runtime/mi",
    "runtime/ile",
    "runtime/sysapi",
    "runtime/msgf",
    # Work management: jobs, spooling, process messages.
    "work/wm",
    "work/qsjob",
    "work/spool",
    "work/ipc",
    "work/stg",
    "work/print",
    # Security: profiles, passwords, authority, auditing.
    "security/sec",
    "security/pwdsub",
    # Commands: definitions, the analyzer, the prompter, CL, the system command set.
    "command/cmd",
    "command/sys-cpps",
    "command/cl",
    # User interface: TN5250E, display files, UIM, menus, developer tools.
    "ui/tn5250",
    "ui/dspf",
    "ui/uim",
    "ui/menus",
    "tools/tn5250-driver",
    "tools/rpg-oracle",
    # Developer tools: SEU, PDM, SDA, DFU, RLU, the debugger screens,
    # interactive SQL, SST (the job's drivers are in work/qsjob/src/devtools).
    "devtools/seu",
    "devtools/pdm",
    "devtools/sda",
    "devtools/dfu",
    "devtools/dbg",
    "devtools/isql",
    "devtools/sst",
    "devtools/edtf",
    "devtools/qshterm",
    # ILE RPG: the spec tables, the compiler, its runtime.
    "rpg/specs",
    "rpg/front",
    "rpg/compiler",
    "rpg/qrpgrt",
    "rpg/sqlpre",
    # Integrated file system: the namespace, metadata, authority, locks;
    # the object store seen as /QSYS.LIB.
    "ifs/ifs",
    "ifs/xfsfmt",
    "ifs/qsyslib",
    "ifs/ifscmd",
    # Network: the kernel interfaces, TCP/IP configuration, sockets, servers.
    "net/netlink",
    "net/hostsvr",
    "net/hostserver",
    "net/certs",
    "net/tls",
    "net/sockets",
    "net/regfac",
    "net/cmncfg",
    "net/sshd",

    "net/tcpcfg",

    "net/ddm",
    "net/servers",
    "net/nettools",
    "net/ntp",
    "net/lpd",
    "net/mail",
    "net/ftp",
    # Save and restore: the save stream, the engine.
    "save/savfmt",
    "save/saverst",
    # PTFs: the format, load, apply and remove, groups.
    "ptf/ptf",
    # QSH: the Qshell command language and its utilities.
    "qsh/qsh",
    "qsh/qsh-utils",
    "qsh/qsh-job",
    "qsh/pase",
    # Licensed programs: products, loads, license keys.
    "licpgm/licpgm",
    # The PASE test fixture, built by the harness and never shipped.
    "tools/pase-probe",
    # Media: tape, optical, image catalogs.
    "media/tape",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
hex = "0.4.3"
crc = "3.4.0"
uuid = "1.28.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the conventions in CLAUDE.md.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The store's property tests do hundreds of thousands of tree operations;
# unoptimized they take minutes.
[profile.test.package.store]
opt-level = 2

# Argon2 unoptimized takes seconds per password hash.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3

# RSA key generation and TLS handshakes in the certificate and TLS tests.
[profile.dev.package.graviola]
opt-level = 3
[profile.test.package.graviola]
opt-level = 3

# Release profile is shared by the image binaries and the host tools.
# The PASE test fixture is pushed over the serial console: small.
[profile.release.package.pase-probe]
opt-level = "z"
strip = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
