[workspace]
resolver = "3"
members = [
    "build",
    "slic",
    "conformance",
    "licpart",
    "sysval",
    "console",
    "release",
    "blockdev",
    "store",
    "ccsid",
    "qsname",
    "diskimg",
    "svctools",
    "dds",
    "qdecimal",
    "db",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
hex = "0.4.3"
crc = "3.4.0"
uuid = "1.28.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the conventions in CLAUDE.md.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The store's property tests do hundreds of thousands of tree operations;
# unoptimized they take minutes.
[profile.test.package.store]
opt-level = 2

# Release profile is shared by the image binaries and the host tools.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
