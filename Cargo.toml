[workspace]
resolver = "3"
members = [
    # Host tools: the build orchestrator and the conformance harness.
    "tools/build",
    "tools/conformance",
    # Licensed Internal Code: IPL, platform, console, DST, disks.
    "lic/slic",
    "lic/licpart",
    "lic/sysval",
    "lic/release",
    "lic/console",
    "lic/svctools",
    "lic/diskimg",
    "lic/blockdev",
    # Object store and the names and code pages it holds.
    "storage/store",
    "storage/qsname",
    "storage/ccsid",
    # Database: DDS, decimal, files, journals, SQL.
    "database/db",
    "database/dds",
    "database/jrn",
    "database/sql",
    "database/qdecimal",
    # ILE: IR, code generator, runtime, objects, APIs, messages.
    "runtime/qir",
    "runtime/codegen",
    "runtime/mi",
    "runtime/ile",
    "runtime/sysapi",
    "runtime/msgf",
    # Work management: jobs, spooling, process messages.
    "work/wm",
    "work/qsjob",
    "work/spool",
    "work/ipc",
    "work/stg",
    # Security: profiles, passwords, authority, auditing.
    "security/sec",
    # Commands: definitions, the analyzer, the prompter, CL, the system command set.
    "command/cmd",
    "command/sys-cpps",
    "command/cl",
    # User interface: display files and the 5250 data stream.
    "ui/dspf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
hex = "0.4.3"
crc = "3.4.0"
uuid = "1.28.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the conventions in CLAUDE.md.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The store's property tests do hundreds of thousands of tree operations;
# unoptimized they take minutes.
[profile.test.package.store]
opt-level = 2

# Argon2 unoptimized takes seconds per password hash.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3

# Release profile is shared by the image binaries and the host tools.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
