# The inventory: what the command name alone does not say. A command
# runs in the storage service unless `site` says "job" (calls, the
# debugger, the job's own displays) or `stub` names the message its
# processing program sends instead of working (a later phase). `cpp`
# names the processing program when it is not QC plus the name; `comp`
# a completion message with the keywords whose values fill it; `word`
# the console word of the library function the bridge calls;
# `alwlmtusr` lets a limited user type the command.

[cmd.CRTLIB]
comp = "CPC2102"
comp_data = ["LIB"]

[cmd.DLTLIB]
comp = "CPC2194"
comp_data = ["LIB"]

[cmd.CHKOBJ]
note = "no completion message; a refusal is the escape"

# ----------------------------------------------------------- the job's

[cmd.CALL]
site = "job"

[cmd.RCLACTGRP]
site = "job"

[cmd.STRDBG]
site = "job"

[cmd.ENDDBG]
site = "job"

[cmd.ADDBKP]
site = "job"

[cmd.RMVBKP]
site = "job"

[cmd.DSPBKP]
site = "job"

[cmd.DSPJOBLOG]
site = "job"
alwlmtusr = true

[cmd.STRSBS]
site = "job"

[cmd.DLYJOB]
site = "job"

[cmd.SBMJOB]
site = "job"

[cmd.PWRDWNSYS]
site = "job"

[cmd.ENDSYS]
site = "job"

[cmd.WRKJOB]
site = "job"

[cmd.CHGPWD]
site = "job"

[cmd.DSCJOB]
site = "job"

[cmd.SIGNOFF]
site = "job"
alwlmtusr = true

[cmd.DSPMSG]
alwlmtusr = true

[cmd.DSPJOB]
alwlmtusr = true

[cmd.WRKMSG]
alwlmtusr = true

[cmd.SNDMSG]
alwlmtusr = true

# ------------------------------------------------------- later phases

[cmd.SAVLIB]
stub = "CPF3700"
note = "save and restore are Phase 11"

[cmd.RSTLIB]
stub = "CPF3700"
note = "save and restore are Phase 11"

[cmd.CHKTAP]
stub = "CPF3700"
note = "tape is Phase 11"

[cmd.STRSST]
stub = "CPF0901"
note = "system service tools at a display are Phase 8"
