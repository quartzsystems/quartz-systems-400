# Help texts of single commands: `about` is what the command does (the
# definition's comment is used when it is missing), `notes` a paragraph
# after it, `KWD` a parameter's opening text and "KWD.*VALUE" what a
# value means for that parameter. Paragraphs are separated by a blank
# line.

[CHGDEVD]
about = "Use the Change Device Description (CHGDEVD) command to change the attributes that every device description has, whatever its category."

[CHGQAPA]
about = "Use the Change QAP Attributes (CHGQAPA) command to change the attributes of the QAP server, kept in the TCP/IP server table in QUSRSYS and read when the server starts."

[TRCINT]
about = "Use the Trace Internal (TRCINT) command to start, stop and list the system's internal trace points, for problem analysis with your service provider."

[CHGDDMTCPA]
about = "Use the Change DDM TCP/IP Attributes (CHGDDMTCPA) command to change the attributes of the DDM and DRDA server: whether it starts with TCP/IP and how clients must authenticate. The server reads them when it starts."

[OTHERWISE]
about = "OTHERWISE starts the group of commands of a SELECT group that runs when no WHEN condition is true. It is valid only in a CL program or procedure."

[WRKF]
about = "Use the Work with Files (WRKF) command to show a list of files and work with them through options."

[WRKLIB]
about = "Use the Work with Libraries (WRKLIB) command to show a list of libraries and work with them through options."

[WRKOBJ]
about = "Use the Work with Objects (WRKOBJ) command to show a list of objects and work with them through options."

[WRKOBJLCK]
about = "Use the Work with Object Locks (WRKOBJLCK) command to show the jobs that hold or wait for locks on an object, and release them."

[WRKMSG]
about = "Use the Work with Messages (WRKMSG) command to show the messages of a message queue, answer them and remove them."

[WRKMSGD]
about = "Use the Work with Message Descriptions (WRKMSGD) command to show the message descriptions of a message file and work with them."

[WRKMSGQ]
about = "Use the Work with Message Queues (WRKMSGQ) command to show a list of message queues and work with them."

[WRKRPYLE]
about = "Use the Work with Reply List Entries (WRKRPYLE) command to show the entries of the system reply list and work with them."

[STRTCPFTP]
about = "Use the Start TCP/IP File Transfer (STRTCPFTP) command, or its short form FTP, to start the FTP client and transfer files with a remote system."

[INSLNG]
about = "Use the Install Language (INSLNG) command to install a secondary language: the language library QSYS followed by the feature code, holding the language's message files and its sign-on display files. Put the library ahead of QSYS in the system part of the library list to see its text; a job whose language identifier is the library's language gets it there at its start and on CHGJOB LANGID. In this release the only secondary language shipped is Spanish (2931), a scaffold whose message files carry machine-translated first-level text only."
LNG = "The feature code of the language to install, such as 2931 for Spanish. The library made is QSYS followed by the code."
REPLACE = "Whether the language's objects that are already in its library are replaced with the ones the system carries. Objects missing from the library are always created."

[ADDPFTRG]
about = "Use the Add Physical File Trigger (ADDPFTRG) command to add a trigger to a physical file: a program the system calls whenever a record of the file is inserted, deleted, updated or read, before or after the change, in the job that makes it."
notes = "The program gets two parameters: the trigger buffer, with the file's name, the event, the time and the record before and after the change, and the buffer's length. A before trigger that ends in an escape message stops the change. The trigger is in effect from the next open of the file."
FILE = "The physical file the trigger is added to, by name and library."
TRGTIME = "Whether the program is called before or after the change. A read trigger is always called after the read."
TRGEVENT = "The change that calls the program: a record inserted, deleted, updated or read."
PGM = "The trigger program, by name and library. It must exist when the trigger is added."
RPLTRG = "Whether a trigger of the same name and library on the file is replaced. A replaced trigger keeps its place in the order the file's triggers are called."
TRG = "The trigger's name, up to 128 characters. *GEN gives it a name made of QSYS_TRIG_, the library, the file and a number."
TRGLIB = "The library the trigger's name belongs to. *FILE is the file's library."
ALWREPCHG = "Whether the program may change the record: a before trigger's change of the new record in the buffer is written to the file."
TRGUPDCND = "For an update trigger: whether the program is called for every update, or only when the update changes the record."
THDSAFE = "Whether the trigger program is safe to call in a job with several threads. It is kept for the catalogs."
MLTTHDACN = "What happens when the trigger is called in a job with several threads. It is kept for the catalogs."

[RMVPFTRG]
about = "Use the Remove Physical File Trigger (RMVPFTRG) command to remove triggers from a physical file: one by name, or every trigger at a time and for an event. The trigger programs are not deleted."
FILE = "The physical file the triggers are removed from, by name and library."
TRGTIME = "The time of the triggers removed when no trigger name is given; *ALL for both."
TRGEVENT = "The event of the triggers removed when no trigger name is given; *ALL for every event."
TRG = "The trigger removed, by name; *ALL for the triggers TRGTIME and TRGEVENT name."
TRGLIB = "The library of the trigger's name; *ALL for any library."

[CHGPFTRG]
about = "Use the Change Physical File Trigger (CHGPFTRG) command to enable or disable triggers of a physical file. A disabled trigger is kept but its program is not called."
FILE = "The physical file whose triggers change, by name and library."
TRG = "The trigger changed, by name; *ALL for every trigger of the file."
TRGLIB = "The library of the trigger's name. A trigger name needs its library."
STATE = "Whether the triggers are enabled or disabled. *SAME leaves them as they are."

[RUNSQL]
OPTION = "Whether a listing of the statement is printed when the statement fails."

[RUNSQLSTM]
OPTION = "Whether the listing of the statements is printed."
USRPRF = "The user profile the statements run under: the user's, the owner's, or the one the naming convention implies."

[ENDSBS]
BCHTIMLMT = "How long, in minutes, the system stays in the batch restricted state. With SBS(*ALL), run from a batch job that came from a job queue of the controlling subsystem, every subsystem ends and that job alone keeps running. When it ends, or its time runs out and the system ends it, the controlling subsystem starts again. A batch job of the controlling subsystem cannot end every subsystem without it, and no other job may give it."
"BCHTIMLMT.*NOMAX" = "No limit: the state lasts until the job ends."
[CRTTIMZON]
about = "Use the Create Time Zone Description (CRTTIMZON) command to create a time zone description in library QSYS: an offset from UTC, the names of standard and daylight saving time and the rule that starts and ends daylight saving time. The QTIMZON system value names the description the system's local time follows."
TIMZON = "The name of the time zone description to create. It is created in QSYS."
OFFSET = "The difference between standard time in the zone and UTC, in minutes: negative west of Greenwich, positive east of it."
STDNAME = "The abbreviated and full names of standard time. *GEN makes the abbreviation from the offset; *MSG takes both names from the message STDMSG names."
DSTNAME = "The abbreviated and full names of daylight saving time. *NONE means the zone keeps no daylight saving time; *MSG takes both names from the message DSTMSG names."
STDMSG = "The message that holds the names of standard time when STDNAME(*MSG) is given."
DSTMSG = "The message that holds the names of daylight saving time when DSTNAME(*MSG) is given."
MSGF = "The message file of STDMSG and DSTMSG."
DSTSTR = "When daylight saving time starts: the month, the day of the week, which of those days in the month (the first to the fourth, or the last) and the local standard time."
DSTEND = "When daylight saving time ends: the month, the day of the week, which of those days in the month and the local daylight saving time."
DSTSHIFT = "How many minutes the clock moves forward when daylight saving time starts."
YEAROFS = "The number of years added to the Gregorian year when the zone's dates are shown."
ALTNAME = "Another name for the zone, such as the name the IANA time zone database gives it."
TEXT = "A description of the time zone description."
AUT = "The authority the public has to the time zone description."

[CHGTIMZON]
about = "Use the Change Time Zone Description (CHGTIMZON) command to change a time zone description in QSYS. When the description is the one the QTIMZON system value names, the system's local time and QUTCOFFSET follow the change at once."
TIMZON = "The time zone description to change."
OFFSET = "The difference between standard time in the zone and UTC, in minutes."
STDNAME = "The abbreviated and full names of standard time."
DSTNAME = "The abbreviated and full names of daylight saving time; *NONE removes daylight saving time from the zone."
STDMSG = "The message that holds the names of standard time."
DSTMSG = "The message that holds the names of daylight saving time."
MSGF = "The message file of the messages."
DSTSTR = "When daylight saving time starts."
DSTEND = "When daylight saving time ends."
DSTSHIFT = "How many minutes the clock moves forward when daylight saving time starts."
YEAROFS = "The number of years added to the Gregorian year."
ALTNAME = "Another name for the zone."
TEXT = "A description of the time zone description."

[DLTTIMZON]
about = "Use the Delete Time Zone Description (DLTTIMZON) command to delete time zone descriptions from QSYS. The description the QTIMZON system value names cannot be deleted."
TIMZON = "The time zone description to delete, or a generic name for every description that starts with it."

[WRKTIMZON]
about = "Use the Work with Time Zone Descriptions (WRKTIMZON) command to show the time zone descriptions in QSYS and change, delete, display or print them, or make one the system's time zone. The description the QTIMZON system value names is marked with a greater-than sign."
TIMZON = "The time zone descriptions to show: a name, a generic name, or *ALL."

# --- NFS, the RPC binder and mounted file systems (docs/NFS.md)

[STRNFSSVR]
about = "Use the Start NFS Server (STRNFSSVR) command to start the Network File System server daemons: one type, or every type in the order NFS needs them. Each daemon is a job in subsystem QSYSWRK; the command waits for it to report that it is ready. You need *IOSYSCFG special authority."
notes = "The RPC binder is started first when a daemon that registers with it is asked for and the binder is not running. A daemon already running is left as it is and reported with a diagnostic message."
SERVER = "The type of daemon to start, or *ALL for every type: *RPC the binder (port 111), *BIO the block I/O daemons of the client, *RGY the NFSv4 identity mapping, *SVR the server (port 2049), *MNT the mount daemon, *NSM the status monitor and *NLM the lock manager. *GSS is refused: Kerberos is not supported."
"SERVER.*ALL" = "Every daemon type, started in the order *RPC, *BIO, *RGY, *SVR, *MNT, *NSM, *NLM."
"SERVER.*GSS" = "The Kerberos daemon, which this system does not have: the command fails."
NBRSVR = "How many server daemon jobs (*SVR) to start, from 1 to 20. Several jobs share the connections of the clients. Only with SERVER(*SVR) or SERVER(*ALL)."
NBRBIO = "How many block I/O daemon jobs (*BIO) to start, from 1 to 20: they read ahead and write behind for this system's NFS mounts. Only with SERVER(*BIO) or SERVER(*ALL)."
RTVRPCREG = "Whether the binder starts with the registrations it saved in /etc/RPCBTAB when it last ended. Only with SERVER(*RPC) or SERVER(*ALL)."
"RTVRPCREG.*YES" = "The saved registrations are read back."
"RTVRPCREG.*NO" = "The binder starts with no registrations."
STRJOBTIMO = "How many seconds to wait for each daemon to report that it is ready, from 1 to 3600. When the time passes the command stops with a message saying the daemon may not have started."
"STRJOBTIMO.*NOMAX" = "Wait as long as it takes."

[ENDNFSSVR]
about = "Use the End NFS Server (ENDNFSSVR) command to end the Network File System server daemons: one type, or every type in the reverse of the order they start in. You need *IOSYSCFG special authority."
SERVER = "The type of daemon to end, or *ALL for every type running. *GSS is refused: Kerberos is not supported."
"SERVER.*ALL" = "Every daemon type running, ended in the order *NLM, *NSM, *MNT, *SVR, *RGY, *BIO, *RPC."
"SERVER.*GSS" = "The Kerberos daemon, which this system does not have: the command fails."
ENDJOBTIMO = "How many seconds to wait for each daemon to end, from 1 to 3600. When the time passes the command stops with a message saying the daemon may still be running."
"ENDJOBTIMO.*NOMAX" = "Wait as long as it takes."

[EXPORTFS]
about = "Use the Change NFS Export (EXPORTFS) command to make directories available to NFS clients, to change how they are exported, or to end their export. The export table lasts until the next IPL; entries kept in /etc/exports are exported again with OPTIONS('-A'). You need *IOSYSCFG special authority."
notes = "The flags of OPTIONS: -A every entry of /etc/exports; -I DIR without reading /etc/exports; -U end the export of DIR, or with -A of every entry; -F with -U, end it whatever the clients hold; -O followed by the export options; -E an escape message when an entry fails; -V a message for each entry. Export options: RO, RW=host:host, ACCESS=host:host, ROOT=host:host, ANON=uid, NOSUID, SEC=sys, VERS=3:4, PUBLIC, NFSROOT=path, EXNAME=path. A host is a name, an address, @network/length or a netgroup of /etc/netgroup."
OPTIONS = "The flags and export options, as the command's help lists them. *DFT exports DIR with the options /etc/exports gives it, or the defaults when it has no entry."
"OPTIONS.*DFT" = "Export DIR with its options from /etc/exports, or the defaults."
DIR = "The directory to export or whose export ends. Directories in /QOPT, /QDLS, /QNTC, /QFileSvr.400 and in an NFS mount cannot be exported."
HOSTOPT = "Options for some clients of the export: the host, the CCSID file data is converted to for it, the CCSID of its path names, and whether its writes are written to disk before the answer."
"HOSTOPT.*DFT" = "No host options: file data is not converted, path names are ASCII and writes are synchronous."

[CHGNFSEXP]
about = "Use the Change NFS Export (CHGNFSEXP) command to make directories available to NFS clients, to change how they are exported, or to end their export. It is EXPORTFS under another name. You need *IOSYSCFG special authority."
OPTIONS = "The flags and export options, as EXPORTFS's help lists them. *DFT exports DIR with the options /etc/exports gives it, or the defaults when it has no entry."
"OPTIONS.*DFT" = "Export DIR with its options from /etc/exports, or the defaults."
DIR = "The directory to export or whose export ends."
HOSTOPT = "Options for some clients of the export: the host, the CCSID file data is converted to for it, the CCSID of its path names, and whether its writes are written to disk before the answer."
"HOSTOPT.*DFT" = "No host options: file data is not converted, path names are ASCII and writes are synchronous."

[MOUNT]
about = "Use the Add Mounted File System (MOUNT) command to mount a file system over a directory: a remote NFS export, or a user-defined file system. The directory shows the file system's contents until it is unmounted or the next IPL. You need *IOSYSCFG special authority."
TYPE = "The kind of file system: *NFS an export of another system, *UDFS a user-defined file system of this one."
"TYPE.*NFS" = "An export of an NFS server, named host:path in MFS."
"TYPE.*UDFS" = "A user-defined file system, named /dev/QASPnn/name.udfs in MFS."
MFS = "The file system to mount: for *NFS the server's name or address, a colon and the path of the export; for *UDFS the path of the user-defined file system."
MNTOVRDIR = "The directory the file system is mounted over. It must exist; what it holds is hidden while the mount lasts."
OPTIONS = "Mount options, separated by commas: rw or ro, suid or nosuid, soft or hard, intr or nointr, retry=, rsize=, wsize=, timeo=, retrans=, acregmin=, acregmax=, acdirmin=, acdirmax=, actimeo=, noac, vers=, proto=, port=, mountport=, sec=sys. For *UDFS only rw and ro apply."
"OPTIONS.*DFT" = "rw,suid,retry=5,rsize=32768,wsize=32768,timeo=20,retrans=5,acregmin=30,acregmax=60,acdirmin=30,acdirmax=60,hard."
CCSID = "For *NFS: the CCSIDs the remote files' data and path names are in, so that they are converted. Not with CODEPAGE."
CODEPAGE = "For *NFS: the code pages the remote files' data and path names are in, given as code pages instead of CCSIDs. Not with CCSID."

[ADDMFS]
about = "Use the Add Mounted File System (ADDMFS) command to mount a file system over a directory: a remote NFS export, or a user-defined file system. It is MOUNT under another name. You need *IOSYSCFG special authority."
TYPE = "The kind of file system: *NFS an export of another system, *UDFS a user-defined file system of this one."
MFS = "The file system to mount: for *NFS host:path, for *UDFS the path of the user-defined file system."
MNTOVRDIR = "The directory the file system is mounted over."
OPTIONS = "Mount options, separated by commas, as MOUNT's help lists them."
"OPTIONS.*DFT" = "rw,suid,retry=5,rsize=32768,wsize=32768,timeo=20,retrans=5,acregmin=30,acregmax=60,acdirmin=30,acdirmax=60,hard."
CCSID = "For *NFS: the CCSIDs the remote files' data and path names are in. Not with CODEPAGE."
CODEPAGE = "For *NFS: the code pages of the remote files' data and path names. Not with CCSID."

[UNMOUNT]
about = "Use the Remove Mounted File System (UNMOUNT) command to unmount a file system from the directory it is mounted over, or every mounted file system at once. You need *IOSYSCFG special authority."
TYPE = "The kind of file system to unmount: *NFS, *UDFS, or *ALL for whatever is mounted there."
"TYPE.*ALL" = "Every file system mounted over the directory, or with MNTOVRDIR(*ALL) every mounted file system."
MNTOVRDIR = "The directory the file system is mounted over. *ALL unmounts every mounted file system and needs TYPE(*ALL)."
"MNTOVRDIR.*ALL" = "Every mounted file system."
MFS = "For *UDFS: the user-defined file system to unmount, instead of the directory."

[RMVMFS]
about = "Use the Remove Mounted File System (RMVMFS) command to unmount a file system from the directory it is mounted over. It is UNMOUNT under another name. You need *IOSYSCFG special authority."
TYPE = "The kind of file system to unmount: *NFS, *UDFS, or *ALL for whatever is mounted there."
MNTOVRDIR = "The directory the file system is mounted over. *ALL unmounts every mounted file system and needs TYPE(*ALL)."
"MNTOVRDIR.*ALL" = "Every mounted file system."
MFS = "For *UDFS: the user-defined file system to unmount, instead of the directory."

[DSPMFSINF]
about = "Use the Display Mounted File System Information (DSPMFSINF) command to show the attributes of the file system an object is in: its type, its size and free space, its limits, and how it is mounted."
OBJ = "A path name of any object in the file system."
OUTPUT = "Whether the information is shown or printed to a spooled file of QPRINT."
"OUTPUT.*" = "The information is shown at a display; a batch job prints it."

[STATFS]
about = "Use the Display Mounted File System Information (STATFS) command to show the attributes of the file system an object is in. It is DSPMFSINF under another name."
OBJ = "A path name of any object in the file system."
OUTPUT = "Whether the information is shown or printed to a spooled file of QPRINT."
"OUTPUT.*" = "The information is shown at a display; a batch job prints it."

[RLSIFSLCK]
about = "Use the Release File System Locks (RLSIFSLCK) command to release byte-range locks that are no longer wanted: those an NFS client holds through this system's server, or those held on an object or on its whole file system."
RMTLOCNAME = "The host name or address of an NFS client whose locks the *NLM daemon releases. Not with OBJ."
OBJ = "The object whose byte-range locks are released. Not with RMTLOCNAME."
NFSSVRLCK = "Whether the locks NFS clients hold on the object through the *NLM daemon are released."
LCLBRNGLCK = "Whether the byte-range locks local jobs hold on the object are released. Not *YES with OBJMFS(*YES)."
OBJMFS = "Whether the byte-range locks local jobs hold on every object of the object's file system are released. Not *YES with LCLBRNGLCK(*YES)."

[RPCBIND]
about = "Use the Start RPC Binder Daemon (RPCBIND) command to start the binder alone: the daemon that tells RPC clients on which ports this system's RPC programs listen (port 111). You need *IOSYSCFG special authority."
RTVRPCREG = "Whether the binder starts with the registrations it saved in /etc/RPCBTAB when it last ended."
"RTVRPCREG.*YES" = "The saved registrations are read back."
"RTVRPCREG.*NO" = "The binder starts with no registrations."

[ENDRPCBIND]
about = "Use the End RPC Binder Daemon (ENDRPCBIND) command to end the binder. Its registrations are saved in /etc/RPCBTAB for the next start. You need *IOSYSCFG special authority."
