# Help texts shared by every command: what a keyword means wherever it
# appears. A command's own file (commands.toml) wins over these. Every
# word is Quartz-written; IBM's keyword names are the interface.

[keywords]
OUTPUT = "Where the command sends what it produces: to the display of an interactive job, or to a spooled file of the job's printer file. Some commands can also write it to a database file."
TEXT = "A short description of the object, up to 50 characters, shown by the work-with and display commands next to its name."
AUT = "The authority the public (users with no private authority and no group authority) gets to the new object."
OBJ = "The object or objects the command works on, by name and library."
MSGQ = "The message queue that receives the messages the command or the object sends."
PGM = "The program the command calls or works on, by name and library."
OUTFILE = "The database file that receives the output when OUTPUT(*OUTFILE) is given. The file is created with the system's model format when it does not exist."
OUTMBR = "The member of the output file that receives the records, and whether they replace the member's records or are added after them."
OBJTYPE = "The type or types of the objects the command works on."
ASPDEV = "The auxiliary storage pool device the command works in: the system ASP and basic user ASPs, or an independent ASP group."
USRPRF = "The user profile the command uses."
CCSID = "The coded character set identifier: the code page and character set the data is in, or is to be converted to."
REPLACE = "Whether an existing object of the same name is replaced. A replaced object is moved to library QRPLOBJ when it is in use."
OUTQ = "The output queue the spooled files go to."
SRCFILE = "The source physical file that holds the source member, by name and library."
SRCMBR = "The member of the source file that holds the source. *PGM, *MODULE or *CMD and the like mean the member with the same name as the object being created."
SBSD = "The subsystem description, by name and library."
VOL = "The volume identifier of the tape or optical volume. *MOUNTED uses whatever volume is in the device."
LABEL = "The label of the file on the volume."
ENDOPT = "What the device does with the tape when the operation ends: leave it where it is, rewind it, or rewind and unload it."
JOBQ = "The job queue, by name and library."
INTNETADR = "An internet address in dotted decimal form (IPv4) or in colon form (IPv6)."
SRTSEQ = "The sort sequence table that orders and compares character data: the hexadecimal values, the job's, a language's (shared or unique weights), or a table by name."
LANGID = "The language identifier: three letters naming the language whose sort sequence is used."
EXPDATE = "The date after which the object or file can be deleted or overwritten. *PERM means it never expires."
SHARE = "Whether the open data path of the file is shared with other programs of the job that open it with SHARE(*YES): they then share the file's position and buffers."
JOBD = "The job description that supplies the job's attributes, by name and library."
MSGF = "The message file that holds the message descriptions, by name and library."
PORT = "The TCP or UDP port number."
BNDDIR = "The binding directories the binder searches for modules and service programs to resolve imports."
WAITFILE = "How many seconds the program waits for the file's resources to become available when the file is opened. *IMMED does not wait; *CLS uses the job's class."
TGTRLS = "The release of the operating system the object is created for. *CURRENT is this release; *PRV is the previous one."
AUTL = "The authorization list that secures the object."
MSGID = "A message identifier: three letters and four hexadecimal digits, CPF1234 for example."
JRN = "The journal, by name and library."
DEVD = "The device description."
SAVF = "The save file, by name and library."
TOFILE = "The file that receives the data."
SEV = "A message severity from 0 to 99. Higher numbers mean more serious conditions."
LICPGM = "A licensed program by its seven-character product identifier, 5770SS1 for example."
LVLCHK = "Whether the record format level identifiers of the file are checked against those the program was compiled with when the file is opened."
ONLINE = "Whether the device or line is varied on when the system starts (IPL)."
IMGCLG = "The image catalog, which holds the image files of a virtual tape or optical device."
PRTDEV = "The printer device the spooled output prints on."
RMTSYS = "The remote system, by host name or internet address."
ASTLVL = "The assistance level the user's displays show: basic (Operational Assistant), intermediate (the system displays) or advanced."
MBROPT = "What happens to an existing member that receives data: its records are replaced, or the new records are added after them."
OPTFILE = "The path of the file on the optical volume."
CLS = "The class, which holds the run attributes (priority, time slice, purge) a routing step uses."
RMTLOCNAME = "The remote location name of the system at the other end of the connection."
CURLIB = "The current library of the job: the library searched first by name (after the system part of the library list) and where *CURLIB puts new objects."
WSCST = "The workstation customizing object that describes the printer to the host print transform."
DTACPR = "Whether the data is compressed as it is written."
SPLNBR = "The number of the spooled file among the job's spooled files of the same name."
JOBSYSNAME = "The name of the system the job ran on, which tells apart spooled files that came from other systems."
OPNID = "The open file identifier the file was opened with."
SRCSTMF = "The path of the stream file that holds the source. When it is given, SRCFILE and SRCMBR are not used."
RLS = "A release, in the form VxRyMz."
RSRCNAME = "The hardware resource name, as WRKHDWRSC shows it."
OUTPTY = "The priority of the job's spooled files on the output queue, from 1 (highest) to 9 (lowest)."
PRTTXT = "Up to 30 characters printed at the bottom of every page of the job's printed output."
WAITRCD = "How many seconds the program waits for a record that another job has locked."
MEDDFN = "The media definition, which lists the devices and settings a parallel save or restore uses."
FROMFILE = "The file the data comes from."
MSG = "The text of the message."
LCLLOCNAME = "The local location name this system uses on the connection."
RMTNETID = "The network identifier of the remote location."
LIND = "The line description."
DUPJOBOPT = "What happens when more than one job matches the name given: show a list to choose from, or send a message."
JRNRCV = "The journal receiver, by name and library."
GENLVL = "The severity of the compile messages at or above which the object is not created."
COMPACT = "Whether the device compacts data as it writes it to the tape."
ACTGRP = "The activation group the program runs in: a named one, a new one each call, or the caller's."
MODULE = "The modules bound into the program or service program."
DATFMT = "The format of dates: the order of year, month and day."
DATSEP = "The character between the parts of a date."
TIMSEP = "The character between the parts of a time."
ACCPTHSIZ = "The largest size the file's access paths can reach."
PAGESIZE = "The size of a page of the keyed access path, in kilobytes."
FRCRATIO = "How many records are written before they are forced to auxiliary storage."
DTAQ = "The data queue, by name and library."
FORMTYPE = "The type of form the output is printed on. The writer stops for the form to be loaded when it changes."
WTR = "The writer: the job that prints the spooled files of an output queue."
RCDFMT = "The record format."
MSGTYPE = "The type of the message: informational, inquiry, completion, diagnostic, escape and so on."
APPID = "The application identifier."
PRDID = "A product identifier: seven characters, 5770SS1 for example."
DTAAUT = "The data authorities: read, add, update, delete and execute."
OBJAUT = "The object authorities: operational, management, existence, alter and reference."
PRTQLTY = "The print quality: draft, normal text or near-letter quality."
FONT = "The font the printer uses."
FORMFEED = "How paper is fed to the printer: continuous forms, cut sheets fed by hand, or an automatic sheet feeder."
TRANSFORM = "Whether the host print transform converts the SCS data to the printer's ASCII data stream."
USRDTATFM = "The program that transforms the user data of a spooled file before it is sent to the printer."
CNTRYID = "The country or region identifier: two letters."
ACGCDE = "The accounting code the job's resources are charged to."
HOLD = "Whether the job or the spooled file is held until someone releases it."
MAXMBRS = "The largest number of members the file can hold."
UNIT = "The preferred storage unit. The system places objects itself; the value is kept."
CRTOBJAUD = "The auditing value given to objects created in the library."
USRDFNOPT = "Options that a user-defined print program can use."
USRDFNDTA = "Data that a user-defined print program can use."
USRDFNOBJ = "An object that a user-defined print program can use."
ALWUPD = "Whether records can be updated through this file."
FILESEP = "How many separator pages print before each spooled file."
MAXSTG = "The most auxiliary storage, in kilobytes, the user's objects may occupy."
CFGOBJ = "The configuration object: a line, controller or device description, or a network server or interface description."
TOMBR = "The member of the to-file that receives the data."
STGMDL = "The storage model of the program's automatic and static storage: single-level, teraspace, or inherited from the activation group."
DBGENCKEY = "A key that protects the debug view stored in the object; the same key must be given to debug it."
DELAY = "How many seconds a controlled end waits before the end becomes immediate."
USEOPTBLK = "Whether the device's optimum block size is used. The tape may then not be readable on devices that do not support that size."
FROMDEV = "The device the data comes from."
MAXACT = "The most jobs or routing steps that can be active at once. *NOMAX sets no limit."
SCDTIME = "The time the job is scheduled to run."
CTG = "The cartridge identifier, as on the cartridge's label."
SUBNETMASK = "The subnet mask that tells the network part of the address from the host part."
ADRPFXLEN = "The prefix length of an IPv6 address: how many leading bits name the network."
PARM = "The parameters passed to the program, in order."
RUNPTY = "The run priority of the job, from 1 (highest) to 99 (lowest)."
DTAARA = "The data area, by name and library."
JOBPTY = "The priority of the job on the job queue, from 1 (highest) to 9 (lowest)."
LOGCLPGM = "Whether the commands that CL programs run are written to the job log."
LOGOUTPUT = "When the job log is produced as a spooled file: by the job itself at its end, by a server job afterwards, or not at all."
JOBMSGQFL = "What happens when the job's message queue fills: the job ends, the queue wraps, or messages are printed and then overwritten."
INQMSGRPY = "How inquiry messages sent to the job are answered: by the operator, with their default replies, or from the system reply list."
DDMCNV = "Whether conversations to remote systems for DDM are kept or dropped when nothing is using them."
DATE = "The job date."
SWS = "The eight job switches: 0 for off, 1 for on, X for unchanged."
CHRIDCTL = "How the character identifier of display and printer files is handled: the device's or the job's CCSID."
SPLFACN = "What happens to the job's spooled files when the job ends: they are kept with the job or detached from it."
DUPLEX = "Whether the output prints on both sides of the paper."
FLAG = "The lowest severity of the messages the compiler lists."
ALIGN = "Whether the writer stops on the first page so the forms can be aligned."
CTLCHAR = "The control characters in the data: none, or the first character of each record as a FORTRAN control character."
DRAWER = "The paper drawer the output is printed from."
MAXRCDS = "The most records a spooled file may hold. *NOMAX sets no limit."
SCHEDULE = "When the spooled file can begin to print: as soon as it is created, when it is closed, or when the job ends."
OWNER = "The owner of the objects created."
DTAFMT = "The format of the data: fixed-length fields or delimited."
FROMMBR = "The member the data comes from."
TIMFMT = "The format of times."
INCFILE = "The source file that /COPY and /INCLUDE directives without a file name search."
OPTIMIZE = "The level of optimization the code generator applies. Higher levels run faster but are harder to debug."
DBGVIEW = "The debug view kept in the object: none, the statements, the source, a listing, or all of them."
ASP = "The auxiliary storage pool the object is put in."
BNDSRVPGM = "The service programs bound by reference to the program."
COMMIT = "The commitment control level: whether changes are made in units the program commits or rolls back, and which records are locked."
ALWCPYDTA = "Whether a copy of the data may be used to answer a query."
SRVPGM = "The service program, by name and library."
LOGLVL = "How much of the job's messages are written to the job log, from 0 (none) to 4 (all)."
ALWOBJDIF = "Which differences between the saved object and the object on the system are allowed when it is restored."
SPLFDTA = "Whether the data of spooled files is saved with the output queues."
OMITOBJ = "Objects that are not to be included."
OUTFMT = "The format of the output."
IMGCLGIDX = "The index of the image catalog entry."
SCDDATE = "The date the job is scheduled to run."
LICTRM = "The license term of the product, for example V7 or V7R1."
FEATURE = "The feature code of the product."
MFS = "The file system to mount: a user-defined file system path or a network file system export."
MNTOVRDIR = "The directory the file system is mounted over."
SECLVL = "The second-level text of the message: what it means and what to do."
ALROPT = "Whether an alert is sent when the message is sent, and when."
MAXJOBS = "The most jobs allowed."
POOLID = "The subsystem pool identifier."
THDRSCAFN = "Whether the job's secondary threads are kept close to the processors and memory the first thread uses."
RSCAFNGRP = "Whether the job's threads are kept together on the same processor group."
SECCNN = "Whether the connection is secured with TLS."
PNLGRP = "The panel group, by name and library."
CGY = "The category of the volume in the media library."
MTU = "The largest datagram, in bytes, the interface sends without breaking it up."
RTNVAL = "The CL variable that receives the value."
BCKUPOPT = "The backup options of the operational assistant: daily, weekly or monthly."
TIMESLICE = "How long, in milliseconds, a thread of the job runs before another thread of the same priority gets the processor."
PURGE = "Whether the job may be moved out of main storage when it waits for a long time."
DFTWAIT = "How many seconds the system waits for an instruction to complete before it signals a time-out."
CHRID = "The graphic character set and code page of the data."
USRDRVPGM = "The user driver program that sends spooled files when no device writer is used."
DEVRCYACN = "What happens to the job when its display device has an error: a message is sent, the request is ended, or the job is ended."
TSEPOOL = "Whether the job moves to the base pool when its time slice ends."
RTGDTA = "The routing data the subsystem compares with its routing entries to choose the program the job runs."
JOBMSGQMX = "The largest size of the job's message queue, in megabytes."
AUTCHK = "Which authority is checked: the owner's, or data authority."
OPRCTL = "Whether users with job control special authority can control the queue."
MAINT = "When the access path is kept up to date: as records change, when the file is opened, or later."
RECOVER = "When a damaged access path is rebuilt: during the IPL, after it, or when the file is next opened."
FRCACCPTH = "Whether access path changes are written to auxiliary storage with each record change."
DLVRY = "How messages arriving on the queue are delivered: interrupting the user, notifying, holding, or calling a program."
DESTOPT = "Options passed to the remote system that receives the spooled file."
SEPPAGE = "Whether a separator page prints before each spooled file."
ALLOCATE = "Whether the member's storage is allocated when the member is created."
DLTPCT = "The highest percentage of deleted records the member may hold before a message is sent."
PRBID = "The problem identifier, as WRKPRB shows it."
DEVTYPE = "The device type."
CHLVAL = "The lines of the page that channels 1 to 12 skip to."
OUTBIN = "The output bin the printed pages go to."
COPIES = "How many copies are printed."
IGCDTA = "Whether the file holds double-byte character set data."
SYSVAL = "The system value."
RCDLEN = "The length of the records, in bytes."
USRCLS = "The user class: security officer, security administrator, programmer, system operator or user."
SPCAUT = "The special authorities the user profile has."
FROMCCSID = "The CCSID the data is in."
TODEV = "The device the data goes to."
TOENDOPT = "What the to-device does with the tape when the operation ends."
ALWRTVSRC = "Whether RTVCLSRC can retrieve the source from the program."
ENBPFRCOL = "Whether the program collects performance data, and at which procedure entries and exits."
PRFDTA = "Whether the program collects profiling data that later optimization can use."
CRTOBJSCAN = "Whether objects created in the library are scanned by the exit programs of the scan exit points."
RSTDRNMUNL = "Whether renaming and unlinking objects in the directory is restricted to their owners."
ALWLIBUPD = "Whether UPDPGM and UPDSRVPGM may change the library of a bound service program."
ALWRINZ = "Whether the program's static storage may be reinitialized while it is active."
ARGOPT = "Whether argument passing is optimized for the program's procedure calls."
DFTRDBCOL = "The schema used for unqualified names in SQL statements with system naming."
SQLCURRULE = "Whether DB2 or the standard SQL rules apply to the program's statements."
DECRESULT = "The precision and scale of decimal results the program's SQL statements compute."
LNG = "The language feature of the licensed program."
OPNSCOPE = "The scope of the open: the activation group, the call level or the job."
SECURE = "Whether the file is protected from overrides at earlier call levels."
OVRSCOPE = "The scope of the override: the call level, the activation group or the job."
WAITTIME = "How many seconds the command waits for a response."
MSGDTA = "The values substituted for the message's variables."
OMITLIB = "Libraries that are not to be included."
SAVACT = "Whether objects in use can be saved, and at which point of consistency."
PRECHK = "Whether every object is checked before any is saved or restored, and the operation stopped if any cannot be."
UPDHST = "Whether the save history of the objects is updated."
TOMSGQ = "The message queue the message is sent to."
ENVVAR = "The name of the environment variable."
EXITPNT = "The exit point, by name."
DFT = "The default reply, used when the message is not answered."
VALUES = "The replies that are valid for the message."
SRCTYPE = "The type of the source member: CLLE, RPGLE, PF, CMD and so on."
LOGPRB = "Whether a problem is logged for the message."
PRDLIB = "The product library of the command: it is added to the library list while the command runs."
GRPJOB = "The group job."
DECFMT = "The decimal format: the character used for the decimal point and how zeros print before it."
RQSDTA = "The request data placed on the job's message queue for the program to read."
INLLIBL = "The initial user part of the library list of the job."
PASSWORD = "The password."
JOB = "The job, by name, user and number. A job name alone is enough when only one job has it."
FILE = "The file, by name and library."
SUBTREE = "Whether the objects in the subdirectories are included."
CRTDATE = "The date and time the spooled file was created."
USRDTA = "User data, up to 10 characters, kept with the object."
ALIASES = "Other names the entry is known by."
