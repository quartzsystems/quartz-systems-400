# The column layouts of the ILE RPG specifications. Columns are 1-based
# and inclusive; `ruler` is what SEU's format line shows over the field.
# The front end cuts records with these tables and SEU prompts them.

[[form]]
id = "H"
letter = "H"
title = "Control"
fields = [
  { name = "keywords", from = 7, to = 80, ruler = "Keywords" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

[[form]]
id = "F"
letter = "F"
title = "File description"
fields = [
  { name = "name", from = 7, to = 16, ruler = "Filename" },
  { name = "type", from = 17, to = 17, ruler = "I" },
  { name = "designation", from = 18, to = 18, ruler = "P" },
  { name = "eof", from = 19, to = 19, ruler = "E" },
  { name = "addition", from = 20, to = 20, ruler = "A" },
  { name = "sequence", from = 21, to = 21, ruler = "S" },
  { name = "format", from = 22, to = 22, ruler = "F" },
  { name = "reclen", from = 23, to = 27, ruler = "Rlen" },
  { name = "limits", from = 28, to = 28, ruler = "L" },
  { name = "keylen", from = 29, to = 33, ruler = "Klen" },
  { name = "rectype", from = 34, to = 34, ruler = "A" },
  { name = "org", from = 35, to = 35, ruler = "I" },
  { name = "device", from = 36, to = 42, ruler = "Device" },
  { name = "keywords", from = 44, to = 80, ruler = "Keywords" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

[[form]]
id = "D"
letter = "D"
title = "Definition"
fields = [
  { name = "name", from = 7, to = 21, ruler = "Name" },
  { name = "ext", from = 22, to = 22, ruler = "E" },
  { name = "dstype", from = 23, to = 23, ruler = "T" },
  { name = "deftype", from = 24, to = 25, ruler = "Ds" },
  { name = "from", from = 26, to = 32, ruler = "From" },
  { name = "to", from = 33, to = 39, ruler = "To/L" },
  { name = "type", from = 40, to = 40, ruler = "I" },
  { name = "decimals", from = 41, to = 42, ruler = "Dc" },
  { name = "keywords", from = 44, to = 80, ruler = "Keywords" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

# Program-described record identification line.
[[form]]
id = "I"
letter = "I"
title = "Input record"
fields = [
  { name = "name", from = 7, to = 16, ruler = "Filename" },
  { name = "relation", from = 16, to = 18, ruler = "" },
  { name = "sequence", from = 17, to = 18, ruler = "Sq" },
  { name = "number", from = 19, to = 19, ruler = "N" },
  { name = "option", from = 20, to = 20, ruler = "O" },
  { name = "rid", from = 21, to = 22, ruler = "Id" },
  { name = "pos1", from = 23, to = 27, ruler = "Pos1" },
  { name = "not1", from = 28, to = 28, ruler = "N" },
  { name = "part1", from = 29, to = 29, ruler = "C" },
  { name = "char1", from = 30, to = 30, ruler = "C" },
  { name = "pos2", from = 31, to = 35, ruler = "Pos2" },
  { name = "not2", from = 36, to = 36, ruler = "N" },
  { name = "part2", from = 37, to = 37, ruler = "C" },
  { name = "char2", from = 38, to = 38, ruler = "C" },
  { name = "pos3", from = 39, to = 43, ruler = "Pos3" },
  { name = "not3", from = 44, to = 44, ruler = "N" },
  { name = "part3", from = 45, to = 45, ruler = "C" },
  { name = "char3", from = 46, to = 46, ruler = "C" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

# Program-described field description line.
[[form]]
id = "IX"
letter = "I"
title = "Input field"
fields = [
  { name = "attr", from = 31, to = 34, ruler = "Ext" },
  { name = "sep", from = 35, to = 35, ruler = "" },
  { name = "format", from = 36, to = 36, ruler = "P" },
  { name = "from", from = 37, to = 41, ruler = "From" },
  { name = "to", from = 42, to = 46, ruler = "To" },
  { name = "decimals", from = 47, to = 48, ruler = "Dc" },
  { name = "field", from = 49, to = 62, ruler = "Field" },
  { name = "level", from = 63, to = 64, ruler = "L1" },
  { name = "match", from = 65, to = 66, ruler = "M1" },
  { name = "relation", from = 67, to = 68, ruler = "FR" },
  { name = "plus", from = 69, to = 70, ruler = "P" },
  { name = "minus", from = 71, to = 72, ruler = "M" },
  { name = "zero", from = 73, to = 74, ruler = "B" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

# Externally described record line.
[[form]]
id = "IR"
letter = "I"
title = "Input record (external)"
fields = [
  { name = "name", from = 7, to = 16, ruler = "Rcdname" },
  { name = "rid", from = 21, to = 22, ruler = "Ri" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

# Externally described field line.
[[form]]
id = "IF"
letter = "I"
title = "Input field (external)"
fields = [
  { name = "extname", from = 21, to = 30, ruler = "Ext-field" },
  { name = "field", from = 49, to = 62, ruler = "Field" },
  { name = "level", from = 63, to = 64, ruler = "L1" },
  { name = "match", from = 65, to = 66, ruler = "M1" },
  { name = "plus", from = 69, to = 70, ruler = "P" },
  { name = "minus", from = 71, to = 72, ruler = "M" },
  { name = "zero", from = 73, to = 74, ruler = "B" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

[[form]]
id = "C"
letter = "C"
title = "Calculation"
fields = [
  { name = "level", from = 7, to = 8, ruler = "L0" },
  { name = "cond", from = 9, to = 11, ruler = "N01" },
  { name = "factor1", from = 12, to = 25, ruler = "Factor1" },
  { name = "opcode", from = 26, to = 35, ruler = "Opcode(E)" },
  { name = "factor2", from = 36, to = 49, ruler = "Factor2" },
  { name = "result", from = 50, to = 63, ruler = "Result" },
  { name = "len", from = 64, to = 68, ruler = "Len" },
  { name = "decimals", from = 69, to = 70, ruler = "D" },
  { name = "hi", from = 71, to = 72, ruler = "Hi" },
  { name = "lo", from = 73, to = 74, ruler = "Lo" },
  { name = "eq", from = 75, to = 76, ruler = "Eq" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

# Calculation with an extended factor 2.
[[form]]
id = "CX"
letter = "C"
title = "Calculation (extended factor 2)"
fields = [
  { name = "level", from = 7, to = 8, ruler = "L0" },
  { name = "cond", from = 9, to = 11, ruler = "N01" },
  { name = "factor1", from = 12, to = 25, ruler = "Factor1" },
  { name = "opcode", from = 26, to = 35, ruler = "Opcode(E)" },
  { name = "factor2", from = 36, to = 80, ruler = "Extended-factor2" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

# Output record line.
[[form]]
id = "O"
letter = "O"
title = "Output record"
fields = [
  { name = "name", from = 7, to = 16, ruler = "Filename" },
  { name = "relation", from = 16, to = 18, ruler = "" },
  { name = "type", from = 17, to = 17, ruler = "D" },
  { name = "fetch", from = 18, to = 18, ruler = "" },
  { name = "add", from = 18, to = 20, ruler = "Add" },
  { name = "cond", from = 21, to = 29, ruler = "N01N02N03" },
  { name = "except", from = 30, to = 39, ruler = "Excnam" },
  { name = "spaceb", from = 40, to = 42, ruler = "B" },
  { name = "spacea", from = 43, to = 45, ruler = "A" },
  { name = "skipb", from = 46, to = 48, ruler = "Sb" },
  { name = "skipa", from = 49, to = 51, ruler = "Sa" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

# Output field line.
[[form]]
id = "OF"
letter = "O"
title = "Output field"
fields = [
  { name = "cond", from = 21, to = 29, ruler = "N01N02N03" },
  { name = "field", from = 30, to = 43, ruler = "Field" },
  { name = "editcode", from = 44, to = 44, ruler = "Y" },
  { name = "blank", from = 45, to = 45, ruler = "B" },
  { name = "end", from = 47, to = 51, ruler = "End" },
  { name = "format", from = 52, to = 52, ruler = "P" },
  { name = "constant", from = 53, to = 80, ruler = "Constant/editword" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]

[[form]]
id = "P"
letter = "P"
title = "Procedure"
fields = [
  { name = "name", from = 7, to = 21, ruler = "Name" },
  { name = "begin", from = 24, to = 24, ruler = "B" },
  { name = "keywords", from = 44, to = 80, ruler = "Keywords" },
  { name = "comments", from = 81, to = 100, ruler = "Comments" },
]
