[package]
name = "rpgfront"
description = "QS/400 ILE RPG front end: source reading, directives, /COPY, fixed and free form, the syntax tree"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["front", "lower"]
# The library a language server links: the reader, the parser and
# analysis::analyze, with compdiag's diagnostics.
front = ["dep:compdiag"]
# Nothing here needs more than the front end; the feature exists so
# every front end has the same two.
lower = ["front"]

[dependencies]
rpgspecs = { path = "../specs", version = "0.1.0" }
compdiag = { path = "../compdiag", version = "0.1.0", optional = true }

[lints]
workspace = true
