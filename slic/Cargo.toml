[package]
name = "slic"
description = "QS/400 PID 1"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
licpart = { path = "../licpart", version = "0.1.0" }
sysval = { path = "../sysval", version = "0.1.0" }
console = { path = "../console", version = "0.1.0" }
release = { path = "../release", version = "0.1.0" }
store = { path = "../store", version = "0.1.0" }
blockdev = { path = "../blockdev", version = "0.1.0" }
diskimg = { path = "../diskimg", version = "0.1.0" }
qsname = { path = "../qsname", version = "0.1.0" }
svctools = { path = "../svctools", version = "0.1.0" }
db = { path = "../db", version = "0.1.0" }
jrn = { path = "../jrn", version = "0.1.0" }
sql = { path = "../sql", version = "0.1.0" }
dds = { path = "../dds", version = "0.1.0" }
qdecimal = { path = "../qdecimal", version = "0.1.0" }
ccsid = { path = "../ccsid", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "mount", "net", "process", "system", "time"] }
# Used only inside platform::sys for signal handling.
libc = "0.2.190"

[lints]
workspace = true
