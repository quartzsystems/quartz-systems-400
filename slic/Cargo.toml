[package]
name = "slic"
description = "QS/400 PID 1"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
licpart = { path = "../licpart", version = "0.1.0" }
sysval = { path = "../sysval", version = "0.1.0" }
console = { path = "../console", version = "0.1.0" }
release = { path = "../release", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "mount", "net", "process", "system", "time"] }
# Used only inside platform::sys for signal handling.
libc = "0.2.190"

[lints]
workspace = true
