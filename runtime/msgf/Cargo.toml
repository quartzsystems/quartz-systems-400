[package]
name = "msgf"
description = "QS/400 message files: descriptions, substitution, the *MSGF payload and QCPFMSG, QCEEMSG, QSQLMSG"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
store = { path = "../../storage/store", version = "0.1.0" }
qsname = { path = "../../storage/qsname", version = "0.1.0" }
ccsid = { path = "../../storage/ccsid", version = "0.1.0" }
qdecimal = { path = "../../database/qdecimal", version = "0.1.0" }
serde.workspace = true
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
ipc = { path = "../../work/ipc", version = "0.1.0" }
thiserror.workspace = true

[dev-dependencies]
blockdev = { path = "../../lic/blockdev", version = "0.1.0" }

[lints]
workspace = true
