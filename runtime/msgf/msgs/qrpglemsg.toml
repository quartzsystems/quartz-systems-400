# QRPGLEMSG: the ILE RPG compiler's messages. RNF messages are the
# compile diagnostics the listing prints; RNS messages end the
# CRTBNDRPG, CRTRPGMOD and CRTSQLRPGI commands. Every text is
# Quartz-written; the identifiers and severities are the compatibility
# interface. A text the compiler prints (rpg/compiler/src/msgs.rs) is
# repeated here word for word; a test keeps the two in step.
name = "QRPGLEMSG"
text = "ILE RPG compiler messages"

# Compile diagnostics.

[[msg]]
id = "RNF0001"
sev = 50
text = "The compiler could not generate the program: &1."
help = "The code generated for the source was refused by the verifier. This is the compiler's own error, not the source's; the object was not created."
vars = ["*CHAR 256"]

[[msg]]
id = "RNF0273"
sev = 40
text = "Copy member &1 cannot be opened; the directive is ignored."
help = "A /COPY or /INCLUDE directive names a member that is not in the file and library given, or in the library list."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0024"
sev = 40
text = "Copy member &1 is already being copied, or copies nest too deep."
help = "A member copies itself, directly or through others, or the nesting passes the COPYNEST limit."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0705"
sev = 30
text = "A conditional group has no /ENDIF."
help = "The member ended inside a /IF group. Add the /ENDIF that closes it."

[[msg]]
id = "RNF0274"
sev = 30
text = "The directive is not recognized; it is ignored."
help = "A line starting with a slash in column 7 names no directive the compiler knows, or the directive is not allowed where it is."

[[msg]]
id = "RNF0706"
sev = 30
text = "/ELSE, /ELSEIF or /ENDIF has no matching /IF."
help = "The directive closes or continues a conditional group that was never opened."

[[msg]]
id = "RNF0201"
sev = 10
text = "&1 is not valid here."
help = "The character or entry cannot appear in this position of the specification."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0202"
sev = 20
text = "A parenthesis is missing."
help = "The opening and closing parentheses of the expression or keyword do not pair up."

[[msg]]
id = "RNF0203"
sev = 30
text = "The operand of &1 is not valid."
help = "The operand, or the keyword, is not one the operation, built-in function or specification takes."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0257"
sev = 30
text = "The specification type is out of sequence or not valid."
help = "Specifications follow the order H, F, D, I, C, O, P. The letter in column 6 is not one of them or comes after a later type."

[[msg]]
id = "RNF0263"
sev = 20
text = "A numeric entry is not right-aligned in its columns."
help = "Numbers in fixed-form entries end in the last column of the entry. The entry was read as written."

[[msg]]
id = "RNF0267"
sev = 20
text = "A character literal has no closing apostrophe; one is assumed."
help = "A character literal starts with an apostrophe and ends with one; the end was not found, so the compiler ends the literal at the end of the line. Add the closing apostrophe."

[[msg]]
id = "RNF0280"
sev = 20
text = "A continued name has no continuation."
help = "A name ending in ... carries on to the next specification, which did not provide the rest of it."

[[msg]]
id = "RNF0308"
sev = 20
text = "The float literal is not valid."
help = "A float literal is a mantissa, the letter E and a signed exponent, for example 1.5E-3."

[[msg]]
id = "RNF0618"
sev = 20
text = "The length or number of digits for &1 is not valid."
help = "The length is outside what the data type holds, or the decimals exceed the digits."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0955"
sev = 30
text = "This item cannot be the target of an assignment."
help = "Constants, literals, built-in function results and read-only parameters cannot be changed."

[[msg]]
id = "RNF2120"
sev = 40
text = "No external description was found for file &1; the file is ignored."
help = "The compiler could not retrieve the file's description at compile time, so the file and its fields are not available. Check that the file exists in the library list."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF2318"
sev = 0
text = "No overflow indicator given for the printer file; *INOA is used, with a skip to line 6 on overflow."
help = "A printer file without OFLIND uses *INOA; on overflow the cycle skips to line 6. Give OFLIND to control overflow yourself."

[[msg]]
id = "RNF3304"
sev = 20
text = "The definition type is not valid; S is used."
help = "The definition type in columns 24-25 must be blank, C, DS, PI, PR or S. A stand-alone field is assumed."

[[msg]]
id = "RNF3313"
sev = 20
text = "The value of keyword &1 is not valid."
help = "The keyword's value is not one it takes. Correct the value."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF3349"
sev = 20
text = "&1 is not a data structure."
help = "The name is used where a data structure is needed, but it does not name one."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF3431"
sev = 20
text = "The initial value does not fit the field."
help = "The value of the INZ keyword is longer than the field, or has more digits than it holds."

[[msg]]
id = "RNF3530"
sev = 0
text = "The data structure has no subfields."
help = "A data structure was declared without subfields; it has no fields of its own."

[[msg]]
id = "RNF5005"
sev = 30
text = "Calculations follow the subroutines."
help = "Main calculations must come before the first BEGSR. The statement is not reached."

[[msg]]
id = "RNF5012"
sev = 30
text = "&1 does not match an open operation."
help = "An ENDxx, ELSE or WHEN has no IF, DO, SELECT, FOR or MONITOR open to close or continue."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF5013"
sev = 30
text = "The TAG name &1 is defined already or is a reserved word; the specification is ignored."
help = "A TAG name must be unique and not a reserved word. Choose another name."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF5034"
sev = 30
text = "A declaration group is not ended, or ended where none is open."
help = "Each DCL-DS, DCL-PR, DCL-PI and DCL-PROC needs its END-xx, and an END-xx needs its beginning."

[[msg]]
id = "RNF5346"
sev = 30
text = "Operation &1 is not allowed in free form."
help = "The operation code is fixed-form only and has no free-form version. Use the free-form operation or built-in function that replaces it."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF5347"
sev = 30
text = "An assignment operator is expected."
help = "An assignment needs = (or +=, -=, *=, /=, **=) after the target."

[[msg]]
id = "RNF5358"
sev = 30
text = "&1 is not expected here."
help = "The token shown does not fit the statement where it appears. Check the statement's syntax."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF5377"
sev = 20
text = "The expression should end here."
help = "The expression ends where the compiler did not expect more; check the parentheses and operators after this point."

[[msg]]
id = "RNF5410"
sev = 30
text = "No prototype is defined for the call to &1."
help = "A call by name (CALLP or an expression) needs a prototype for the procedure or program. Add a DCL-PR, or a /COPY member that has one."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF5501"
sev = 20
text = "Free-form specifications do not take a comment area."
help = "Free-form statements end with a semicolon; the old comment area (columns 81-100) is part of the statement. Write comments with //."

[[msg]]
id = "RNF5507"
sev = 30
text = "The free-form statement has no ending semicolon."
help = "Every free-form statement ends with a semicolon. Add it."

[[msg]]
id = "RNF5508"
sev = 30
text = "Something follows the end of the free-form statement."
help = "Only a comment may follow the semicolon that ends a statement on the same line."

[[msg]]
id = "RNF7014"
sev = 30
text = "The arguments of &1 are not valid."
help = "The arguments do not match what the built-in function or procedure takes: the number, the types or the order."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF7021"
sev = 30
text = "Factor 1 and factor 2 differ in type or length; the specification is ignored."
help = "For this operation factor 1 and factor 2 must have the same type and length."

[[msg]]
id = "RNF7023"
sev = 40
text = "The program has no way to end."
help = "A cycle-main program needs *INLR or RETURN, or a primary file whose end turns on *INLR."

[[msg]]
id = "RNF7030"
sev = 30
text = "&1 is not defined."
help = "The name is not declared in the program. Declare it, or correct the spelling."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF7031"
sev = 0
text = "No reference is made to &1."
help = "The name is declared but never used. It can be removed."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF7057"
sev = 0
text = "Half adjust has no effect: the result has no more decimals than the target."
help = "The result has no more decimal positions than the target, so rounding never changes it. The (H) extender can be removed."

[[msg]]
id = "RNF7404"
sev = 20
text = "An index or position is out of range."
help = "A constant index or position is outside the array or string. Correct the value."

[[msg]]
id = "RNF7419"
sev = 20
text = "An expression of this type is not allowed here."
help = "The expression's type is not one this place accepts, for example a numeric expression where a character value is needed."

[[msg]]
id = "RNF7421"
sev = 30
text = "The types of the operands do not match."
help = "The operator needs operands of compatible types, such as two numeric or two character values. Convert one of them."

[[msg]]
id = "RNF7503"
sev = 30
text = "An operand of the expression is not defined."
help = "A name used in the expression is not declared."

[[msg]]
id = "RNF7504"
sev = 30
text = "A constant divisor is zero."
help = "Dividing by a constant zero would always fail at run time. Correct the divisor."

[[msg]]
id = "RNF7534"
sev = 10
text = "A global file of a module without a main procedure is not closed for it."
help = "Close the file with CLOSE before the activation group ends, or declare it in a procedure."

[[msg]]
id = "RNF7535"
sev = 30
text = "The number of parameters for &1 does not match its prototype."
help = "The call passes more or fewer parameters than the prototype declares, and the extra ones are not OPTIONS(*NOPASS)."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF7536"
sev = 30
text = "A parameter does not match its prototype."
help = "A parameter passed differs in type, length or passing method from the prototype."

[[msg]]
id = "RNF7551"
sev = 10
text = "The intermediate result keeps fewer decimals than the target."
help = "Decimal positions past those the intermediate result keeps are lost before the value is assigned."

[[msg]]
id = "RNF2029"
sev = 30
text = "SLN needs a record format of the display file with SLNO(*VAR)."
help = "SLN sets the starting line of a record format, which needs SLNO(*VAR) in the display file's DDS."

[[msg]]
id = "RNF3704"
sev = 20
text = "PACKEVEN is allowed only on a packed subfield given by positions; it is dropped."
help = "PACKEVEN says a packed subfield given by from and to positions has an even number of digits; it means nothing on other subfields."

[[msg]]
id = "RNF1524"
sev = 0
text = "A procedure's PGMINFO keyword has no effect when a program is created."
help = "PGMINFO controls the procedure interface information of a module; a program created from one source does not use it here."

[[msg]]
id = "RNF0565"
sev = 30
text = "&1 cannot be used while the CCSID of graphic data is ignored (CCSID(*GRAPH:*IGNORE))."
help = "With CCSID(*GRAPH:*IGNORE) the compiler does not know the CCSID of graphic data, so this conversion or function cannot be used."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0587"
sev = 20
text = "The character literal given to &1 has no shift-out and shift-in around it."
help = "A literal of double-byte characters is written between shift-out and shift-in characters."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0556"
sev = 20
text = "The value given to &1 is not character data; the function is dropped."
help = "The built-in function takes character data; the value given is not."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0380"
sev = 30
text = "%THIS is allowed only in a method of a Java class."
help = "%THIS returns the object of a Java method and has a meaning only inside such a method."

[[msg]]
id = "RNF0369"
sev = 20
text = "The operand of %PARMNUM must be a parameter of the procedure."
help = "%PARMNUM gives the number of a parameter of the current procedure; the name is not one."

[[msg]]
id = "RNF0342"
sev = 20
text = "&1 needs a field that can be null."
help = "The operation sets or tests the null indicator of a field, so the field must be null-capable (ALWNULL)."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0337"
sev = 30
text = "&1 needs a numeric value."
help = "The built-in function or operation needs a numeric value."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0507"
sev = 20
text = "A table searched this way must be in ascending or descending order."
help = "A binary search (%LOOKUP and friends with ASCEND or DESCEND) needs an array in sequence."

[[msg]]
id = "RNF0574"
sev = 20
text = "&1 needs a numeric value."
help = "The built-in function needs a numeric value."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF5324"
sev = 30
text = "The operation needs a high resulting indicator; none is given, so the operation is dropped."
help = "The operation sets an indicator for the high comparison result, and nothing else would use its result. Give the indicator, or use another operation."

[[msg]]
id = "RNF0224"
sev = 30
text = "The %XML options are not valid here: &1."
help = "The option string of %XML holds an option or value XML-INTO does not take."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF5352"
sev = 30
text = "The %HANDLER procedure does not have the interface this operation calls."
help = "The procedure named by %HANDLER must have the parameters the operation passes to it."

[[msg]]
id = "RNF7099"
sev = 0
text = "The program commits or rolls back, but no file of it is opened under commitment control."
help = "COMMIT and ROLBK work on files opened with COMMIT; the program has none."

[[msg]]
id = "RNF5152"
sev = 0
text = "DUMP is not done: neither the (A) extender nor DEBUG(*YES) is given."
help = "DUMP writes a formatted dump only with the (A) extender or with DEBUG(*YES) on the control specification."

[[msg]]
id = "RNF7062"
sev = 30
text = "File &1 is opened by the program (USROPN), but no OPEN operation names it."
help = "A USROPN file is opened only by an OPEN operation in the program; none names this file."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF1520"
sev = 20
text = "Procedures are not allowed with DFTACTGRP(*YES)."
help = "Subprocedures need an ILE activation group: create the program with DFTACTGRP(*NO)."

[[msg]]
id = "RNF5378"
sev = 30
text = "CALLB is not allowed in a program created for the default activation group (DFTACTGRP(*YES))."
help = "CALLB calls a bound procedure, which a program in the default activation group cannot do. Use DFTACTGRP(*NO)."

[[msg]]
id = "RNF2407"
sev = 20
text = "&1 is not allowed for an externally described file; it is ignored."
help = "The keyword applies to program-described files only."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF2109"
sev = 40
text = "Every record format of file &1 is ignored or in error; the file is dropped."
help = "None of the file's record formats can be used, so the file is left out of the program."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF7150"
sev = 0
text = "Record format &1 has fields that can be null."
help = "Some fields of the record format are null-capable; the program sees their null indicators with ALWNULL."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF3803"
sev = 30
text = "Field &1 is not in the external description; the subfield is ignored."
help = "An externally described data structure can rename or initialize only fields of the external description."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF3450"
sev = 20
text = "The value given to &1 is not valid here; the keyword is ignored."
help = "The keyword's value is not valid in this context, so the keyword has no effect."
vars = ["*CHAR 50"]

# Completion of the commands.

[[msg]]
id = "RNS9304"
sev = 0
text = "Program &1 created in library &2. Highest severity: &3."
help = "The program was created. The highest severity of the compile messages is shown."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 2", "*CHAR 8", "*CHAR 8"]

[[msg]]
id = "RNS9305"
sev = 0
text = "Module &1 created in library &2. Highest severity: &3."
help = "The module was created. The highest severity of the compile messages is shown."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 2", "*CHAR 8", "*CHAR 8"]

[[msg]]
id = "RNS9308"
sev = 50
text = "The compile of &1 in &2 stopped at severity &3."
help = "A diagnostic of a severity above the GENLVL value was found, so no object was made. The listing shows each one."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 2"]

[[msg]]
id = "RNS9309"
sev = 50
text = "Module &1 was not created in library &2."
help = "The listing shows why: diagnostics above GENLVL, OPTION(*NOGEN), or a problem storing the module."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNS9310"
sev = 50
text = "Program &1 was not created in library &2."
help = "The listing shows why: diagnostics above GENLVL, OPTION(*NOGEN), or a problem binding or storing the program."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNS9311"
sev = 50
text = "The compile found diagnostics up to severity &1."
help = "Read the listing for each diagnostic, fix the source and compile again."
vars = ["*CHAR 2"]

[[msg]]
id = "RNF6011"
sev = 0
text = "The record has no space or skip entries and no PRTCTL; it spaces one line after."
help = "A printed record without space or skip entries prints and then spaces one line."

[[msg]]
id = "RNF7066"
sev = 0
text = "Record format &1 is not named by any input or output operation."
help = "The record format is declared but no operation reads or writes it."
vars = ["*CHAR 10"]

[[msg]]
id = "RNF7078"
sev = 30
text = "The search argument's length or type differs from the file's first key field."
help = "For a keyed file, the search argument should have the type and length of the key field it is compared with."

[[msg]]
id = "RNF7086"
sev = 0
text = "Records of the file are read in blocks; its INFDS changes only when a block moves."
help = "The file is read in blocks for speed; the feedback in its INFDS reflects the block, not each record."

[[msg]]
id = "RNF7089"
sev = 0
text = "File &1 keeps its indicators in a separate area, which the program passes on each operation."
help = "INDARA puts the file's indicators in a separate area; the program passes it with each I/O operation."
vars = ["*CHAR 10"]

[[msg]]
id = "RNF7341"
sev = 0
text = "The subfield is only in the target structure of the EVAL-CORR."
help = "EVAL-CORR copies subfields by name; this subfield has no namesake in the source and keeps its value."

[[msg]]
id = "RNF7342"
sev = 0
text = "The subfield is only in the source structure of the EVAL-CORR."
help = "EVAL-CORR copies subfields by name; this subfield has no namesake in the target and is not copied."

[[msg]]
id = "RNF7350"
sev = 0
text = "&1 leaves out subfields that have no namesake in the other structure."
help = "EVAL-CORR or a correspondence assignment copies only subfields with the same name in both structures."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0334"
sev = 30
text = "%DECPOS needs a decimal or integer value; &1 is not one."
help = "%DECPOS gives the decimal positions of a numeric value; the argument is not numeric."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0599"
sev = 20
text = "The format &1 is not valid for this built-in function."
help = "The format given to the built-in function is not one it takes."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF7510"
sev = 30
text = "The value &1 is too short for a complete date in its format."
help = "The date literal or value does not have all the digits its format needs."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF7519"
sev = 30
text = "The value &1 is too short for a complete timestamp."
help = "A timestamp literal needs a date, a time and the fraction of seconds."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0236"
sev = 30
text = "The %DATA options are not valid here: &1."
help = "An option given in the %DATA options string is not one DATA-INTO takes, or its value is not valid for it. Correct the option and compile again."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0231"
sev = 20
text = "The length given for &1 is above the largest allowed; the largest is used."
help = "The length is larger than the type allows; the largest allowed length is used instead."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0256"
sev = 30
text = "A main-procedure statement after a procedure is ignored."
help = "Main procedure calculations must come before the first subprocedure."

[[msg]]
id = "RNF0305"
sev = 20
text = "&1 is not a valid date in the date format in effect."
help = "The literal is not a valid date in the date format the program uses (DATFMT)."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0306"
sev = 20
text = "&1 is not a valid time in the time format in effect."
help = "The literal is not a valid time in the time format the program uses (TIMFMT)."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0307"
sev = 20
text = "&1 is not a valid timestamp."
help = "The literal is not a valid timestamp: yyyy-mm-dd-hh.mm.ss.ffffff."
vars = ["*CHAR 50"]

[[msg]]
