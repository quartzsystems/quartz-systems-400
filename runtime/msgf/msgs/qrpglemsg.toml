sev = 20
text = "A right parenthesis is missing."
help = "A left parenthesis has no matching right parenthesis."

[[msg]]
id = "RNF0316"
sev = 20
text = "&1 needs more arguments; the built-in function is ignored."
help = "The built-in function was given fewer arguments than it needs."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0317"
sev = 20
text = "&1 has more arguments than it takes."
help = "The built-in function was given more arguments than it takes."
vars = ["*CHAR 50"]

[[msg]]
id = "RNF0331"
sev = 20
text = "The argument of &1 has no elements; the built-in function is ignored."
