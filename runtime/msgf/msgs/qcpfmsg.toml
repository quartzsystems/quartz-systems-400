help = "The system ASP is below QSTGLOWLMT and QSTGLOWACN is *REGFAC, *ENDSYS or *PWRDWNSYS. Reduce the storage used, or change QSTGLOWACN to *MSG or *CRITMSG, then start the subsystem."
