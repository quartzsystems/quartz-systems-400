sev = 40
text = "API &1 could not end the sessions of &2 (reason code &3)."
help = "Reason codes: 1, the workstation has no session; 2, QZLSSERVER is not active, so there are no sessions; 3, QSERVER is not active; 4, a session identifier was given but the workstation is not *SESSID; 5, no session has identifier &4; 6, *EXPANDED was given without an expanded name."
vars = ["*CHAR 10", "*CHAR 15", "*BIN 4", "*BIN 8"]

[[msg]]
id = "CPFB68F"
sev = 40
text = "API &1 could not list the NetServer information (reason code &3)."
help = "Reason codes: 1, format &4 is not one the API knows; 2, the library of user space &2 is not found; 3, user space &2 is not found or not authorized; 4, the user space is locked; 5 and 6, the job or the time could not be read; 7, the qualifier does not suit the format; 8, data at offset &5 could not be converted; 9, *SESSID must be given for both the qualifier and the session user, and only with a session identifier; 10, format ZLSL0900 takes a blank qualifier; 11, *EXPANDED was given without an expanded name."
vars = ["*CHAR 10", "*CHAR 20", "*BIN 4", "*CHAR 8", "*BIN 4"]

[[msg]]
id = "CPFB690"
sev = 40
text = "API &1 could not change the NetServer information (reason code &2)."
help = "Reason code 1: format &3 is not ZLSS0100 or ZLSS0200."
vars = ["*CHAR 10", "*BIN 4", "*CHAR 8"]

[[msg]]
