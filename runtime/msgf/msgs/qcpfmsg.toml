# NetServer (QZLSSERVER, QZLSFILE and the QZLS* APIs, docs/NETSERVER.md):
# IBM's identifiers, severities and substitution layouts; our texts.

[[msg]]
id = "CPDB680"
sev = 40
text = "Not authorized to enable user &1 for NetServer."
help = "Enabling a user for NetServer needs *OBJMGT and *USE authority to the user profile. Ask the security officer for the authority, or have someone with it enable the user."
vars = ["*CHAR 10"]

[[msg]]
id = "CPFB680"
sev = 40
text = "The NetServer job QZLSSERVER is not active."
help = "NetServer works only while its QZLSSERVER job runs in subsystem QSERVER. Start QSERVER if it is not active, then start NetServer with STRTCPSVR SERVER(*NETSVR) or the QZLSSTRS API."

[[msg]]
id = "CPFB681"
sev = 40
text = "NetServer had an internal error and ended its sessions."
help = "Something NetServer did not expect happened. The messages in QSYSOPR and the QZLSSERVER job log say what. End NetServer and start it again with reset; report the problem if it comes back."

[[msg]]
id = "CPFB682"
sev = 40
text = "API &1 failed with reason code &2."
help = "Reason codes: 1 and 2, the caller's credentials could not be read; 3, the job could not switch profiles; 4, a lock NetServer needs is held; 5, an internal operation returned &3; 6, print share &4 was added or changed but could not be published (QS/400 has no directory to publish to), so it is not published; 7, both 5 and 6."
vars = ["*CHAR 10", "*BIN 4", "*BIN 4", "*CHAR 12"]

[[msg]]
id = "CPFB683"
sev = 40
text = "API &1 could not convert parameter &5 from CCSID &3 to CCSID &2."
help = "The text at offset &6 of parameter &5 has no form in the target CCSID, or the CCSID is not one QS/400 converts (return code &4). Give the value in a CCSID QS/400 supports."
vars = ["*CHAR 10", "*BIN 4", "*BIN 4", "*BIN 4", "*BIN 4", "*BIN 4"]

[[msg]]
id = "CPFB684"
sev = 40
text = "Not authorized to use API &1 (reason code &2)."
help = "Reason codes: 1, the API needs *IOSYSCFG special authority; 2, it needs *IOSYSCFG and *SECADM; 3, the directory or output queue to share does not exist and the caller has no *IOSYSCFG; 4, the caller neither owns the directory or output queue nor has *IOSYSCFG."
vars = ["*CHAR 10", "*BIN 4"]

[[msg]]
id = "CPFB685"
sev = 40
text = "API &1 could not start NetServer (reason code &2)."
help = "Reason codes: 1, subsystem QSERVER is not active; 2, QZLSSERVER is active already; 3, NetBIOS could not be reset (return code &3); 4, an internal operation failed (return code &3); 5, the reset value &4 is not 0 or 1."
vars = ["*CHAR 10", "*BIN 4", "*BIN 4", "*CHAR 1"]

[[msg]]
id = "CPFB686"
sev = 40
text = "API &1 could not change the NetServer attributes (reason code &2)."
help = "Reason codes: 5, the code page has no CCSID; 6 and 7, WINS servers, scope and the WINS proxy are not supported (QS/400 has no WINS client, return code &3); 8, the browse interval is not 0 to 720000; 9, the oplock time-out is not 1 to 600 or -1; 10, the idle time-out is not above 0 or -1; 12, the WINS proxy is not 0 or 1; 13, QS/400 is not a logon server; 14, the authentication method is not 0, 1 or 2; 15, Kerberos is not configured (QS/400 has none); 16, message authentication is not 0, 1 or 2; 17, QS/400 sends no administrative alerts, so the minimum severity is -1; 18, LAN Manager authentication is never allowed."
vars = ["*CHAR 10", "*BIN 4", "*BIN 4"]

[[msg]]
id = "CPFB687"
sev = 40
text = "API &1: guest profile &3 is not found, or &2 authority to it is missing."
help = "The guest profile must exist and the caller needs at least the named authority to it. Correct the name or get the authority, then call the API again."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPFB688"
sev = 40
text = "API &1 could not open the NetServer list (reason code &2)."
help = "Reason codes: 1, format &3 is not one the API knows; 2, the list could not be built (the qualifier does not suit the format; the messages before this one say more); 3 to 6, the temporary space could not be made, used or removed."
vars = ["*CHAR 10", "*BIN 4", "*CHAR 8"]

[[msg]]
id = "CPFB689"
sev = 40
text = "API &1 could not end NetServer (reason code &2)."
help = "Reason code 1: the QZLSSERVER job could not be found. Try again; if it persists, end subsystem QSERVER."
vars = ["*CHAR 10", "*BIN 4"]

[[msg]]
id = "CPFB68A"
sev = 40
text = "API &1 failed for share &2 (reason code &3)."
help = "Reason codes: 1, a share of that name exists; 2, the share does not exist; 3, the permission is not 1 or 2; 4, the maximum users is not -1 or above 0; 5, the spooled file type is not 1 to 4; 6, the output queue does not exist; 7, the path does not begin with /; 8, the share is of the other kind (file or print); 9, its extension list is damaged; 10, the text conversion value or CCSID is not valid; 11, the publish value is not 0 or 1; 12, the change could not take effect at once."
vars = ["*CHAR 10", "*CHAR 12", "*BIN 4"]

[[msg]]
id = "CPFB68B"
sev = 40
text = "API &1: value &3 of parameter &2 has a character that is not allowed."
help = "Server and domain names take A-Z, 0-9, #, $, @ and blanks inside, with no leading blank. Share names take neither the characters Windows reserves nor a leading blank. Correct the value and call the API again."
vars = ["*CHAR 10", "*BIN 4", "*CHAR 15"]

[[msg]]
id = "CPFB68C"
sev = 40
text = "API &1: guest profile &2 has special authority &3."
help = "A guest profile may have no special authority, neither of its own nor through a group profile. Remove the authority or choose another profile."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPFB68D"
sev = 40
