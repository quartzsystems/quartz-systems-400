# QCPFMSG: the system message file. Every text is Quartz-written; the
# identifiers are the compatibility interface. Substitution variables
# are listed in order: "&1" is the first.
name = "QCPFMSG"
text = "System messages"

# Machine conditions.

[[msg]]
id = "MCH0601"
sev = 40
text = "A pointer was moved outside the space it addresses."
help = "Pointer arithmetic reached past the start or the end of the storage the pointer was set to. The operation did not run."

[[msg]]
id = "MCH0602"
sev = 40
text = "A pointer was stored at an address that is not a multiple of 16."
help = "Pointers live on 16-byte boundaries. Check the structure layout that holds the pointer."

[[msg]]
id = "MCH0603"
sev = 40
text = "A subscript or position is outside its range."
help = "An array index, a string position or a length reached outside the declared bounds. The operation did not run."

[[msg]]
id = "MCH1001"
sev = 40
text = "The user is not authorized to use object &1."
help = "Calling a program needs *OBJOPR and *EXECUTE authority to it, a service program *EXECUTE, and a library named for it *EXECUTE. Ask the object's owner or the security officer for the authority."
vars = ["*CHAR 10"]

[[msg]]
id = "MCH1202"
sev = 40
text = "Decimal data is not valid."
help = "A packed or zoned field holds bytes that are not digits and a sign, or text could not be read as a number."

[[msg]]
id = "MCH1210"
sev = 40
text = "A value does not fit the field it was assigned to."
help = "The integer part of the result has more digits than the receiving field holds. The field was not changed."

[[msg]]
id = "MCH1211"
sev = 40
text = "Division by zero."
help = "The divisor of a division or remainder operation was zero."

[[msg]]
id = "MCH1602"
sev = 40
text = "A date, time or timestamp is not valid."
help = "The value could not be read in the format expected, or the result of a date operation is outside the range the type holds."

[[msg]]
id = "MCH3401"
sev = 40
text = "Object &1 was not found."
help = "The object does not exist in the library named or in the library list, or an import the binder left unresolved was called."
vars = ["*CHAR 10"]

[[msg]]
id = "MCH6801"
sev = 40
text = "Object domain or state was violated."
help = "At security level 40 or 50 a user-state program reached a system-domain object, called a system-state program that is not a published entry, or used a procedure only system state may use."

[[msg]]
id = "MCH3402"
sev = 40
text = "The storage a pointer addresses no longer exists."
help = "The frame returned, the activation group was reclaimed, the heap block was freed or the object was deleted after the pointer was set."

[[msg]]
id = "MCH3601"
sev = 40
text = "A pointer that is not set was used."
help = "The pointer is null, or a parameter was referenced that the caller did not pass."

[[msg]]
id = "MCH3602"
sev = 40
text = "A pointer of the wrong kind was used."
help = "A space pointer was expected where a procedure or system pointer was given, or the other way round."

[[msg]]
id = "MCH4431"
sev = 40
text = "The signature of service program &1 does not match."
help = "The program was bound to an export list the service program no longer answers to. Bind the program again."
vars = ["*CHAR 10"]

# Call and activation.

[[msg]]
id = "CPF2469"
sev = 40
text = "The message could not be sent to call stack entry &1."
help = "The call stack entry named as the target of the message does not exist."
vars = ["*CHAR 10"]

[[msg]]
id = "CPF1015"
sev = 40
text = "Data area &1 in library &2 not found."
help = "The data area does not exist, or the library is not in the library list."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF4101"
sev = 40
text = "File &1 in library &2 not found or inline data file missing."
help = "The file named by the program does not exist, or the job has no file source."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF4131"
sev = 40
text = "Level check on file &1 in library &2, member &3."
help = "The record format the program was compiled with does not have the level identifier the file has now. Recompile the program or change the file."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF9897"
sev = 10
text = "&1"
help = ""
vars = ["*CHAR 512"]

[[msg]]
id = "CPF9898"
sev = 40
text = "&1"
help = ""
vars = ["*CHAR 512"]

[[msg]]
id = "CPF9B70"
sev = 30
text = "&1 with the values given is not available in this release."
help = "The command exists and its other forms work; the form asked for arrives in a later release. Nothing was changed."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD9898"
sev = 30
text = "Detail of the unexpected condition in &1: &2"
help = "The command named ended with function check CPF9898. This entry, kept in the job log only, says what failed underneath; it is for the person who looks after the system."
vars = ["*CHAR 10", "*CHAR 480"]

[[msg]]
id = "CPF9999"
sev = 50
text = "Function check: &1 was not handled at &2."
help = "A program failed with an exception no handler took. The job's default handler sends inquiry CEE9901 to the system operator, whose reply decides what happens next."
vars = ["*CHAR 7", "*CHAR 10"]

# Binder diagnostics.

[[msg]]
id = "CPD5D02"
sev = 30
text = "Import &1 was not resolved."
help = "No module listed, no binding directory and QUSAPIBD exports the symbol. The program is not created unless OPTION(*UNRSLVREF) is specified."
vars = ["*CHAR 256"]

[[msg]]
id = "CPD5D03"
sev = 30
text = "Export &1 is not defined in any module."
help = "The binder source names a symbol no module exports."
vars = ["*CHAR 256"]

[[msg]]
id = "CPD5D04"
sev = 10
text = "Symbol &1 is exported by more than one module."
help = "The first module in the list that exports the symbol is used."
vars = ["*CHAR 256"]

[[msg]]
id = "CPD5D06"
sev = 30
text = "No module has a program entry procedure."
help = "A program needs one module with a main procedure; name it with ENTMOD or list it first."

# Work management.

[[msg]]
id = "CPF1124"
sev = 0
text = "Job &3/&2/&1 started &4 &5 in subsystem &6 in &7; it entered the system &8 &9."
help = "The job began running. The subsystem and its library name where it runs; the second date and time are when it was submitted or signed on."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR 8", "*CHAR 8", "*CHAR 10", "*CHAR 10", "*CHAR 8", "*CHAR 8"]

[[msg]]
id = "CPF1164"
sev = 0
text = "Job &3/&2/&1 ended &4 &5; &6 seconds of processing were used, end code &7."
help = "End code 0 is a normal end; 10 is a normal end with errors; 20 and above mean the job ended because of a severe error, a command to end it, or a power down."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR 8", "*CHAR 8", "*CHAR 10", "*CHAR 3"]

[[msg]]
id = "CPF1907"
sev = 30
text = "The request was ended from the System Request menu."
help = "The operator chose option 2 on the System Request menu (or ran ENDRQS) while the request ran. The programs it called were cancelled down to the nearest control boundary; the command or menu it was started from takes over."

[[msg]]
id = "CPF1313"
sev = 30
text = "Group job name &1 is not valid."
help = "A group job name is up to ten characters, a letter or $, # or @ first, then letters, digits, $, #, @ or _."
vars = ["*CHAR 10"]

[[msg]]
id = "CPF1307"
sev = 30
text = "Group job &1 already exists in the group."
help = "Each job of a group has its own group job name. Choose another name, or transfer to the job that has it with TFRGRPJOB."
vars = ["*CHAR 10"]

[[msg]]
id = "CPF1309"
sev = 30
text = "The group could not complete the request."
help = "The job's group changed while the request ran, or the group no longer exists. Display the group with TFRGRPJOB GRPJOB(*SELECT) and try again."

[[msg]]
id = "CPF1306"
sev = 30
text = "The job cannot leave its group while other jobs are in it."
help = "CHGGRPA GRPJOB(*NONE) removes a job from its group only when it is the last one; end the other group jobs first with ENDGRPJOB."

[[msg]]
id = "CPF1311"
sev = 30
text = "The job is not a group job."
help = "TFRGRPJOB, ENDGRPJOB and the group data area *GDA need a group job. CHGGRPA GRPJOB(name) makes the job one."

[[msg]]
id = "CPF1310"
sev = 30
text = "Transfer to group job &1 not done."
help = "No job of the group has that group job name, or it names the job that asked. TFRGRPJOB GRPJOB(*SELECT) lists the other jobs of the group."
vars = ["*CHAR 10"]

[[msg]]
id = "CPF2460"
sev = 40
text = "The job message queue of &3/&2/&1 is full."
help = "The job log reached its maximum size and the job's queue-full action is *NOWRAP, so the job ends. Raise JOBMSGQMX or use JOBMSGQFL(*WRAP) or *PRTWRAP."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6"]

[[msg]]
id = "CPI2417"
sev = 0
text = "The job message queue of &3/&2/&1 wrapped."
help = "The job log reached its maximum size; the oldest messages were removed to make room, printed first when the action is *PRTWRAP."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6"]

[[msg]]
id = "CPF0900"
sev = 0
text = "IPL of &1 started &2 &3; the previous end was &4."
help = "The system began an initial program load. The previous end is NORMAL when the last power down completed, ABNORMAL when it did not."
vars = ["*CHAR 8", "*CHAR 8", "*CHAR 8", "*CHAR 8"]

[[msg]]
id = "CPF1806"
sev = 0
text = "System value &1 changed from &2 to &3."
help = "A system value was changed. Values marked to take effect at the next IPL keep their old effect until then."
vars = ["*CHAR 10", "*CHAR 80", "*CHAR 80"]

[[msg]]
id = "CPF0902"
sev = 0
text = "Subsystem &1 in library &2 started."
help = "The subsystem's monitor job is running: its pools are allocated, its autostart jobs started and its job queues attached."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF0903"
sev = 0
text = "Subsystem &1 in library &2 ended."
help = "Every job of the subsystem ended and its monitor job ended; its private pools were released."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPC1221"
sev = 0
text = "Job &3/&2/&1 submitted to job queue &4 in &5."
help = "The job waits on the job queue until a subsystem that holds the queue starts it."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF1240"
sev = 50
text = "Job &3/&2/&1 ended abnormally, end code &4."
help = "The job ended because of an error it did not handle, a request to end it, or because its process ended. Its job log has the reason."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR 3"]

[[msg]]
id = "CPF1241"
sev = 0
text = "Job &3/&2/&1 completed normally."
help = "The job ran to its end without an error it left unhandled."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR 3"]

[[msg]]
id = "CPI1E63"
sev = 0
text = "Job &3/&4/&1 submitted for job schedule entry &2."
help = "The job scheduler found the entry due and submitted its command to the entry's job queue."
vars = ["*CHAR 10", "*CHAR 6", "*CHAR 6", "*CHAR 10"]

# The command analyzer's diagnostics (CPD00xx), the command messages
# (CPF00xx), the definition compiler's rules (CPD02xx, ours until the
# machine settles them) and the prompter's.

[[msg]]
id = "CPD0010"
sev = 30
text = "Value &1 is positional beyond the parameters that may be given that way."
help = "The command allows only so many parameters without their keywords. Give this one as KEYWORD(value)."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0011"
sev = 30
text = "Value &1 is positional after a keyword."
help = "Once a parameter is given with its keyword, every following parameter needs its keyword too."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0012"
sev = 30
text = "Keyword &1 is not a parameter of this command."
help = "Check the spelling against the command's prompt (F4) or DSPCMD."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0013"
sev = 30
text = "A quoted string is not closed."
help = "An apostrophe opened a string that never ends. Inside a string, write an apostrophe twice."

[[msg]]
id = "CPD0014"
sev = 30
text = "Parentheses are not balanced."
help = "Every opening parenthesis needs its closing one, outside quoted strings."

[[msg]]
id = "CPD0015"
sev = 30
text = "Parameter &1 is required."
help = "The command needs a value for this parameter and has no default for it."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0016"
sev = 30
text = "Parameter &1 has more values than it allows."
help = "A single value was given several values, a list has more elements than its maximum, or a group has more parts than it defines."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0017"
sev = 30
text = "A hexadecimal string must hold pairs of hexadecimal digits."
help = "X'..' takes an even number of the digits 0 to 9 and A to F."

[[msg]]
id = "CPD0019"
sev = 30
text = "Character &1 cannot start a value."
help = "The character is not one a name, number, string or operator starts with."
vars = ["*CHAR 1"]

[[msg]]
id = "CPD0020"
sev = 30
text = "Keyword &1 was given more than once."
help = "A parameter takes one value or one list; remove the repeated keyword."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0030"
sev = 30
text = "Command &1 in library &2 was not found."
help = "No *CMD object of that name is in the library named, or in the library list when none was named."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPD0031"
sev = 30
text = "Command &1 is not allowed where it was used."
help = "The command's ALLOW attribute does not include this setting: an interactive or batch job, a CL program, or QCMDEXC."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0032"
sev = 30
text = "You may not use command &1 in library &2."
help = "Your profile has no authority to the command object. Ask the security officer for *USE authority to it."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPD0170"
sev = 30
text = "Program &2 in library &3 not found."
help = "No program of that name is in the library named, or in the library list when none was named. The CALL did not run."
vars = ["*CHAR 4", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF0819"
sev = 40
text = "The variable or substring is too small for the result."
help = "The value has more significant digits than the character variable or substring that is to hold it. The variable was not changed."

[[msg]]
id = "CPD0171"
sev = 30
text = "You may not call program &1 in library &2."
help = "Calling a program needs *OBJOPR and *EXECUTE authority to it and *EXECUTE authority to its library. Ask the program's owner or the security officer for the authority."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPD0034"
sev = 30
text = "Command &1 is not allowed in the job's mode."
help = "The command's MODE attribute does not include the mode the job runs in (production, debug or service)."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0035"
sev = 30
text = "Proxy command &1 leads through too many proxies."
help = "A proxy chain may be at most five commands long."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0033"
sev = 30
text = "Command &1 is not allowed for a user with limited capabilities."
help = "The user profile has LMTCPB(*YES); only commands with ALWLMTUSR(*YES) may be typed on a command line."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0043"
sev = 30
text = "Keyword &1 is not valid for this command."
help = "The command has no parameter with that keyword. Check the spelling, or press F4 to see the command's keywords."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0061"
sev = 30
text = "The values of parameter &1 of command &2 do not go together."
help = "A dependency between parameters of the command does not hold. The prompt (F4) shows which values are expected together."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPD0074"
sev = 30
text = "The value of parameter &1 is too long."
help = "The value has more characters or digits than the parameter's length allows."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0078"
sev = 30
text = "The value of parameter &1 is not a valid name."
help = "A name is up to ten characters: a letter, $, # or @ first, then letters, digits, $, #, @, _ or a period."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0084"
sev = 30
text = "The value of parameter &1 is not allowed."
help = "The value is not one the parameter accepts: not in its list of values, of the wrong kind, or a variable where none is allowed."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0085"
sev = 30
text = "The value of parameter &1 has too many decimal positions."
help = "The parameter allows fewer decimal positions than the value has, or none."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0093"
sev = 30
text = "The value of parameter &1 is outside its range."
help = "The parameter's RANGE attribute bounds the values it accepts."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0094"
sev = 30
text = "The value of parameter &1 fails its relational check."
help = "The parameter's REL attribute compares the value with a limit."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0201"
sev = 30
text = "Command &1 already exists in library &2."
help = "Use REPLACE(*YES) to replace it, or another name."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPD0202"
sev = 30
text = "Keyword &1 is not a parameter of command &2."
help = "NEWDFT names keywords of the command whose defaults change."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPD0203"
sev = 30
text = "Parameter &1 of command &2 has no default to change."
help = "A required parameter has no default; CHGCMDDFT changes only defaults."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPD0211"
sev = 30
text = "A PARM statement needs KWD."
help = "Every PARM statement of a command definition must name its keyword with KWD. Add KWD to the statement and create the command again."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0212"
sev = 30
text = "More than 99 parameters are defined."
help = "A command can have at most 99 parameters. Combine related parameters into element lists, or split the command."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0213"
sev = 30
text = "Keyword &1 is not well formed."
help = "A keyword is one to ten characters: a letter, then letters, digits, $, # or @."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0214"
sev = 30
text = "Keyword &1 is defined more than once."
help = "Two PARM statements use the same keyword. Give each parameter its own keyword."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0215"
sev = 30
text = "MAXPOS(&1) is more than the parameters defined."
help = "MAXPOS counts the parameters that may be given by position; it cannot exceed the number of parameters the command defines. Lower MAXPOS or remove it."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0216"
sev = 30
text = "TYPE(&1) is not a type or a label."
help = "TYPE must be one of the parameter types (*CHAR, *NAME, *DEC and the rest) or the label of an ELEM or QUAL statement in the same source."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0217"
sev = 30
text = "TYPE(&1) names no ELEM or QUAL statement."
help = "A label used as a type must label ELEM or QUAL statements. Add the statements or correct the label."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0218"
sev = 30
text = "Label &1 is used more than once."
help = "Each label in a command definition source may label one group of statements only. Rename one of them."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0219"
sev = 30
text = "Lists nest more than three levels deep at &1."
help = "Element lists can hold lists of their own only three levels deep. Flatten the definition."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0220"
sev = 30
text = "A qualified name has at most five parts; &1 has more."
help = "A qualified name is made of at most five QUAL statements. Remove the extra ones."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0221"
sev = 30
text = "A list has at most 300 elements; &1 has more."
help = "An element list can have at most 300 elements. Remove some, or split them over parameters."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0222"
sev = 30
text = "LEN is not valid for TYPE(&1)."
help = "The type given takes its length from the system; LEN cannot be given for it. Remove LEN."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0223"
sev = 30
text = "LEN(&1): the decimal positions or the digits are out of range."
help = "The length or the number of decimal positions is outside what the type allows: for *DEC up to 24 digits, with no more decimal positions than digits."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0224"
sev = 30
text = "RTNVAL(*YES) on &1 needs TYPE *CHAR, *DEC or *LGL."
help = "A return value parameter passes a CL variable to receive a value, so it must be a character, decimal or logical type."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0225"
sev = 30
text = "RTNVAL(*YES) on &1 allows no default, minimum, values or ranges."
help = "A return value parameter receives a value; a default, a minimum, a list of values or a range has no meaning for it. Remove them."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0226"
sev = 30
text = "TYPE(*CMDSTR) on &1 allows no list, restriction or values."
help = "A command string parameter is passed as typed; it cannot be a list, be restricted or take a list of values."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0227"
sev = 30
text = "TYPE(*CMD) on &1 cannot be a list."
help = "A command parameter takes one command; MAX must be 1."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0228"
sev = 30
text = "MIN and MAX on &1 are not valid together."
help = "MIN cannot be greater than MAX, and MAX must be at least 1."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0229"
sev = 30
text = "&1 is required and has a default."
help = "A required parameter (MIN greater than zero) always has a value given, so a default is never used. Remove DFT or make the parameter optional."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0230"
sev = 30
text = "RSTD(*YES) on &1 needs VALUES, SPCVAL or SNGVAL."
help = "RSTD(*YES) limits a parameter to the values the definition lists, so at least one of VALUES, SPCVAL or SNGVAL must be given."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0231"
sev = 30
text = "&1 has both REL and RANGE."
help = "A parameter can be checked by a relation (REL) or by a range (RANGE), not by both. Keep one."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0232"
sev = 30
text = "RANGE on &1: the lower value is above the upper one."
help = "The first value of RANGE is the lowest accepted and the second the highest. Exchange them."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0233"
sev = 30
text = "SNGVAL on &1 needs a list or a group type."
help = "SNGVAL values stand in for a whole list or a whole qualified name, so SNGVAL is valid only on a parameter with MAX above 1 or a type naming ELEM or QUAL statements."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0234"
sev = 30
text = "PMTCTL(&1) names no PMTCTL statement."
help = "The PMTCTL keyword of the parameter names a label that no PMTCTL statement has. Add the statement or correct the label."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0235"
sev = 30
text = "PMTCTL CTL(&1) names no parameter."
help = "The CTL keyword of a PMTCTL statement must name a parameter of the command."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0236"
sev = 30
text = "DEP names parameter &1, which is not defined."
help = "Every parameter a DEP statement names must be defined by a PARM statement of the command."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0237"
sev = 30
text = "The source needs exactly one CMD statement."
help = "A command definition source has one CMD statement, before every other statement."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0238"
sev = 30
text = "KEYPARM(*YES) parameters must come before the others; &1 does not."
help = "Key parameters are the ones the prompter shows first; their PARM statements must come before those of the other parameters."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0239"
sev = 30
text = "CONSTANT on &1 allows no default, minimum, restriction or return value."
help = "A constant parameter always passes the same value and is never prompted, so it takes no default, minimum, restriction or return value."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0240"
sev = 30
text = "VARY on &1 needs TYPE *CHAR or *PNAME."
help = "A varying-length value is passed with its length; only character and path name types can vary."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0241"
sev = 30
text = "PROMPT text on &1 is over 30 characters."
help = "The prompt text of a parameter, element or qualifier is shown beside its field and can be at most 30 characters long."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0242"
sev = 30
text = "Keyword &1 is not valid on this statement."
help = "The keyword shown belongs to another statement of a command definition. Remove it or move it to the right statement."
