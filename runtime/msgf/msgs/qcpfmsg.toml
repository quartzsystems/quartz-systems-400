vars = ["*CHAR 10"]

[[msg]]
id = "CPD0247"
sev = 30
text = "&1 has a default but its type takes none."
vars = ["*CHAR 10"]

[[msg]]
id = "CPD0248"
sev = 30
text = "TYPE(&1) names a PMTCTL label; a type needs an ELEM or QUAL label."
vars = ["*CHAR 10"]

[[msg]]
