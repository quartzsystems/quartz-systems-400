[[msg]]
id = "CPI099B"
sev = 90
text = "The system ASP is below its critical storage lower limit."
help = "ASP 1 holds &1 bytes, &2 of them in use; &4 percent is available and QSTGLOWLMT is &3 percent. Reduce the storage used before the ASP fills: delete what is not needed, save with STG(*FREE), clear old history logs and spooled files. WRKSYSSTS shows the use; WRKSYSVAL changes QSTGLOWLMT and QSTGLOWACN."
vars = ["*CHAR 20", "*CHAR 20", "*CHAR 7", "*CHAR 7"]

[[msg]]
id = "CPI099C"
sev = 90
