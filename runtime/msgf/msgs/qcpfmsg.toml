help = "REPLACE(*NO) was given and an object of that name and type is already there. Delete it, name another, or let REPLACE(*YES) replace it."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPC0570"
sev = 0
text = "Source of program &1 retrieved."
vars = ["*CHAR 10"]

[[msg]]
