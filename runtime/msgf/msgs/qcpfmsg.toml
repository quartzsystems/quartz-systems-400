help = "ASP 1 holds &1 bytes, &2 of them in use; &4 percent is available and QSTGLOWLMT is &3 percent. The system now takes the QSTGLOWACN action &5: *MSG nothing more, *CRITMSG sends CPI099B, *REGFAC submits a job that calls the QIBM_QWC_QSTGLOWACN exit programs, *ENDSYS ends the system to the restricted state, *PWRDWNSYS powers down at once and restarts. The action is taken again every 30 minutes while the ASP stays below the limit."
vars = ["*CHAR 20", "*CHAR 20", "*CHAR 7", "*CHAR 7", "*CHAR 10"]

[[msg]]
id = "CPI099D"
sev = 90
text = "The system is starting in the restricted state: storage is below its lower limit."
help = "ASP 1 holds &1 bytes, &2 of them in use; &4 percent is available and QSTGLOWLMT is &3 percent. Only the console is active and no subsystem starts until the storage used drops below the limit or QSTGLOWACN is *MSG or *CRITMSG."
vars = ["*CHAR 20", "*CHAR 20", "*CHAR 7", "*CHAR 7"]

