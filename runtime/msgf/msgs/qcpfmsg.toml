# QCPFMSG: the system message file. Every text is Quartz-written; the
# identifiers are the compatibility interface. Substitution variables
# are listed in order: "&1" is the first.
name = "QCPFMSG"
text = "System messages"

# Machine conditions.

[[msg]]
id = "MCH0601"
sev = 40
text = "A pointer was moved outside the space it addresses."
help = "Pointer arithmetic reached past the start or the end of the storage the pointer was set to. The operation did not run."

[[msg]]
id = "MCH0602"
sev = 40
text = "A pointer was stored at an address that is not a multiple of 16."
help = "Pointers live on 16-byte boundaries. Check the structure layout that holds the pointer."

[[msg]]
id = "MCH0603"
sev = 40
text = "A subscript or position is outside its range."
help = "An array index, a string position or a length reached outside the declared bounds. The operation did not run."

[[msg]]
id = "MCH1202"
sev = 40
text = "Decimal data is not valid."
help = "A packed or zoned field holds bytes that are not digits and a sign, or text could not be read as a number."

[[msg]]
id = "MCH1210"
sev = 40
text = "A value does not fit the field it was assigned to."
help = "The integer part of the result has more digits than the receiving field holds. The field was not changed."

[[msg]]
id = "MCH1211"
sev = 40
text = "Division by zero."
help = "The divisor of a division or remainder operation was zero."

[[msg]]
id = "MCH1602"
sev = 40
text = "A date, time or timestamp is not valid."
help = "The value could not be read in the format expected, or the result of a date operation is outside the range the type holds."

[[msg]]
id = "MCH3401"
sev = 40
text = "Object &1 was not found."
help = "The object does not exist in the library named or in the library list, or an import the binder left unresolved was called."
vars = ["*CHAR 10"]

[[msg]]
id = "MCH6801"
sev = 40
text = "Object domain or state was violated."
help = "At security level 40 or 50 a user-state program reached a system-domain object, called a system-state program that is not a published entry, or used a procedure only system state may use."

[[msg]]
id = "MCH3402"
sev = 40
text = "The storage a pointer addresses no longer exists."
help = "The frame returned, the activation group was reclaimed, the heap block was freed or the object was deleted after the pointer was set."

[[msg]]
id = "MCH3601"
sev = 40
text = "A pointer that is not set was used."
help = "The pointer is null, or a parameter was referenced that the caller did not pass."

[[msg]]
id = "MCH3602"
sev = 40
text = "A pointer of the wrong kind was used."
help = "A space pointer was expected where a procedure or system pointer was given, or the other way round."

[[msg]]
id = "MCH4431"
sev = 40
text = "The signature of service program &1 does not match."
help = "The program was bound to an export list the service program no longer answers to. Bind the program again."
vars = ["*CHAR 10"]

# Call and activation.

[[msg]]
id = "CPF2469"
sev = 40
text = "The message could not be sent to call stack entry &1."
help = "The call stack entry named as the target of the message does not exist."
vars = ["*CHAR 10"]

[[msg]]
id = "CPF1015"
sev = 40
text = "Data area &1 in library &2 not found."
help = "The data area does not exist, or the library is not in the library list."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF4101"
sev = 40
text = "File &1 in library &2 not found or inline data file missing."
help = "The file named by the program does not exist, or the job has no file source."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF4131"
sev = 40
text = "Level check on file &1 in library &2, member &3."
help = "The record format the program was compiled with does not have the level identifier the file has now. Recompile the program or change the file."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF9897"
sev = 10
text = "&1"
help = ""
vars = ["*CHAR 512"]

[[msg]]
id = "CPF9898"
sev = 40
text = "&1"
help = ""
vars = ["*CHAR 512"]

[[msg]]
id = "CPF9999"
sev = 50
text = "Function check: &1 was not handled at &2."
help = "A program failed with an exception no handler took. The job's default handler sends inquiry CEE9901 to the system operator, whose reply decides what happens next."
vars = ["*CHAR 7", "*CHAR 10"]

# Binder diagnostics.

[[msg]]
id = "CPD5D02"
sev = 30
text = "Import &1 was not resolved."
help = "No module listed, no binding directory and QUSAPIBD exports the symbol. The program is not created unless OPTION(*UNRSLVREF) is specified."
vars = ["*CHAR 256"]

[[msg]]
id = "CPD5D03"
sev = 30
text = "Export &1 is not defined in any module."
help = "The binder source names a symbol no module exports."
vars = ["*CHAR 256"]

[[msg]]
id = "CPD5D04"
sev = 10
text = "Symbol &1 is exported by more than one module."
help = "The first module in the list that exports the symbol is used."
vars = ["*CHAR 256"]

[[msg]]
id = "CPD5D06"
sev = 30
text = "No module has a program entry procedure."
help = "A program needs one module with a main procedure; name it with ENTMOD or list it first."

# Work management.

[[msg]]
id = "CPF1124"
sev = 0
text = "Job &3/&2/&1 started &4 &5 in subsystem &6 in &7; it entered the system &8 &9."
help = "The job began running. The subsystem and its library name where it runs; the second date and time are when it was submitted or signed on."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR 8", "*CHAR 8", "*CHAR 10", "*CHAR 10", "*CHAR 8", "*CHAR 8"]

[[msg]]
id = "CPF1164"
sev = 0
text = "Job &3/&2/&1 ended &4 &5; &6 seconds of processing were used, end code &7."
help = "End code 0 is a normal end; 10 is a normal end with errors; 20 and above mean the job ended because of a severe error, a command to end it, or a power down."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR 8", "*CHAR 8", "*CHAR 10", "*CHAR 3"]

[[msg]]
id = "CPF2460"
sev = 40
text = "The job message queue of &3/&2/&1 is full."
help = "The job log reached its maximum size and the job's queue-full action is *NOWRAP, so the job ends. Raise JOBMSGQMX or use JOBMSGQFL(*WRAP) or *PRTWRAP."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6"]

[[msg]]
id = "CPI2417"
sev = 0
text = "The job message queue of &3/&2/&1 wrapped."
help = "The job log reached its maximum size; the oldest messages were removed to make room, printed first when the action is *PRTWRAP."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6"]

[[msg]]
id = "CPF0900"
sev = 0
text = "IPL of &1 started &2 &3; the previous end was &4."
help = "The system began an initial program load. The previous end is NORMAL when the last power down completed, ABNORMAL when it did not."
vars = ["*CHAR 8", "*CHAR 8", "*CHAR 8", "*CHAR 8"]

[[msg]]
id = "CPF1806"
sev = 0
text = "System value &1 changed from &2 to &3."
help = "A system value was changed. Values marked to take effect at the next IPL keep their old effect until then."
vars = ["*CHAR 10", "*CHAR 80", "*CHAR 80"]

[[msg]]
id = "CPF0902"
sev = 0
text = "Subsystem &1 in library &2 started."
help = "The subsystem's monitor job is running: its pools are allocated, its autostart jobs started and its job queues attached."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF0903"
sev = 0
text = "Subsystem &1 in library &2 ended."
help = "Every job of the subsystem ended and its monitor job ended; its private pools were released."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPC1221"
sev = 0
text = "Job &3/&2/&1 submitted to job queue &4 in &5."
help = "The job waits on the job queue until a subsystem that holds the queue starts it."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF1240"
sev = 50
text = "Job &3/&2/&1 ended abnormally, end code &4."
help = "The job ended because of an error it did not handle, a request to end it, or because its process ended. Its job log has the reason."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR 3"]

[[msg]]
id = "CPF1241"
sev = 0
text = "Job &3/&2/&1 completed normally."
help = "The job ran to its end without an error it left unhandled."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR 3"]

[[msg]]
id = "CPI1E63"
sev = 0
text = "Job &3/&4/&1 submitted for job schedule entry &2."
help = "The job scheduler found the entry due and submitted its command to the entry's job queue."
vars = ["*CHAR 10", "*CHAR 6", "*CHAR 6", "*CHAR 10"]
