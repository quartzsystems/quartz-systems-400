vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "CPF0901"
sev = 30
text = "Menu &1 is not available in this release."
help = "Menus arrive in a later release; the command line of the main menu and Command Entry run commands now."
vars = ["*CHAR 10"]

[[msg]]
id = "CPF3700"
sev = 40
text = "Save and restore are not available in this release."
