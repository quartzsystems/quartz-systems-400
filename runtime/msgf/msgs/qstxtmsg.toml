# Display File Description (DSPFD TYPE(*CST)): the constraint section.

[[msg]]
id = "TXT0301"
text = "Constraint description"
help = "Text of the Display File Description report: the heading of the constraints of a physical file (TYPE(*CST))."

[[msg]]
id = "TXT0302"
text = "Number of constraints"
help = "Text of the Display File Description report: the label of how many constraints the file has."

[[msg]]
id = "TXT0303"
text = "Constraint"
help = "Text of the Display File Description report: the label of a constraint's name."

[[msg]]
id = "TXT0304"
text = "Type"
