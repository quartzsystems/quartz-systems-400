# QSTXTMSG: display text. Words and labels the system's displays and
# printed reports show, kept here rather than in program code so that a
# secondary language library (QSYS29xx) can carry them translated. The
# texts are Quartz-written; the identifiers are ours (TXT prefix).
name = "QSTXTMSG"
text = "Display text"

