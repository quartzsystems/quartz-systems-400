# QSYS2931: Spanish, the scaffold secondary language. Machine-translated
# first-level text only, written to prove the national language
# mechanism (INSLNG, the language library ahead of QSYS, the sign-on in
# the secondary language); not reviewed by a translator. A message not
# listed keeps its English first-level text, and no message carries
# second-level text. See docs/MSGF.md "National languages".
feature = 2931
ccsid = 284
library = "SCAFFOLD: Spanish 2931, machine translated"
marker = "(SCAFFOLD)"

[files]
QCPFMSG = "Mensajes del sistema"
QSTXTMSG = "Texto de pantallas"

# Display file constants: the English constant and its Spanish one, as
# long or shorter where the layout needs it.
[constants]
"Sign On" = "Inicio de sesión"
"System  . . . . . :" = "Sistema . . . . . :"
"Subsystem . . . . :" = "Subsistema  . . . :"
"Display . . . . . :" = "Pantalla  . . . . :"
"User  . . . . . . . . . . . . . ." = "Usuario . . . . . . . . . . . . ."
"Password  . . . . . . . . . . . ." = "Contraseña  . . . . . . . . . . ."
"Program/procedure . . . . . . . ." = "Programa/procedimiento  . . . . ."
"Menu  . . . . . . . . . . . . . ." = "Menú  . . . . . . . . . . . . . ."
"Current library . . . . . . . . ." = "Biblioteca actual . . . . . . . ."

