# QTCPMSG: the TCP/IP configuration and operation messages (STRTCP,
# ENDTCP, the interface, route, host table, port and attribute commands).
# Identifiers the oracle's QTCP/QTCPMSGF shows keep its numbers and
# substitution layouts (tools/conformance/oracle/net/pub400/messages-tcp.txt);
# the TCP1Axx and TCP1Dxx ones are ours in IBM's families. Every text is ours.
name = "QTCPMSG"
text = "TCP/IP messages"

[[msg]]
id = "TCP1A00"
sev = 0
text = "TCP/IP started."
help = "The stack is up: the loopback, the interfaces that start with TCP/IP, their routes, the attributes and the port restrictions are in place."

[[msg]]
id = "TCP1A01"
sev = 20
text = "TCP/IP is already active."
help = "STRTCP was run while TCP/IP was started. Nothing was changed; STRTCPIFC starts an interface on its own."

[[msg]]
id = "TCP1A02"
sev = 0
text = "TCP/IP ended."
help = "Every interface has ended and the routes and port restrictions TCP/IP put in place are gone."

[[msg]]
id = "TCP1A03"
sev = 20
text = "TCP/IP is not active."
help = "ENDTCP was run while TCP/IP was not started."

[[msg]]
id = "TCP1A04"
sev = 30
text = "&1 cannot be started in this release."
help = "The server named is not one this release runs yet."
vars = ["*CHAR 10"]

[[msg]]
id = "TCP1A05"
sev = 30
text = "&1 could not be started."
help = "The server's job did not start. The job log of the job that asked has the reason."
vars = ["*CHAR 10"]

[[msg]]
id = "TCP1A06"
sev = 30
text = "Server instance &2 of &1 not found."
help = "The instance named on HTTPSVR or INSTANCE is not one this server has. The HTTP server has one, the administration instance *ADMIN."
vars = ["*CHAR 10", "*CHAR 32"]

[[msg]]
id = "TCP1A07"
sev = 0
text = "&1 server starting."
help = "The server's job was started and is getting ready for connections."
vars = ["*CHAR 10"]

[[msg]]
id = "TCP1A08"
sev = 10
text = "&1 server already started."
help = "The server's job is running; nothing was started."
vars = ["*CHAR 10"]

[[msg]]
id = "TCP1A09"
sev = 10
text = "&1 server not active."
help = "The server's job is not running; nothing was ended."
vars = ["*CHAR 10"]

[[msg]]
id = "TCP1A0A"
sev = 0
text = "&1 server ending."
help = "The server's job was asked to end."
vars = ["*CHAR 10"]

[[msg]]
id = "TCP1A0B"
sev = 0
text = "Interface &1 started."
help = "The address is on its line and its routes are in place."
vars = ["*CHAR 45"]

[[msg]]
id = "TCP1A0C"
sev = 0
text = "Interface &1 ended."
help = "The address was taken off its line; routes through it were removed."
vars = ["*CHAR 45"]

[[msg]]
id = "TCP1A0D"
sev = 20
text = "Interface &1 is already active."
help = "STRTCPIFC was asked for an interface that is started."
vars = ["*CHAR 45"]

[[msg]]
id = "TCP1A0E"
sev = 20
text = "Interface &1 is not active."
help = "ENDTCPIFC was asked for an interface that is not started."
vars = ["*CHAR 45"]

[[msg]]
id = "TCP1A0F"
sev = 30
text = "Interface &1 not started: &2"
help = "The kernel or the line refused part of the start. The interface shows Failed until it is started again."
vars = ["*CHAR 45", "*CHAR 128"]

[[msg]]
id = "TCP1A10"
sev = 0
text = "&1 attributes changed."
help = "The server's attributes are kept in the TCP/IP server table in QUSRSYS. A running server takes the new values when it is started again."
vars = ["*CHAR 10"]

[[msg]]
id = "TCP1A11"
sev = 20
text = "Route to &1 not added: &2"
help = "The kernel refused the route; it shows Failed and is tried again when an interface starts."
vars = ["*CHAR 45", "*CHAR 128"]

[[msg]]
id = "TCP1A13"
sev = 20
text = "Attribute not applied: &1"
help = "A TCP/IP attribute could not be given to the kernel. It is kept and applied at the next STRTCP."
vars = ["*CHAR 128"]

[[msg]]
id = "TCP1A14"
sev = 0
text = "TCP/IP ending."
help = "ENDTCP is ending the servers, then the interfaces."

[[msg]]
id = "TCP1A40"
sev = 0
text = "SNTP client adjusted the clock by &1 milliseconds."
help = "The time server named in CHGNTPA RMTSYS showed the system clock off by this much. The clock is moved gradually, or set at once when the difference is over ADJTHLD."
vars = ["*CHAR 20"]

[[msg]]
id = "TCP1A41"
sev = 40
text = "Clock not adjusted: &2 differs by &1 seconds, more than MAXADJ."
help = "The SNTP client leaves differences larger than CHGNTPA MAXADJ alone. Check the time server, or set the date and time and let the client keep them."
vars = ["*CHAR 20", "*CHAR 255"]

[[msg]]
id = "TCP1A42"
sev = 10
text = "Clock set at once: &2 differed by &1 seconds."
help = "The difference was over CHGNTPA ADJTHLD and within MAXADJ, so the SNTP client set the clock rather than moving it gradually."
vars = ["*CHAR 20", "*CHAR 255"]

[[msg]]
id = "TCP1A43"
sev = 20
text = "No time server answered: &1."
help = "None of the systems in CHGNTPA RMTSYS gave a usable answer. The client tries again at the next poll interval."
vars = ["*CHAR 255"]

[[msg]]
id = "TCP1A44"
sev = 30
text = "SNTP client not adjusting the clock: QTIMADJ names &1."
help = "The system value QTIMADJ says other software adjusts the clock. Change it to *NONE to let the SNTP client adjust it."
vars = ["*CHAR 30"]

[[msg]]
id = "TCP1A45"
sev = 0
text = "SNTP poll of &1: offset &2 ms, round trip &3 ms."
help = "One poll of the client, logged with CHGNTPA ACTLOG(*POLL)."
vars = ["*CHAR 255", "*CHAR 20", "*CHAR 20"]

[[msg]]
id = "TCP1A46"
sev = 0
text = "SNTP request from &1 &2."
help = "A request the SNTP server received, logged as CHGNTPA SVRACTLOG asks."
vars = ["*CHAR 64", "*CHAR 20"]

[[msg]]
id = "TCP1A47"
sev = 0
text = "LPD spooled file &1 from &2 into &3."
help = "A job received by the line printer daemon is now a spooled file on the output queue its queue name names."
vars = ["*CHAR 10", "*CHAR 64", "*CHAR 21"]

[[msg]]
id = "TCP1A48"
sev = 20
text = "LPD job from &1 not spooled: &2."
help = "The line printer daemon received a job it could not make into a spooled file. The sender was told."
vars = ["*CHAR 64", "*CHAR 128"]

[[msg]]
id = "TCP1A49"
sev = 0
text = "Spooled file &1 sent to queue &2 on &3."
help = "The remote system's line printer daemon took the spooled file."
vars = ["*CHAR 10", "*CHAR 255", "*CHAR 255"]

[[msg]]
id = "TCP1A4A"
sev = 40
text = "Spooled file &1 not sent: &2."
help = "The spooled file could not be found, read, or delivered to the remote system's line printer daemon."
vars = ["*CHAR 10", "*CHAR 128"]

[[msg]]
id = "TCP1A4B"
sev = 0
text = "E-mail sent to &1 of &2 recipients."
help = "The mail router took the message for the recipients it accepted. Delivery from there is its work."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "TCP1A4C"
sev = 40
text = "E-mail not sent: &1."
help = "The message could not be built or handed to the mail router that CHGSMTPA FWDHUBSVR or MAILROUTER names."
vars = ["*CHAR 128"]

[[msg]]
id = "TCP1D03"
sev = 0
text = "&1 entry added."
help = "The configuration file has the new entry. An entry for an active interface takes effect now."
vars = ["*CHAR 20"]

[[msg]]
id = "TCP1D04"
sev = 0
text = "&1 entry changed."
help = "The configuration file has the changed entry."
vars = ["*CHAR 20"]

[[msg]]
id = "TCP1D05"
sev = 0
text = "&1 entry removed."
help = "The entry is gone from the configuration file."
vars = ["*CHAR 20"]

[[msg]]
id = "TCP1D06"
sev = 30
text = "The entry already exists: &1"
help = "An entry with the same key is configured. Change it, or remove it first."
vars = ["*CHAR 128"]

[[msg]]
id = "TCP1D07"
sev = 30
text = "The entry was not found: &1"
help = "No entry has the key given."
vars = ["*CHAR 128"]

[[msg]]
id = "TCP1D08"
sev = 30
text = "Value not valid: &1"
help = "A parameter's value is outside what the command takes, or does not fit with another parameter."
vars = ["*CHAR 128"]

[[msg]]
id = "TCP1D09"
sev = 0
text = "TCP/IP attributes changed."
help = "The attributes are kept; those with a kernel setting take effect now when TCP/IP is active."

[[msg]]
id = "TCP1D0A"
sev = 0
text = "Host table merged: &1 entries added, &2 changed."
help = "MRGTCPHT added the addresses that were new and the names that were missing."
vars = ["*BIN 4", "*BIN 4"]

[[msg]]
id = "TCP1D0B"
sev = 0
text = "Host table entry &1 renamed to &2."
help = "The names and text moved to the new address."
vars = ["*CHAR 45", "*CHAR 45"]

[[msg]]
id = "TCP1D0C"
sev = 30
text = "The entry is in use: &1"
help = "An active interface, or another entry, depends on it. End the interface or change the other entry first."
vars = ["*CHAR 128"]

[[msg]]
id = "TCP1D0D"
sev = 30
text = "The table is full: &1"
help = "The table holds as many entries as it can."
vars = ["*CHAR 128"]

[[msg]]
id = "TCP2640"
sev = 20
text = "The request needs TCP/IP, which is not active."
help = "Start TCP/IP with STRTCP and try again."

[[msg]]
id = "TCP2658"
sev = 30
text = "No interface has the address '&1'."
help = "The address must be one of a configured interface."
vars = ["*CHAR 50"]

[[msg]]
id = "TCP3200"
sev = 10
text = "The remote system name is too long."
help = "A remote system name may be at most 255 characters."

[[msg]]
id = "TCP3202"
sev = 10
text = "No address is known for host &1."
help = "The name is neither in the host table nor known to the name servers TCP/IP is configured with (CHGTCPDMN)."
vars = ["*CHAR 48", "*CHAR 208"]

[[msg]]
id = "TCP3203"
sev = 0
text = "Checking the connection to host &3 at &4."
help = "Echo requests are going to the address the name resolved to."
vars = ["*CHAR 24", "*CHAR 15", "*CHAR 256", "*CHAR 64"]

[[msg]]
id = "TCP3204"
sev = 0
text = "Checking the connection to host &2."
help = "Echo requests are going to the address given."
vars = ["*CHAR 24", "*CHAR 256"]

[[msg]]
id = "TCP3205"
sev = 0
text = "Packet &1 took &2 seconds; &3 answered so far."
help = "One echo request's round trip."
vars = ["*BIN 4", "*DEC 11 3", "*BIN 4"]

[[msg]]
id = "TCP3206"
sev = 10
text = "No reply within &1 seconds to packet &2."
help = "The remote system, or a router on the way, did not answer the echo request in time. It may be down, unreachable, or dropping echo requests."
vars = ["*BIN 4", "*BIN 4"]

[[msg]]
id = "TCP3207"
sev = 10
text = "&2 is not a local internet address."
help = "LCLINTNETA must name an address of one of this system's interfaces, or be *ANY."
vars = ["*CHAR 15", "*CHAR 64"]

[[msg]]
id = "TCP3208"
sev = 10
text = "A reply came after the wait time."
help = "The answer arrived too late to count."
vars = ["*BIN 4", "*BIN 4"]

[[msg]]
id = "TCP3209"
sev = 0
text = "The INTNETADR parameter is not correct."
help = "With RMTSYS(*INTNETADR), INTNETADR names the address to check."

[[msg]]
id = "TCP3210"
sev = 0
text = "&1 of &2 packets answered (&3 %)."
help = "How many of the echo requests had a reply."
vars = ["*BIN 4", "*BIN 4", "*BIN 4"]

[[msg]]
id = "TCP3211"
sev = 0
text = "Round trip in milliseconds, least/average/most: &1/&2/&3."
help = "The fastest, average and slowest replies."
vars = ["*BIN 4", "*BIN 4", "*BIN 4"]

[[msg]]
id = "TCP3213"
sev = 0
text = "The remote system cannot be reached."
help = "No route leads to the address."
vars = ["*CHAR 24", "*CHAR 15", "*CHAR 256", "*CHAR 64"]

[[msg]]
id = "TCP3215"
sev = 0
text = "Reply &2 from &5 in &1 ms: &3 bytes, TTL &4."
help = "An echo reply arrived."
vars = ["*BIN 4", "*BIN 2", "*BIN 2", "*BIN 2", "*CHAR 15"]

[[msg]]
id = "TCP3216"
sev = 0
text = "Reply &2 from &5 in &1 ms: &3 bytes, TTL &4. (a duplicate)"
help = "A second reply to the same echo request arrived."
vars = ["*BIN 4", "*BIN 2", "*BIN 2", "*BIN 2", "*CHAR 15"]

[[msg]]
id = "TCP3217"
sev = 0
text = "Reply &2 from &5 in &1 ms: &3 bytes, hop limit &4."
help = "An IPv6 echo reply arrived."
vars = ["*BIN 4", "*BIN 2", "*BIN 2", "*BIN 2", "*CHAR 64"]

[[msg]]
id = "TCP3218"
sev = 0
text = "Reply &2 from &5 in &1 ms: &3 bytes, hop limit &4. (a duplicate)"
help = "A second IPv6 reply to the same echo request arrived."
vars = ["*BIN 4", "*BIN 2", "*BIN 2", "*BIN 2", "*CHAR 64"]

[[msg]]
id = "TCP3219"
sev = 10
text = "&1 is not an address of the version &2 asks for."
help = "ADRVERFMT(*IP4) takes IPv4 addresses and ADRVERFMT(*IP6) IPv6 ones."
vars = ["*CHAR 64", "*CHAR 5"]

[[msg]]
id = "TCP3252"
sev = 40
text = "The first hop is past the last hop."
help = "RANGE's starting TTL must not be greater than its maximum."

[[msg]]
id = "TCP3260"
sev = 0
text = "Tracing the route to &7&10 from &9 interface."
help = "Probes with a growing TTL go out; each router where one expires answers."
vars = ["*BIN 4", "*BIN 4", "*BIN 4", "*BIN 4", "*CHAR 15", "*CHAR 18", "*CHAR 32", "*CHAR 224", "*CHAR 64", "*CHAR 64"]

[[msg]]
id = "TCP3261"
sev = 0
text = "&4 &2&6 &5"
help = "One hop: its number, the node that answered, and each probe's time in milliseconds (* for none)."
vars = ["*CHAR 18", "*CHAR 32", "*CHAR 224", "*BIN 2", "*CHAR *VARY 2", "*CHAR 64"]

[[msg]]
id = "TCP3263"
sev = 40
text = "&1 socket operation &2 failed: error &3, &6."
help = "The network tool could not use its socket."
vars = ["*CHAR 10", "*BIN 2", "*BIN 2", "*BIN 2", "*CHAR 16", "*CHAR *VARY 2", "*CHAR 64"]

[[msg]]
id = "TCP8007"
sev = 30
text = "The line for TCP/IP could not be started."
help = "Varying the line on failed. See the earlier messages for why."

[[msg]]
id = "TCP9509"
sev = 10
text = "Line &1 does not exist."
help = "Create the line description, or name another."
vars = ["*CHAR 10"]

[[msg]]
id = "TCP9515"
sev = 20
text = "That internet address or line is already configured."
help = "Interfaces need distinct addresses and alias names."

[[msg]]
id = "TCP9517"
sev = 30
text = "That port restriction already exists."
help = "The same port, protocol and user profile are already restricted."

[[msg]]
id = "TCP9518"
sev = 20
text = "Line &1 cannot carry TCP/IP (&2)."
help = "The line has no network port TCP/IP can use."
vars = ["*CHAR 10", "*CHAR 6"]

[[msg]]
id = "TCP9640"
sev = 0
text = "The host table is empty."
help = "No host table entries are configured."

[[msg]]
id = "TCP9642"
sev = 0
text = "No routes are configured."
help = "The route table is empty."

[[msg]]
id = "TCP9644"
sev = 0
text = "No port restrictions are configured."
help = "Every port can be bound by any user profile."

[[msg]]
id = "TCP9650"
sev = 20
text = "The host name and domain name are too long together."
help = "With the period between them they may be at most 255 characters."

[[msg]]
id = "TCP9880"
sev = 20
text = "The local domain name is not valid."
help = "A domain name is labels of letters, digits and hyphens separated by periods."

# The certificate commands' messages (QS* commands, Quartz extensions;
# lic/slic/src/cpp/certcmd.rs). The TCP1Cxx family is ours.
[[msg]]
id = "TCP1C00"
sev = 0
text = "Certificate store &1 created."
help = "The store is ready for certificates. With STASH(*YES) its password is kept, sealed by this system's key, so servers and later commands open it without one."
vars = ["*CHAR 256"]

[[msg]]
id = "TCP1C01"
sev = 0
text = "Certificate store &1 deleted."
help = "The store and its kept password are gone. Applications that used certificates of *SYSTEM use the system's own certificate until others are assigned."
vars = ["*CHAR 256"]

[[msg]]
id = "TCP1C02"
sev = 0
text = "Certificate &1 created in store &2."
help = "A new key and its certificate are in the store under this label. QSASNCRT gives it to an application."
vars = ["*CHAR 64", "*CHAR 256"]

[[msg]]
id = "TCP1C03"
sev = 0
text = "Certificate request &1 created in store &2."
help = "The key stays in the store; the request went to the stream file named by CSR. Import the certificate the authority sends back with QSIMPCRT and the same label."
vars = ["*CHAR 64", "*CHAR 256"]

[[msg]]
id = "TCP1C04"
sev = 0
text = "Certificate &1 imported into store &2."
help = "The certificate (with its key, when the file held one) is in the store under this label."
vars = ["*CHAR 64", "*CHAR 256"]

[[msg]]
id = "TCP1C05"
sev = 0
text = "Certificate &1 exported to &2."
help = "The stream file is readable by its owner only. A file with a private key should be moved with care and removed when no longer needed."
vars = ["*CHAR 64", "*CHAR 256"]

[[msg]]
id = "TCP1C06"
sev = 0
text = "Certificate &1 removed from store &2."
help = "Applications that were assigned it have no certificate assigned now."
vars = ["*CHAR 64", "*CHAR 256"]

[[msg]]
id = "TCP1C07"
sev = 0
text = "Certificate &1 changed."
help = "The changes are in effect for servers started from now on."
vars = ["*CHAR 64"]

[[msg]]
id = "TCP1C08"
sev = 0
text = "Certificate &1 assigned to application &2."
help = "Servers of the application present this certificate from their next start."
vars = ["*CHAR 64", "*CHAR 100"]

[[msg]]
id = "TCP1C09"
sev = 0
text = "Application &1 has no certificate assigned now."
help = "A server of the application uses the store's default certificate, or the system's own when the store has none."
vars = ["*CHAR 100"]

[[msg]]
id = "TCP1C0A"
sev = 0
text = "Application &1 added."
help = "Programs name it to use the certificate assigned to it."
vars = ["*CHAR 100"]

[[msg]]
id = "TCP1C0B"
sev = 0
text = "Application &1 removed."
vars = ["*CHAR 100"]

[[msg]]
id = "TCP1C0C"
sev = 0
text = "Application &1 changed."
help = "The changes are in effect for servers started from now on."
vars = ["*CHAR 100"]

[[msg]]
id = "TCP1C0D"
sev = 0
text = "Certificate expiry checked: &1 warnings sent, &2 stores not checked."
help = "Warnings went to QSYSOPR for certificates within 30, 7 or 1 days of expiry, or expired. A store is not checked when its kept password cannot be used."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "TCP1C10"
sev = 40
text = "Certificate store &1 not found."
help = "No store file exists at this path. QSCRTCRTS creates one."
vars = ["*CHAR 256"]

[[msg]]
id = "TCP1C11"
sev = 40
text = "Certificate store &1 already exists."
help = "Use the existing store, or delete it with QSDLTCRTS first."
vars = ["*CHAR 256"]

[[msg]]
id = "TCP1C12"
sev = 40
text = "Password for certificate store &1 is not correct."
help = "The password given does not open the store."
vars = ["*CHAR 256"]

[[msg]]
id = "TCP1C13"
sev = 40
text = "No certificate has label &1."
help = "Labels are compared exactly, including case. QSWRKCRT lists them."
vars = ["*CHAR 64"]

[[msg]]
id = "TCP1C14"
sev = 40
text = "Label &1 is already used in the store."
help = "Choose another label, or remove or rename the certificate that has it."
vars = ["*CHAR 64"]

[[msg]]
id = "TCP1C15"
sev = 40
text = "Application &1 is not registered."
help = "Application IDs are compared exactly, including case. QSWRKAPPID lists them; QSADDAPPID adds one."
vars = ["*CHAR 100"]

[[msg]]
id = "TCP1C16"
sev = 40
text = "Application &1 is already registered."
vars = ["*CHAR 100"]

[[msg]]
id = "TCP1C17"
sev = 40
text = "Certificate request not done: &1"
help = "The reason is shown after the colon."
vars = ["*CHAR 256"]

[[msg]]
id = "TCP1C18"
sev = 40
text = "The kept password of certificate store &1 cannot be used."
help = "The store has no kept password, or it was sealed with a key this system no longer has. Give the store's password, or create the store again."
vars = ["*CHAR 256"]

[[msg]]
id = "TCP1C19"
sev = 40
text = "User &1 is not authorized to manage certificates."
help = "Managing certificates needs *ALLOBJ and *SECADM special authority."
vars = ["*CHAR 10"]

[[msg]]
id = "TCP1C20"
sev = 30
text = "Certificate &1 in store &2 expires in &3 days."
help = "Renew it before then: create or import a new certificate and assign it to the applications that use this one. This warning is sent once at 30, 7 and 1 days."
vars = ["*CHAR 64", "*CHAR 256", "*CHAR 10"]

[[msg]]
id = "TCP1C21"
sev = 40
text = "Certificate &1 in store &2 has expired."
help = "Servers assigned it use the system's own certificate until a valid one is assigned."
vars = ["*CHAR 64", "*CHAR 256"]
