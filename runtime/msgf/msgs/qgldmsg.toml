# QGLDMSG: the directory server's messages (docs/DIRSRV.md section 2).
# Identifiers, severities and substitution layouts are the primary's QSYS/QGLDMSG
# (tools/conformance/oracle/dirsrv/messages.txt); every text is ours. The
# identifiers QS/400 issues have their own text; the others keep IBM's number
# and layout so programs that monitor for them compile, with a plain text
# (docs/DIRSRV.md section 2.1 lists the ones QS/400 issues). A *QTDCHAR or
# *HEX with *VARY is *CHAR *VARY here: the same data, no other form in the
# frozen *MSGF payload.
name = "QGLDMSG"
text = "Directory server messages"

[[msg]]
id = "GLD0101"
sev = 40
text = "Directory server error."
help = "QS/400 does not send this message; it keeps IBM's identifier and data. Its data: &1, &2, &3, &4, &5, &6, &7, &8."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 6", "*CHAR *VARY 4", "*CHAR *VARY 4", "*CHAR *VARY 4", "*CHAR *VARY 4", "*CHAR *VARY 4"]

