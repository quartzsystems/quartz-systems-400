# QZHBMSG: HTTP Server Administration's messages, installed in library
# QHTTPSVR. Made from net/httpadmin/src/msgs.rs by its test
# (QS400_UPDATE_MSGF=1 cargo test -p httpadmin --test msgf); do not edit.
# Every text is ours.
name = "QZHBMSG"
text = "HTTP Server Administration messages"

[[msg]]
id = "HTP8000"
sev = 0
text = "HTTP server instance &1 starting."
help = "&N Cause . . . . . :   A request to start instance &1 was accepted. The instance's job is being started in subsystem QHTTPSVR. &N Recovery  . . . :   None. Message HTP8001 follows when the instance is listening."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "HTP8001"
sev = 0
text = "HTTP server instance &1 started, listening on &2."
help = "&N Cause . . . . . :   Instance &1 read its configuration and is accepting connections on &2. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8002"
sev = 0
text = "HTTP server instance &1 ended."
help = "&N Cause . . . . . :   Instance &1 was ended by &2. Its job in subsystem QHTTPSVR is no longer active. &N Recovery  . . . :   Start the instance again from the Server instances page or with STRTCPSVR SERVER(*HTTP) HTTPSVR(&1)."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8010"
sev = 0
text = "Certificate &1 loaded for application &2."
help = "&N Cause . . . . . :   The server presents certificate &1 from the *SYSTEM store on its TLS ports. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8020"
sev = 0
text = "HTTP server instance &1 created."
help = "&N Cause . . . . . :   The server root &2, its configuration file and the registry entry of instance &1 were created. The instance is stopped. &N Recovery  . . . :   Start the instance from the Server instances page."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8021"
sev = 0
text = "HTTP server instance &1 deleted."
help = "&N Cause . . . . . :   The server root &2 and the registry entry of instance &1 were removed. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8100"
sev = 30
text = "Configuration error at line &1 column &2: &3"
help = "&N Cause . . . . . :   The configuration file &4 could not be used. The directive at line &1, column &2 is not valid: &3 &N Recovery  . . . :   Correct the line on the Configuration file page of the instance and validate the file again. The file in use was not changed."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8103"
sev = 30
text = "HTTP server instance &1 must be stopped first."
help = "&N Cause . . . . . :   Instance &1 is running. The request needs the instance to be stopped. &N Recovery  . . . :   Stop the instance from the Server instances page, then try the request again."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "HTP8104"
sev = 30
text = "HTTP server instance &1 cannot be stopped from its own administration session."
help = "&N Cause . . . . . :   Instance &1 serves this administration session. Stopping it would end the session in which the request was made. &N Recovery  . . . :   Stop the instance from a 5250 session with ENDTCPSVR SERVER(*HTTP) HTTPSVR(&1), or restart it instead."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "HTP8110"
sev = 30
text = "Request not authorized for user &1."
help = "&N Cause . . . . . :   User &1 does not have the authority the request needs (&2). The attempt was recorded in the audit journal. &N Recovery  . . . :   Ask the security officer for the authority, or sign on as a user who has it."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8111"
sev = 30
text = "User &1 is not an administrator of the HTTP server."
help = "&N Cause . . . . . :   Signing on to HTTP Server Administration needs the *IOSYSCFG special authority or membership in group profile &2. &N Recovery  . . . :   Ask the security officer for the authority, or sign on as a user who has it."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8201"
sev = 30
text = "Server user profile &1 not found or not authorized."
help = "&N Cause . . . . . :   The user profile &1 given for the instance's server jobs does not exist on this system, or it cannot be used by the server. &N Recovery  . . . :   Create the user profile with CRTUSRPRF, or change the instance to use an existing profile such as QTMHHTTP, then try again."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "HTP8202"
sev = 30
text = "Port &1 needs *IOSYSCFG for server user profile &2."
help = "&N Cause . . . . . :   Ports below 1024 can only be used by an instance whose server user profile has the *IOSYSCFG special authority. Profile &2 does not. &N Recovery  . . . :   Choose a port of 1024 or above, or give the server user profile the authority."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8301"
sev = 0
text = "Certificate &1 created in store &2."
help = "&N Cause . . . . . :   A key pair and certificate labeled &1 were created in certificate store &2. &N Recovery  . . . :   Assign the certificate to an application on the Applications page to use it."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8302"
sev = 0
text = "Certificate &1 imported into store &2."
help = "&N Cause . . . . . :   The certificate labeled &1 was added to certificate store &2. &N Recovery  . . . :   Assign the certificate to an application on the Applications page to use it."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "HTP8310"
sev = 0
text = "Certificate &1 assigned to application &2."
help = "&N Cause . . . . . :   Application &2 presents certificate &1 the next time its server starts. &N Recovery  . . . :   Restart the server that uses application &2 to present the new certificate now."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]
