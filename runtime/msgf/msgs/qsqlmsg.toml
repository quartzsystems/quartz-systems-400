# QSQLMSG: the SQL messages behind the SQLCODEs of the Phase 3 executor.
name = "QSQLMSG"
text = "SQL messages"

[[msg]]
id = "SQL0004"
sev = 30
text = "At column &1: member &2 named by INCLUDE was not found."
help = "The precompiler looks for the member of an INCLUDE statement in the include file (by default the source file being precompiled). Add the member or correct the name."
vars = ["*DEC 5 0", "*CHAR 10"]

[[msg]]
id = "SQL0053"
sev = 10
text = "The source holds no SQL statements."
help = "The member was given to the SQL precompiler but embeds no SQL; the compile goes on without it."

[[msg]]
id = "SQL0084"
sev = 30
text = "The statement is not supported: &1."
help = "The statement or clause is outside the subset this release implements."
vars = ["*CHAR 256"]

[[msg]]
id = "SQL0088"
sev = 0
text = "&1 changes every row of the table."
help = "The statement has no WHERE clause, so it applies to the whole table. This is a warning; the statement is precompiled."
vars = ["*CHAR 10"]

[[msg]]
id = "SQL0101"
sev = 30
text = "The statement is too long or too complex."
help = "Expressions or subqueries are nested more deeply than the database runs. Write the statement with fewer nested levels, for example with a common table expression."

[[msg]]
id = "SQL0104"
sev = 30
text = "Syntax error at line &1 column &2: &3."
help = "The statement could not be parsed at the position shown."
vars = ["*DEC 5 0", "*DEC 5 0", "*CHAR 256"]

[[msg]]
id = "SQL0107"
sev = 30
text = "The name &1 is too long; at most &2 characters are allowed."
help = "Shorten the name. An SQL column name may have up to 128 characters, a system name up to 10."
vars = ["*CHAR 256", "*DEC 5 0"]

[[msg]]
id = "SQL0117"
sev = 30
text = "The number of values does not match the number of columns."
help = "An INSERT lists a different number of values than columns."

[[msg]]
id = "SQL0115"
sev = 30
text = "Comparison operator &1 is not valid here."
help = "Rows of values can be compared only for equal and not equal. Compare the values one by one, or with a quantified comparison against a fullselect."
vars = ["*CHAR 3"]

[[msg]]
id = "SQL0120"
sev = 30
text = "An aggregate function or OLAP specification is not valid here."
help = "Aggregate functions belong in the select list or HAVING of a grouped query, OLAP specifications in the select list or ORDER BY. Move the function, or compute it in a nested table expression."

[[msg]]
id = "SQL0125"
sev = 30
text = "ORDER BY column number &1 is not in the select list."
help = "A number in ORDER BY names a column of the result by its place, from 1 to the number of columns selected. Correct the number."
vars = ["*CHAR 10"]

[[msg]]
id = "SQL0137"
sev = 30
text = "The result of &1 is too long."
help = "The result is longer than its type allows. Shorten the operands, or for LISTAGG give ON OVERFLOW TRUNCATE."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0182"
sev = 30
text = "A date, time or timestamp expression is not valid."
help = "A date, time or timestamp can be added to or subtracted from only a duration: a labeled duration such as 3 DAYS, or for subtraction a value of the same type. Correct the expression."

[[msg]]
id = "SQL0342"
sev = 30
text = "The recursive common table expression &1 holds a clause it may not."
help = "A recursive common table expression joins its initial rows and its step with UNION ALL, and has no ORDER BY or row limit of its own. Correct the expression."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0343"
sev = 30
text = "The recursive common table expression &1 needs a column list."
help = "Name the columns of a recursive common table expression after its name: WITH name (col, ...) AS (...)."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0346"
sev = 30
text = "The common table expression &1 names itself without initial rows."
help = "A common table expression that refers to itself is recursive and needs a fullselect that does not, joined to the recursive one with UNION ALL."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0187"
sev = 30
text = "The use of a labeled duration is not valid."
help = "YEARS, MONTHS and DAYS go with a date or timestamp; HOURS, MINUTES and SECONDS with a time or timestamp; MICROSECONDS with a timestamp. A labeled duration stands only beside + or -."

[[msg]]
id = "SQL0199"
sev = 30
text = "Keyword &1 is not expected here."
help = "The statement has a keyword where the syntax does not allow one: SET OPTION after another SQL statement of the source, INTO after a list of VALUES rows, DEALLOCATE given to a dynamic interface."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0203"
sev = 30
text = "Column &1 is ambiguous."
help = "More than one table in the statement has a column of that name; qualify it."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0204"
sev = 30
text = "&1 in &2 not found."
help = "No table, view or index of that name exists in the schema named or the current schema."
vars = ["*CHAR 30", "*CHAR 10"]

[[msg]]
id = "SQL0206"
sev = 30
text = "Column &1 not found."
help = "No table in the statement has a column of that name."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0302"
sev = 30
text = "A value is not valid for its target: &1."
help = "A literal or host value could not be converted to the column's type."
vars = ["*CHAR 256"]

[[msg]]
id = "SQL0312"
sev = 30
text = "Host variable &1 is not defined or cannot be used here."
help = "The name after the colon must be a field, subfield, structure or parameter the program declares before the statement, of a type SQL can use."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0401"
sev = 30
text = "The operands of &1 are not compatible."
help = "The operator or comparison was given values of types that do not combine."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0407"
sev = 30
text = "Column &1 does not allow nulls."
help = "A null value was assigned to a column defined without ALWNULL."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0501"
sev = 30
text = "Cursor &1 is not open."
help = "FETCH, UPDATE or DELETE WHERE CURRENT OF needs an open cursor."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0504"
sev = 30
text = "Cursor &1 is not declared before it is used."
help = "OPEN, FETCH and CLOSE name a cursor that a DECLARE CURSOR statement earlier in the source must define."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0603"
sev = 30
text = "Unique index &1 not created: rows of the table repeat its key."
help = "Two or more rows have the same values in the index's key columns. Change or delete the repeated rows, then create the index or constraint again."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0798"
sev = 30
text = "Column &1 is GENERATED ALWAYS; a value for it cannot be given."
help = "The system makes the value of a GENERATED ALWAYS column. Leave the column out of the INSERT or UPDATE, give DEFAULT, or use OVERRIDING SYSTEM VALUE where it is allowed."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0802"
sev = 30
text = "Arithmetic overflow or division by zero."
help = "The result of an arithmetic expression does not fit its type, or a divisor was zero."

[[msg]]
id = "SQL0803"
sev = 30
text = "Duplicate key value in &1."
help = "The row would repeat a key of a unique index or the primary key."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0811"
sev = 30
text = "A scalar subselect returned more than one row."
help = "The subquery in a scalar position must return at most one row."

[[msg]]
id = "SQL0901"
sev = 50
text = "SQL system error: &1."
help = "The database layer reported an error the SQL executor did not expect."
vars = ["*CHAR 256"]

[[msg]]
id = "SQL0913"
sev = 30
text = "The row in &1 is locked by another job."
help = "A row needed for update is held by another job's commit cycle."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL1103"
sev = 10
text = "The columns of table &1 in &2 could not be found."
help = "The precompiler could not find the table, so it could not check the statement's columns. The program is still created; the statement is checked when it runs."
vars = ["*CHAR 30", "*CHAR 10"]

[[msg]]
id = "SQL5066"
sev = 0
text = "Precompile option &1 is set by SET OPTION."
help = "A SET OPTION statement in the source gives the option a value that replaces the command's."
vars = ["*CHAR 10"]

[[msg]]
id = "SQL7008"
sev = 30
text = "&1 is not journaled."
help = "A change under commitment control needs a journaled file."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL9001"
sev = 30
text = "The SQL precompile of &1 failed; the object was not created."
help = "The precompile listing shows the statements in error. Correct them and run CRTSQLRPGI again."
vars = ["*CHAR 10"]

[[msg]]
id = "SQL9006"
sev = 30
text = "RUNSQLSTM ended: errors above the severity allowed were found."
help = "The listing gives each statement's messages. Correct the statements or raise ERRLVL."

[[msg]]
id = "SQL9010"
sev = 30
text = "The SQL statement RUNSQL ran did not complete."
help = "The messages before this one say why the statement failed."

[[msg]]
id = "SQL0100"
sev = 0
text = "No row was found for &1."
help = "The statement found no row to work on; nothing was changed."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "SQL7955"
sev = 0
text = "&3 rows were deleted from &1 in &2."
help = "The DELETE statement ran."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR *VARY 2"]

[[msg]]
id = "SQL7956"
sev = 0
text = "&3 rows were inserted into &1 in &2."
help = "The INSERT statement ran."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR *VARY 2"]

[[msg]]
id = "SQL7957"
sev = 0
text = "&3 rows were updated in &1 in &2."
help = "The UPDATE statement ran."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR *VARY 2"]

[[msg]]
id = "SQL7958"
sev = 0
text = "&1 rows fetched in &2 seconds."
help = "The query ran and its rows were read."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "SQL7960"
sev = 0
text = "The commit is done."
help = "The changes of the unit of work are kept."
vars = []

[[msg]]
id = "SQL7961"
sev = 0
text = "The rollback is done."
help = "The changes of the unit of work are undone."
vars = []

[[msg]]
id = "SQL7971"
sev = 0
text = "The session is connected to relational database &1."
help = "Statements run against this database."
vars = ["*CHAR 10"]

[[msg]]
id = "SQL7977"
sev = 0
text = "The &1 statement ran."
help = "The statement completed."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "SQL6072"
sev = 0
text = "The SELECT statement ran."
help = "The rows it returned were shown or written as the session attributes ask."
vars = []

[[msg]]
id = "SQL0518"
sev = 30
text = "Prepared statement &1 is not there."
help = "The statement was never prepared on this connection, or it was released. Prepare it again."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL0551"
sev = 30
text = "Not authorized to &1."
help = "The profile running the statement lacks the authority it needs to the object named. Ask the object's owner or the security officer for that authority."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0904"
sev = 30
text = "The statement needed more working storage than one statement may hold."
help = "The rows the statement had to keep at once, for a join, a grouping, DISTINCT or a union, passed the limit set for one statement, and the statement was ended. Add predicates that join the tables or narrow the rows, or fetch fewer columns."

[[msg]]
id = "SQL0952"
sev = 30
text = "The statement was ended by a cancel request."
help = "The client asked to stop the statement while it ran. Rows it changed before the cancel stay changed; under commitment control they are not committed until COMMIT or ROLLBACK."

[[msg]]
id = "SQL0313"
sev = 30
text = "The number of parameter values does not match the statement's parameter markers."
help = "Give one value for each parameter marker of the prepared statement, in order."

[[msg]]
id = "SQL0428"
sev = 30
text = "The statement can run only before the unit of work changes anything."
help = "Changes made under commitment control have not been committed or rolled back. Commit or roll back, then run the statement again."

[[msg]]
id = "SQL0752"
sev = 30
text = "The connection's SQL options cannot change while a transaction is open."
help = "Changes made under commitment control have not been committed or rolled back. Commit or roll back, then set the options again."

[[msg]]
id = "SQL0150"
sev = 30
text = "Rows of &1 cannot be changed through it."
help = "The view or table function names a result that is read-only. Change the rows through the table it is based on."
vars = ["*CHAR 256"]

[[msg]]
id = "SQL0301"
sev = 30
text = "A value for &1 is not of a type it can take."
help = "The value given for the column or parameter is of a type that cannot be assigned to it. Send a value of a compatible type."
vars = ["*CHAR 256"]

[[msg]]
id = "SQL0404"
sev = 30
text = "A value for &1 is longer than the column allows."
help = "The string is longer than the column's length. Shorten the value or widen the column."
vars = ["*CHAR 256"]

[[msg]]
id = "SQL0406"
sev = 30
text = "A value for &1 is outside the column's range."
help = "The number does not fit the column's precision, scale or type. Send a value the column can hold."
vars = ["*CHAR 256"]

[[msg]]
id = "SQL0420"
sev = 30
text = "A value for &1 is not a valid number."
help = "Character data given for a numeric column could not be read as a number. Correct the value."
vars = ["*CHAR 256"]

[[msg]]
id = "SQL5016"
sev = 30
text = "&1 is not valid for the naming in use."
help = "The qualified name uses the separator of the other naming convention. Qualify it with . under SQL naming or / under system naming."
vars = ["*CHAR 256"]

# Objects and names (SQL completion, DDL).

[[msg]]
id = "SQL0079"
sev = 30
text = "Schema &1 cannot hold &2."
help = "A declared global temporary table lives in QTEMP; qualify it with SESSION or QTEMP, or leave it unqualified."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0151"
sev = 30
text = "&1 cannot be changed."
help = "The variable is a constant: its value is its definition's and cannot be set."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0153"
sev = 30
text = "A column list is needed."
help = "A column of the query has no name of its own (an expression without AS). Name it with AS or give the column names in the statement."

[[msg]]
id = "SQL0161"
sev = 30
text = "The row does not satisfy the definition of view &1 in &2."
help = "The view was made WITH CHECK OPTION and the inserted or updated row would not be seen through it. Change the values so that the row meets the view's condition."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0557"
sev = 30
text = "The privilege is not valid for &1 in &2."
help = "A view cannot be given the INDEX privilege, and a column privilege names a privilege columns do not have. Grant a privilege the object has."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0569"
sev = 10
text = "Not every privilege named was revoked from &1 in &2."
help = "The user did not hold some of the privileges named, so there was nothing to take away for them. The others were revoked."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0601"
sev = 30
text = "&1 in &2 type &3 already exists."
help = "An object of that name and type is in the schema. Choose another name, drop the object first, or use OR REPLACE where the statement allows it."
vars = ["*CHAR 128", "*CHAR 128", "*CHAR 7"]

# Table integrity: constraints, identity columns and sequences.

[[msg]]
id = "SQL0195"
sev = 30
text = "Column &1 is the last column of table &2 and cannot be dropped."
help = "A table keeps one column at least. Drop the table instead."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0205"
sev = 30
text = "Column &1 is not in table &2."
help = "A constraint or change names a column the table does not have. Correct the name."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0359"
sev = 30
text = "Identity column or sequence &1 has no more values."
help = "Every value between the minimum and maximum has been given and the column or sequence does not cycle. Restart it, widen its range, or let it cycle."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0372"
sev = 30
text = "Table &1 cannot have that generated column."
help = "A table has one identity column and one row change timestamp column at most, and only an identity column can be changed as one."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0478"
sev = 30
text = "Object &1 cannot be dropped or changed: &2 depends on it."
help = "With RESTRICT nothing that depends on the object may remain. Drop the dependent object first, or use CASCADE."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0530"
sev = 30
text = "Referential constraint &1 in &2 refuses the value: its parent key has no match."
help = "Each foreign key value that is not null must match a parent key value. Insert the parent row first, change the value, or drop the constraint."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0531"
sev = 30
text = "Referential constraint &1 in &2 prevents the change of a parent key."
help = "Rows of the dependent table still match the parent key, and the update rule is RESTRICT or NO ACTION. Change or delete those rows first."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0532"
sev = 30
text = "Referential constraint &1 in &2 prevents the delete of a parent row."
help = "Rows of the dependent table still match the row's parent key, and the delete rule is RESTRICT or NO ACTION. Delete those rows first."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0537"
sev = 30
text = "Column &1 cannot be a key of the constraint."
help = "A key names each column once and names no LOB column."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0538"
sev = 30
text = "The foreign key of constraint &1 in &2 does not match the parent key."
help = "The parent table needs a primary key or unique constraint over the referenced columns, as many as the foreign key has and of the same types and lengths."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0541"
sev = 30
text = "Table &2 in &3 already has a unique key over the columns of constraint &1."
help = "A primary key or unique constraint over the same columns exists. Use it, or drop it first."
vars = ["*CHAR 128", "*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0542"
sev = 30
text = "Column &1 allows nulls and cannot be part of a primary key."
help = "Make the column NOT NULL first, or use a unique constraint."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0544"
sev = 30
text = "CHECK constraint &1 cannot be added: rows of the table do not meet it."
help = "Change the rows that break the condition, or the condition, then add the constraint again."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0545"
sev = 30
text = "CHECK constraint &1 refuses the row."
help = "The row inserted or changed does not meet the condition of the constraint. Change the values, or drop the constraint."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0546"
sev = 30
text = "The CHECK condition of constraint &1 is not valid."
help = "A check condition names columns of its own table and constants only: no special registers, variables, sequences or subqueries."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0574"
sev = 30
text = "The definition of column &1 is not valid for what it generates or defaults."
help = "An identity column is an integer or DECIMAL with no scale; a row change timestamp is a TIMESTAMP; a generated column has no default."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0612"
sev = 30
text = "Column &1 is already in the table."
help = "A table names each column once. Choose another name."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0616"
sev = 30
text = "&1 in &2 cannot be dropped with RESTRICT."
help = "Views, indexes, referential constraints or other objects depend on it. Drop them first, or drop it without RESTRICT so that they go with it."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL7027"
sev = 30
text = "The privileges named cannot be granted on &1 in &2."
help = "A read-only view takes SELECT, ALTER and REFERENCES only. Grant a privilege the view can have."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL7029"
sev = 30
text = "System name &1 cannot be given."
help = "FOR SYSTEM NAME is for an SQL name that is not itself a valid system name, and the system name must be a valid one. Leave the clause out or correct the name."
vars = ["*CHAR 10"]

[[msg]]
id = "SQL7905"
sev = 10
text = "Table &1 in &2 was made but is not journaled."
help = "The library is not an SQL schema, so it has no QSQJRN journal to start journaling to. The table works; changes to it under commitment control need journaling started with STRJRNPF."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0171"
sev = 30
text = "Argument &1 of function &2 is not valid."
help = "The argument's data type, length or value is not one the function accepts. Change the argument."
vars = ["*BIN 4", "*CHAR 128"]

[[msg]]
id = "SQL0180"
sev = 30
text = "The text of a date, time or timestamp value is not in a form that can be read."
help = "A character string used as a date, time or timestamp is not written in one of the forms the system reads. Correct the string."

[[msg]]
id = "SQL0181"
sev = 30
text = "A date, time or timestamp string has a part out of range."
help = "The string has the right form but a month, day, hour, minute or second that does not exist. Correct the value."

[[msg]]
id = "SQL0189"
sev = 30
text = "CCSID &1 cannot be used here."
help = "The CCSID is unknown or is not one the data type may have: character types take single-byte or mixed EBCDIC CCSIDs, 1208 or 65535; graphic types take 1200, 13488 or a double-byte CCSID."
vars = ["*BIN 4"]

[[msg]]
id = "SQL0332"
sev = 30
text = "Data in CCSID &1 cannot be converted to CCSID &2."
help = "No conversion exists between the two CCSIDs, for example from binary data (65535) to a graphic string. Cast the data to a type with a convertible CCSID."
vars = ["*BIN 4", "*BIN 4"]

[[msg]]
id = "SQL0408"
sev = 30
text = "The value given for &1 is not compatible with its data type."
help = "A value of one type family (for example a date) was assigned to a column or variable of another (for example an integer). Convert the value first."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0433"
sev = 30
text = "A value is too long for the result of a CAST."
help = "Cutting the value to the length of the result would lose significant characters, for example digits of a number. Give the result a longer length."

[[msg]]
id = "SQL0461"
sev = 30
text = "A value of type &1 cannot be cast to type &2."
help = "The cast between these two data types is not allowed. Cast through an intermediate type, or use a function that converts between them."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0462"
sev = 10
text = "Routine &1 in &2 ended with a warning."
help = "The procedure or function finished, but reported a condition worth checking, such as finding nothing to work on. The SQLSTATE says which."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQ20365"
sev = 30
text = "A signaling NaN was met, or a DECFLOAT operation failed."
help = "An expression used the DECFLOAT special value sNaN, or a DECFLOAT operation could not give a result. Remove the sNaN value or change the expression."

[[msg]]
id = "SQL0170"
sev = 30
text = "Function &1 is called with the wrong number of arguments."
help = "The function takes a different number of arguments. Correct the call."
vars = ["*CHAR 128"]

[[msg]]
id = "SQ16400"
sev = 30
text = "A JSON object repeats the key &1."
help = "The constructor or aggregate was asked for unique keys (WITH UNIQUE KEYS) but two members have the same key. Remove the duplicate or drop the clause."
vars = ["*CHAR 128"]

[[msg]]
id = "SQ16401"
sev = 30
text = "An SQL/JSON path or key is not valid."
help = "The path is not written in the SQL/JSON path language, or a JSON object key is null. Correct the path or the key."

[[msg]]
id = "SQ16402"
sev = 30
text = "The data is not valid JSON."
help = "A value used as JSON text (or BSON) could not be read as a JSON document. Correct the data or the FORMAT clause."

[[msg]]
id = "SQ16410"
sev = 30
text = "The SQL/JSON path finds no member or element there."
help = "In strict mode the path names a member, index or kind the item does not have, or the path found no item where ERROR ON EMPTY was given. Correct the path or use lax mode."

[[msg]]
id = "SQ16413"
sev = 30
text = "The SQL/JSON path does not give a single scalar item."
help = "JSON_VALUE needs one scalar item and JSON_QUERY without a wrapper one item; the path gave more, or an array or object. Change the path or add WITH WRAPPER."

[[msg]]
id = "SQL0350"
sev = 30
text = "Column &1 cannot be a key: its type is a LOB, DATALINK or XML."
help = "An index, key or constraint was defined over a large object column. Choose another column."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0402"
sev = 30
text = "An operand of an arithmetic operator is not a number."
help = "Arithmetic needs numeric operands (or dates, times and timestamps with durations); a BOOLEAN, binary or other value cannot be used. Cast the operand first."

[[msg]]
id = "SQ20398"
sev = 30
text = "The text is not a well-formed XML document: &1."
help = "XMLPARSE found markup that does not form a document: an element not closed, text outside the document element, or a reference it does not know. Correct the text."
vars = ["*CHAR 256"]

[[msg]]
id = "SQL0423"
sev = 30
text = "Locator &1 is not valid."
help = "The LOB locator was never assigned, was freed, or ended with its unit of work. Use a locator the unit of work still holds."
vars = ["*BIN 4"]

[[msg]]
id = "SQL0604"
sev = 30
text = "The length, precision, scale or data option of &1 is not valid."
help = "A data type was given a length, precision or option it cannot have, for example FOR MIXED DATA where the CCSID has no mixed form. Correct the type."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0683"
sev = 30
text = "A clause is not valid for the data type of &1."
help = "FOR BIT DATA, CCSID or another option was given to a type that does not take it, for example FOR BIT DATA on a CLOB. A row change timestamp column is a TIMESTAMP. Remove the clause or change the type."
vars = ["*CHAR 128"]

[[msg]]
id = "SQ20477"
sev = 30
text = "The string &1 does not match the format &2."
help = "DECFLOAT_FORMAT read a character the format model has no element for, such as a sign without S, MI or PR. Correct the string or the format."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0624"
sev = 30
text = "Table &1 in &2 already has a primary key."
help = "A table has one primary key. Drop it first, or make the new key a unique constraint."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0629"
sev = 30
text = "SET NULL is not valid for referential constraint &1: no column of its foreign key allows nulls."
help = "Make a foreign key column null-capable, or choose another delete rule."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0667"
sev = 30
text = "Referential constraint &1 cannot be added: foreign keys of the table have no parent key."
help = "Rows of the table hold foreign key values the parent table does not have. Change or delete them, or add the parent rows, then add the constraint again."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0845"
sev = 30
text = "PREVIOUS VALUE for sequence &1 is not yet set in this job."
help = "The job has not used NEXT VALUE for the sequence. Use NEXT VALUE first."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0971"
sev = 30
text = "Constraint &1 of table &2 is in check pending."
help = "Rows of the table break the constraint, which was enabled again. Correct the rows (EDTCPCST, DSPCPCST show them) or disable the constraint."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0190"
sev = 30
text = "Column &1 in &2 in &3 cannot be changed that way."
help = "The change asked of the column does not fit what the column is: only an identity column can be restarted or lose its identity, only a generated column can stop being generated."
vars = ["*CHAR 128", "*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0846"
sev = 30
text = "The attributes of identity column or sequence &1 are not valid."
help = "An identity column or sequence is an integer, or DECIMAL or NUMERIC with no scale; MINVALUE is not above MAXVALUE, and START WITH and RESTART WITH lie between them, all within the data type."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0113"
sev = 30
text = "Name &1 is not a valid name here."
help = "The name, such as the program of an EXTERNAL NAME clause, breaks the rules for the object it names."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0435"
sev = 30
text = "SQLSTATE &1 is not one a SIGNAL may raise."
help = "A SIGNAL or RESIGNAL names five digits or upper case letters, and not a class 00 state."
vars = ["*CHAR 5"]

[[msg]]
id = "SQL0438"
sev = 30
text = "&1"
help = "A SIGNAL or RESIGNAL statement raised the condition; the text is the one it set."
vars = ["*CHAR 70"]

[[msg]]
id = "SQL0440"
sev = 30
text = "No routine &1 in &2 takes the arguments given."
help = "A routine of that name exists, but none with as many parameters as the call passes, or of the types it passes."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0443"
sev = 30
text = "Routine &1 in &2 failed with SQLSTATE &3."
help = "The external program the routine names ended with an error it did not handle, or reported one through its SQLSTATE parameter."
vars = ["*CHAR 128", "*CHAR 128", "*CHAR 5"]

[[msg]]
id = "SQL0454"
sev = 30
text = "Routine &1 in &2 already exists."
help = "A procedure of that name and number of parameters, or a function of that name and parameter types, is already in the schema. Use CREATE OR REPLACE or another name."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0464"
sev = 10
text = "Procedure &1 returned more result sets than it may return."
help = "The procedure left more cursors open for its caller than its DYNAMIC RESULT SETS clause allows; the later ones were closed."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0466"
sev = 0
text = "&1 result sets are available from procedure &2."
help = "The procedure left cursors open for its caller; each is a result set the caller can read."
vars = ["*BIN 4", "*CHAR 128"]

[[msg]]
id = "SQL0469"
sev = 30
text = "Argument &1 of routine &2 does not fit its parameter."
help = "An OUT or INOUT parameter needs a variable or a parameter marker to give its value back to."
vars = ["*BIN 4", "*CHAR 128"]

[[msg]]
id = "SQL0476"
sev = 30
text = "Routine &1 in &2 is not unique."
help = "More than one routine has that name. Give its parameter types or its specific name."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0578"
sev = 30
text = "SQL function &1 in &2 ended without a RETURN."
help = "The end of the function's body was reached before a RETURN statement ran."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0590"
sev = 30
text = "Name &1 is not unique in the routine."
help = "Two parameters, or a parameter and a variable of the routine's own compound statement, have the same name."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0773"
sev = 30
text = "No WHEN of the CASE statement held."
help = "A CASE statement without ELSE found no WHEN clause that matched."
vars = []

[[msg]]
id = "SQL0778"
sev = 30
text = "Label &1 is not one that statement can name."
help = "ITERATE names the label of a loop around it."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0779"
sev = 30
text = "Label &1 is not found."
help = "LEAVE, ITERATE and GOTO name a label of a statement that encloses them, or of one in the same compound statement."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0780"
sev = 30
text = "An UNDO handler needs an ATOMIC compound statement."
help = "Declare the handler in a BEGIN ATOMIC compound statement, or make it CONTINUE or EXIT."
vars = []

[[msg]]
id = "SQL0225"
sev = 30
text = "FETCH of cursor &1 is not valid: the cursor is not scrollable."
help = "A cursor declared without SCROLL moves forward only: FETCH takes no orientation but NEXT. Declare the cursor SCROLL to fetch PRIOR, FIRST, LAST, BEFORE, AFTER, CURRENT or RELATIVE."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0231"
sev = 30
text = "The position of cursor &1 does not allow FETCH CURRENT."
help = "The cursor is before the first row or after the last, so there is no current row to fetch again. Position it on a row first."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0237"
sev = 10
text = "The SQLDA has too few entries for the extended entries the result needs."
help = "A large object or distinct type needs a second entry for each column. The base entries were filled; make SQLN twice SQLD and describe again to get the lengths."

[[msg]]
id = "SQL0239"
sev = 10
text = "The SQLDA has too few entries: none were filled."
help = "SQLD gives the number of columns; a result with large objects needs twice that many entries. Make SQLN large enough and describe again."

[[msg]]
id = "SQL0243"
sev = 30
text = "Cursor &1 cannot be SENSITIVE."
help = "The rows of a cursor are read when it opens, so changes made later do not show in them. Declare the cursor INSENSITIVE or ASENSITIVE."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0502"
sev = 30
text = "Cursor &1 is already open."
help = "A cursor is opened once until it is closed. Close it before opening it again."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0507"
sev = 30
text = "Cursor &1 is not open."
help = "UPDATE or DELETE WHERE CURRENT OF needs the cursor open and positioned on a row."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0511"
sev = 30
text = "FOR UPDATE is not valid for this cursor."
help = "An INSENSITIVE cursor, or one whose query reads more than one table, cannot be used to change rows. Remove the FOR UPDATE clause or the INSENSITIVE keyword."

[[msg]]
id = "SQL0514"
sev = 30
text = "Prepared statement &1 is not there."
help = "OPEN and DEALLOCATE need a statement this program prepared, and not yet released, under that name."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL0516"
sev = 30
text = "DESCRIBE names statement &1, which was not prepared."
help = "Prepare the statement before describing it, under the same name."
vars = ["*CHAR 128"]

[[msg]]
id = "SQL5043"
sev = 0
text = "The SQL statement has no effect on the program."
help = "DECLARE TABLE documents the columns of a table for the reader of the source; the precompile does not use it."

[[msg]]
id = "SQL7034"
sev = 30
text = "LOB locators need commitment control."
help = "A locator lives until the end of the unit of work, so a program precompiled with COMMIT(*NONE) cannot use one. Precompile with COMMIT(*CHG) or another level."

# SQL triggers.

[[msg]]
id = "SQL0159"
sev = 30
text = "&1 in &2 is not the type of object the statement needs."
help = "The statement names a table where it needs a view, or a view where it needs a table: an INSTEAD OF trigger is on a view, BEFORE and AFTER triggers are on tables."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0628"
sev = 30
text = "Clauses that cannot go together were given."
help = "Two clauses of the definition conflict, such as FOR EACH STATEMENT with a BEFORE trigger or with MODE DB2ROW. Remove one of them."

[[msg]]
id = "SQL0696"
sev = 30
text = "Correlation name or transition table &1 cannot be used in trigger &2 in &3."
help = "An INSERT trigger has no old row and a DELETE trigger no new row; transition tables need an AFTER trigger in MODE DB2SQL. The reason code says which rule the REFERENCING clause broke."
vars = ["*CHAR 128", "*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0723"
sev = 30
text = "SQL trigger &1 in &2 ended with SQLCODE &3 SQLSTATE &4."
help = "A statement of the trigger's body failed and the trigger did not handle it, so the change that fired it fails too. The job log has the statement's own message; the trigger's message, if it set one, follows."
vars = ["*CHAR 128", "*CHAR 128", "*CHAR 11", "*CHAR 5", "*CHAR 70"]

[[msg]]
id = "SQL0751"
sev = 30
text = "Statement &1 cannot run in a trigger."
help = "COMMIT and ROLLBACK cannot run in an SQL trigger, and a BEFORE trigger cannot insert, update, delete or merge rows. Move the statement elsewhere."
vars = ["*CHAR 30"]

[[msg]]
id = "SQL7051"
sev = 10
text = "BEFORE trigger &1 in &2 runs in MODE DB2ROW."
help = "A BEFORE trigger always fires once for each row as it changes, so the trigger was made with MODE DB2ROW. Give MODE DB2ROW on BEFORE triggers to avoid this warning."
vars = ["*CHAR 128", "*CHAR 128"]

[[msg]]
id = "SQL0156"
sev = 30
text = "&1 in &2 is not a table."
help = "The statement works on tables only, and the object named is a view, an index or another kind of file. A BEFORE or AFTER trigger is on a table."
vars = ["*CHAR 128", "*CHAR 128"]
