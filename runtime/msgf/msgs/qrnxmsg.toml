# QRNXMSG: the ILE RPG runtime's messages. RNX messages are the escapes
# the runtime sends, the status code in the identifier's number; RNQ
# messages are the same conditions as inquiries for an unhandled error.
# Every text is Quartz-written; the identifiers, severities, data
# layouts and replies are the compatibility interface
# (tools/conformance/rpg/oracle/qrnxmsg.psv).
name = "QRNXMSG"
text = "ILE RPG runtime messages"

# Escapes.

[[msg]]
id = "RNX0100"
sev = 50
text = "A string operation's start or length is outside the string."
help = "The position or length given to %SUBST, %SCAN, %REPLACE or a similar operation reaches past the end of the string or is below 1."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0101"
sev = 50
text = "The square root of a negative number was asked for."
help = "The program asked for the square root of a negative value; the result is not a real number. Check the value before the operation."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0102"
sev = 50
text = "A number was divided by zero."
help = "The divisor of a DIV operation, a / in an expression or %DIV and %REM was zero."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0103"
sev = 99
text = "The result is too big for the field that receives it."
help = "The integer part of the value has more digits than the target holds."

[[msg]]
id = "RNX0104"
sev = 99
text = "A float value is too small to hold."
help = "The result is nearer to zero than the float type can represent."

[[msg]]
id = "RNX0105"
sev = 99
text = "A character value cannot be read as a number."
help = "%DEC, %INT, %UNS, %FLOAT and similar functions found characters that are not part of a number."

[[msg]]
id = "RNX0112"
sev = 50
text = "A date, time or timestamp value is not valid."
help = "A date, time or timestamp field or literal holds a value that is not valid in its format, for example 31 April. Correct the data or test it with TEST first."

[[msg]]
id = "RNX0113"
sev = 50
text = "A date operation went past the dates the format holds."
help = "The result of a date operation is outside the range of dates the format holds; two-digit year formats hold 1940 to 2039 only."

[[msg]]
id = "RNX0114"
sev = 99
text = "A date or time could not be mapped to the format asked for."
help = "The value could not be converted to the date or time format asked for. Check the format and the value."

[[msg]]
id = "RNX0115"
sev = 50
text = "A variable-length field holds a length that is not valid."
help = "The length prefix is larger than the field's declared length."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0120"
sev = 99
text = "A table or array is not in its declared sequence."
help = "A table or array declared with ASCEND or DESCEND was loaded with entries out of that order."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*CHAR 10"]

[[msg]]
id = "RNX0121"
sev = 50
text = "An array index is outside the array."
help = "The index is zero, negative or larger than the number of elements."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*CHAR 10"]

[[msg]]
id = "RNX0122"
sev = 50
text = "The OCCUR value is outside the data structure's occurrences."
help = "The value set by OCCUR or %OCCUR is less than 1 or more than the data structure's number of occurrences."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0123"
sev = 50
text = "RESET was used while the program was still initializing."
help = "RESET cannot be used before the program has finished its initialization."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0299"
sev = 50
text = "The RPG formatted dump could not be made."
help = "The formatted dump that DUMP asked for could not be produced. See the messages before this one."

[[msg]]
id = "RNX0333"
sev = 50
text = "The DSPLY operation failed."
help = "The DSPLY operation could not show its message or read the reply. In a batch job, DSPLY goes to the QSYSOPR message queue."

[[msg]]
id = "RNX0351"
sev = 50
text = "The XML document is not well formed: parser code &1 at offset &2."
help = "XML-INTO or XML-SAX found the document is not well formed. The parser code and the offset in the document show where."
vars = ["*BIN 4", "*CHAR *VARY 2", "*BIN 4"]

[[msg]]
id = "RNX0352"
sev = 50
text = "An option given to %XML is not valid."
help = "An option string given to %XML holds an option or value XML-INTO does not take."
vars = ["*CHAR *VARY 2", "*BIN 4", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "RNX0353"
sev = 50
text = "The XML document does not fit the target of XML-INTO."
help = "The document's elements do not match the subfields of the target variable; check the names and the counts, or the allowmissing and allowextra options."
vars = ["*BIN 4", "*BIN 4", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "RNX0356"
sev = 50
text = "The document does not fit the target of DATA-INTO (reason &1)."
help = "The document does not match the target variable of DATA-INTO; the reason code says how."
vars = ["*BIN 4", "*BIN 4", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 4"]

[[msg]]
id = "RNX0357"
sev = 50
text = "The DATA-INTO parser reported error &1."
help = "The parser program of DATA-INTO reported an error with the code shown."
vars = ["*BIN 4", "*CHAR *VARY 2", "*BIN 4", "*CHAR *VARY 4"]

[[msg]]
id = "RNX0358"
sev = 50
text = "The DATA-INTO parser called its procedures out of order (reason &1)."
help = "The parser program of DATA-INTO called the procedures it is given in an order the protocol does not allow."
vars = ["*BIN 4", "*CHAR *VARY 2", "*BIN 4", "*CHAR *VARY 4"]

[[msg]]
id = "RNX0361"
sev = 50
text = "A value could not be prepared for the DATA-GEN generator (reason &1)."
help = "A value of the variable given to DATA-GEN could not be passed to the generator; the reason code says why."
vars = ["*BIN 4", "*BIN 4", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR 7"]

[[msg]]
id = "RNX0362"
sev = 50
text = "The DATA-GEN generator called its procedures wrongly (reason &1)."
help = "The generator program of DATA-GEN called the procedures it is given wrongly."
vars = ["*BIN 4", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 4", "*CHAR *VARY 2"]

[[msg]]
id = "RNX0363"
sev = 50
text = "The DATA-GEN generator reported error &1."
help = "The generator program of DATA-GEN reported an error with the code shown."
vars = ["*BIN 4", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 4"]

[[msg]]
id = "RNX0355"
sev = 50
text = "The parser or generator program of DATA-INTO or DATA-GEN could not be called."
help = "The program named by %PARSER or %GEN could not be found or called."
vars = ["*CHAR 15", "*BIN 4", "*CHAR *VARY 4"]

[[msg]]
id = "RNX0412"
sev = 50
text = "Data area &1 in &2 must be locked by IN *LOCK before OUT."
help = "OUT writes a data area that IN *LOCK read and locked first; it was not locked."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0425"
sev = 50
text = "The heap cannot give storage of the length asked for."
help = "%ALLOC or %REALLOC asked for more storage than the heap can give, or for a length that is not valid."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0426"
sev = 50
text = "The pointer does not address heap storage that can be reallocated."
help = "QS/400 sends this for status 426; the pointer was not set by ALLOC or %ALLOC, or its storage was freed."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0802"
sev = 99
text = "COMMIT or ROLBK ran with no commitment control active."
help = "Start commitment control with STRCMTCTL before the program commits or rolls back."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX1011"
sev = 99
text = "A record of a type the program does not describe was read."
help = "A record format was read that the program has no record identification for."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33"]

[[msg]]
id = "RNX1021"
sev = 99
text = "A record with the same key is already in the file."
help = "The file allows each key once; the write or update would have added it a second time."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33"]

[[msg]]
id = "RNX1215"
sev = 99
text = "An OPEN was tried on a file that is open already."
help = "The file is already open; it cannot be opened again until it is closed."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10"]

[[msg]]
id = "RNX1211"
sev = 99
text = "An operation was tried on a file that is not open."
help = "The file must be open for this operation. Open it with OPEN, or let the cycle open it."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33", "*CHAR 5", "*CHAR 10", "*CHAR 2", "*CHAR 2", "*CHAR 10"]

[[msg]]
id = "RNX1216"
sev = 99
text = "A file could not be opened or closed by the cycle."
help = "The program cycle could not open or close the file. See the messages before this one for the reason."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33", "*CHAR 5", "*CHAR 10", "*CHAR 2", "*CHAR 2", "*CHAR 10"]

[[msg]]
id = "RNX1217"
sev = 99
text = "A file could not be opened or closed by the OPEN or CLOSE operation."
help = "The OPEN or CLOSE operation failed. See the messages before this one for the reason."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33", "*CHAR 5", "*CHAR 10", "*CHAR 2", "*CHAR 2", "*CHAR 10"]

[[msg]]
id = "RNX1218"
sev = 99
text = "The record is locked by another job."
help = "The record could not be allocated in the file's wait time."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33"]

[[msg]]
id = "RNX1221"
sev = 99
text = "An update or delete was tried without a record read first."
help = "UPDATE and DELETE work on the record last read for update; no record was read."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33"]

[[msg]]
id = "RNX1222"
sev = 99
text = "The record cannot be allocated: a constraint refused it."
help = "The database refused to lock the record because a constraint or trigger did not allow it."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33"]

[[msg]]
id = "RNX1299"
sev = 99
text = "An input or output operation failed."
help = "The file operation ended with an error the program did not handle."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33", "*CHAR 5", "*CHAR 10", "*CHAR 2", "*CHAR 2", "*CHAR 10"]

[[msg]]
id = "RNX9001"
sev = 50
text = "An RPG procedure failed."
help = "The RPG runtime stopped the procedure; the earlier messages in the job log tell why."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*CHAR 5"]

# Inquiries: C cancels, D dumps and cancels, F dumps all and cancels,
# G goes on, R tries again, S takes a system dump.

[[msg]]
id = "RNQ0100"
sev = 99
text = "A string operation's start or length is outside the string."
help = "The position or length given to %SUBST, %SCAN, %REPLACE or a similar operation reaches past the end of the string or is below 1."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]
reply = { default = "C", valid = ["D", "S", "G", "C", "F"] }

[[msg]]
id = "RNQ0101"
