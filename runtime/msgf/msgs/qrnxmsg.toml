# QRNXMSG: the ILE RPG runtime's messages. RNX messages are the escapes
# the runtime sends, the status code in the identifier's number; RNQ
# messages are the same conditions as inquiries for an unhandled error.
# Every text is Quartz-written; the identifiers, severities, data
# layouts and replies are the compatibility interface
# (tools/conformance/rpg/oracle/qrnxmsg.psv).
name = "QRNXMSG"
text = "ILE RPG runtime messages"

# Escapes.

[[msg]]
id = "RNX0100"
sev = 50
text = "A string operation's start or length is outside the string."
help = "The position or length given to %SUBST, %SCAN, %REPLACE or a similar operation reaches past the end of the string or is below 1."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0101"
sev = 50
text = "The square root of a negative number was asked for."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0102"
sev = 50
text = "A number was divided by zero."
help = "The divisor of a DIV operation, a / in an expression or %DIV and %REM was zero."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0103"
sev = 99
text = "The result is too big for the field that receives it."
help = "The integer part of the value has more digits than the target holds."

[[msg]]
id = "RNX0104"
sev = 99
text = "A float value is too small to hold."
help = "The result is nearer to zero than the float type can represent."

[[msg]]
id = "RNX0105"
sev = 99
text = "A character value cannot be read as a number."
help = "%DEC, %INT, %UNS, %FLOAT and similar functions found characters that are not part of a number."

[[msg]]
id = "RNX0112"
sev = 50
text = "A date, time or timestamp value is not valid."

[[msg]]
id = "RNX0113"
sev = 50
text = "A date operation went past the dates the format holds."

[[msg]]
id = "RNX0114"
sev = 99
text = "A date or time could not be mapped to the format asked for."

[[msg]]
id = "RNX0115"
sev = 50
text = "A variable-length field holds a length that is not valid."
help = "The length prefix is larger than the field's declared length."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0120"
sev = 99
text = "A table or array is not in its declared sequence."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*CHAR 10"]

[[msg]]
id = "RNX0121"
sev = 50
text = "An array index is outside the array."
help = "The index is zero, negative or larger than the number of elements."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*CHAR 10"]

[[msg]]
id = "RNX0122"
sev = 50
text = "The OCCUR value is outside the data structure's occurrences."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0123"
sev = 50
text = "RESET was used while the program was still initializing."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0299"
sev = 50
text = "The RPG formatted dump could not be made."

[[msg]]
id = "RNX0333"
sev = 50
text = "The DSPLY operation failed."

[[msg]]
id = "RNX0351"
sev = 50
text = "The XML document is not well formed: parser code &1 at offset &2."
vars = ["*BIN 4", "*CHAR *VARY 2", "*BIN 4"]

[[msg]]
id = "RNX0352"
sev = 50
text = "An option given to %XML is not valid."
vars = ["*CHAR *VARY 2", "*BIN 4", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "RNX0353"
sev = 50
text = "The XML document does not fit the target of XML-INTO."
vars = ["*BIN 4", "*BIN 4", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "RNX0356"
sev = 50
text = "The XML handler procedure stopped the parse."
vars = ["*BIN 4", "*BIN 4", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 4"]

[[msg]]
id = "RNX0355"
sev = 50
text = "The parser or generator program of DATA-INTO or DATA-GEN could not be called."
vars = ["*CHAR 15", "*BIN 4", "*CHAR *VARY 4"]

[[msg]]
id = "RNX0412"
sev = 50
text = "Data area &1 in &2 must be locked by IN *LOCK before OUT."
vars = ["*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0425"
sev = 50
text = "The heap cannot give storage of the length asked for."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0426"
sev = 50
text = "The pointer does not address heap storage that can be reallocated."
help = "QS/400 sends this for status 426; the pointer was not set by ALLOC or %ALLOC, or its storage was freed."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX0802"
sev = 99
text = "COMMIT or ROLBK ran with no commitment control active."
help = "Start commitment control with STRCMTCTL before the program commits or rolls back."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10"]

[[msg]]
id = "RNX1011"
sev = 99
text = "A record of a type the program does not describe was read."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33"]

[[msg]]
id = "RNX1211"
sev = 99
text = "An operation was tried on a file that is not open."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33", "*CHAR 5", "*CHAR 10", "*CHAR 2", "*CHAR 2", "*CHAR 10"]

[[msg]]
id = "RNX1216"
sev = 99
text = "A file could not be opened or closed by the cycle."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33", "*CHAR 5", "*CHAR 10", "*CHAR 2", "*CHAR 2", "*CHAR 10"]

[[msg]]
id = "RNX1217"
sev = 99
text = "A file could not be opened or closed by the OPEN or CLOSE operation."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33", "*CHAR 5", "*CHAR 10", "*CHAR 2", "*CHAR 2", "*CHAR 10"]

[[msg]]
id = "RNX1218"
sev = 99
text = "The record is locked by another job."
help = "The record could not be allocated in the file's wait time."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33"]

[[msg]]
id = "RNX1221"
sev = 99
text = "An update or delete was tried without a record read first."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33"]

[[msg]]
id = "RNX1222"
sev = 99
text = "The record cannot be allocated: a constraint refused it."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33"]

[[msg]]
id = "RNX1299"
sev = 99
text = "An input or output operation failed."
help = "The file operation ended with an error the program did not handle."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*BIN 2", "*CHAR 10", "*CHAR 33", "*CHAR 5", "*CHAR 10", "*CHAR 2", "*CHAR 2", "*CHAR 10"]

[[msg]]
id = "RNX9001"
sev = 50
text = "An RPG procedure failed."
help = "The RPG runtime stopped the procedure; the earlier messages in the job log tell why."
vars = ["*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 10", "*CHAR 7", "*CHAR 5"]

# Inquiries: C cancels, D dumps and cancels, F dumps all and cancels,
# G goes on, R tries again, S takes a system dump.

[[msg]]
id = "RNQ0100"
sev = 99
text = "A string operation's start or length is outside the string."
help = "The position or length given to %SUBST, %SCAN, %REPLACE or a similar operation reaches past the end of the string or is below 1."
