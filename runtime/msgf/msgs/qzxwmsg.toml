# QZXWMSG: Access for Web's messages and the desktop's it shares,
# installed in library QUSRSYS with QS00AFW. Made from
# net/accessweb/src/msgs.rs by its test
# (QS400_UPDATE_MSGF=1 cargo test -p accessweb --test msgf); do not edit.
# The XWA texts are ours, the QAD texts the desktop's.
name = "QZXWMSG"
text = "Access for Web messages"

[[msg]]
id = "XWA0001"
sev = 40
text = "Function &1 is not allowed for user profile &2 by the Access for Web policies."
help = "&N Cause . . . . . :   The Access for Web policy for &1 is set to Deny for &2, one of its groups or *PUBLIC. A Deny at any of these levels denies the function, whatever the object authority of the user profile. &N Recovery  . . . :   Ask your security administrator to change the policy on the Policies page of Access for Web, or use the function from a 5250 display."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "XWA0002"
sev = 0
text = "Access for Web policies for &1 changed."
help = "&N Cause . . . . . :   The policies set for &1 were saved in the policy store. They apply from the next request of every user they affect. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0003"
sev = 0
text = "Access for Web preferences for user profile &1 changed."
help = "&N Cause . . . . . :   The preferences of &1 were saved. They apply from the next page. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0004"
sev = 30
text = "Value &1 is not valid for &2."
help = "&N Cause . . . . . :   The value &1 typed for &2 is not one this field accepts. Nothing was saved. &N Recovery  . . . :   Type a value the field accepts and try again."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "XWA0005"
sev = 0
text = "Access for Web preferences for user profile &1 set to the defaults."
help = "&N Cause . . . . . :   Every preference of &1 was set back to the value the product ships with. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0010"
sev = 0
text = "Session &1 saved."
help = "&N Cause . . . . . :   The settings of 5250 session &1 were saved with your Access for Web sessions. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0020"
sev = 0
text = "Request &1 saved."
help = "&N Cause . . . . . :   Request &1 was saved with your Access for Web requests. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0030"
sev = 0
text = "Copy completed: &1 rows copied, &2 errors."
help = "&N Cause . . . . . :   The copy wrote &1 rows. &2 rows could not be written; the messages of the copy name them. &N Recovery  . . . :   None when there were no errors. Otherwise correct the rows named and copy them again."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "XWA0040"
sev = 0
text = "File &1 uploaded."
help = "&N Cause . . . . . :   The file &1 was written to the integrated file system as your user profile. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0050"
sev = 0
text = "Command submitted to job queue &1 as job &2."
help = "&N Cause . . . . . :   The command runs in batch job &2 from job queue &1, as your user profile. &N Recovery  . . . :   Look at the job from My jobs; its job log holds the command's messages."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "XWA0099"
sev = 40
text = "Function &1 of Access for Web is not available on this system."
help = "&N Cause . . . . . :   The pages of &1 are not part of this level of the product. &N Recovery  . . . :   Use the function from a 5250 display or from QS/400 Access for Desktop."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD4022"
sev = 20
text = "Password for &1 on &2 has expired."
help = "&N Cause . . . . . :   The password of user &1 on system &2 is correct but has expired. The system requires a new one before it allows a sign-on. &N Recovery  . . . :   Change the password in the Change Password dialog. The new password must meet the system's password rules, which the system reports if it is refused."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD4023"
sev = 0
text = "Password changed for &1 on &2."
help = "&N Cause . . . . . :   System &2 accepted the new password for user &1. &N Recovery  . . . :   None needed. Use the new password from now on, including at the 5250 sign-on display."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD4027"
sev = 30
text = "New password and confirmation are not the same."
help = "&N Cause . . . . . :   The new password and the confirmation of it were typed differently. Nothing was sent to the system. &N Recovery  . . . :   Type the new password again in both fields."

[[msg]]
id = "QAD4031"
sev = 10
text = "Password for &1 on &2 expires in &3 days."
help = "&N Cause . . . . . :   The password of user profile &1 on system &2 expires in &3 days, within the system's password expiration warning period (system value QPWDEXPWRN). It is counted on the system's clock from the password's last change and its expiration interval. This warning is shown once per session. &N Recovery  . . . :   Select Change Password... to change it now, or change it later with Actions > Change Password... before it expires. Once it has expired, sign-on asks for a new one."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "XWA0041"
sev = 10
text = "No entry was selected."
help = "&N Cause . . . . . :   The action applies to the entries selected in the list, and none was selected. Nothing was done. &N Recovery  . . . :   Select one or more entries with their check boxes, then select the action again."

[[msg]]
id = "XWA0042"
sev = 0
text = "File &1 saved."
help = "&N Cause . . . . . :   The text was written to file &1 in its own CCSID and line endings, as your user profile. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0043"
sev = 0
text = "Authority of &1 changed."
help = "&N Cause . . . . . :   The data authority, the public authority or the authorization list of &1 was changed as your user profile. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0045"
sev = 10
text = "Select one spooled file for &1."
help = "&N Cause . . . . . :   &1 makes one file from one spooled file, and the selection did not hold exactly one. &N Recovery  . . . :   Select one spooled file and select &1 again, or use its PDF and Text links in the list."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD6001"
sev = 0
text = "&1 spooled files on &2."
help = "&N Cause . . . . . :   The Printer Output list shows the spooled files on system &2 that match the filter: &1 in all, a page at a time. Clicking a column heading sorts the page shown, not the whole list. &N Recovery  . . . :   None needed. Change the filter and select Go to list other files. Select Refresh, or set Auto-refresh, to see files that arrived since."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD6002"
sev = 0
text = "Spooled file &1 held."
help = "&N Cause . . . . . :   Spooled file &1 was held on the system: it is not printed until it is released. A file being printed when it was held stops immediately or at the end of the current page, as chosen. &N Recovery  . . . :   To print it, select it and select Release."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD6003"
sev = 0
text = "Spooled file &1 released."
help = "&N Cause . . . . . :   Spooled file &1 was released: it prints when a writer for its output queue reaches it. &N Recovery  . . . :   None needed. If it does not print, check in Output Queues that a writer is attached to its queue and that the queue is not held."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD6004"
sev = 0
text = "Spooled file &1 deleted."
help = "&N Cause . . . . . :   Spooled file &1 was deleted from the system, with its data. &N Recovery  . . . :   None needed. A deleted spooled file cannot be brought back; run the job that made it again to make it again."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD6005"
sev = 0
text = "Spooled file &1 moved to &2."
help = "&N Cause . . . . . :   Spooled file &1 is now on output queue &2, at the end of the queue or at its top, as chosen. It prints when a writer for that queue reaches it. &N Recovery  . . . :   None needed."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD6006"
sev = 30
text = "&1 of &2 actions failed; see the details."
help = "&N Cause . . . . . :   An action was asked for on &2 spooled files, one request each, and the system refused &1 of them. The summary lists every file, and for each refusal the system's message as it sent it. &N Recovery  . . . :   Select a refusal's message ID for its second-level text, correct what it names, refresh the list, then try the action again on those files."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD6012"
sev = 20
text = "Spooled file &1 is still being written."
help = "&N Cause . . . . . :   Spooled file &1 is still open: the program making it has not closed it, so its pages cannot be read yet. The system sent no message of its own for this. &N Recovery  . . . :   Wait for the job that makes the file to close it, select Refresh, and open the file again."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD6013"
sev = 20
text = "Spooled file &1 cannot be shown as &2."
help = "&N Cause . . . . . :   The system cannot make &2 of spooled file &1 from the kind of data the file holds, and sent no message of its own saying why. &N Recovery  . . . :   Look at the file from a 5250 display session (WRKSPLF, option 5), or print it on a printer device that takes its kind of data."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD8002"
sev = 0
text = "Folder &1 created."
help = "&N Cause . . . . . :   The folder &1 was created on the system, with the authorities its parent folder gives new objects. &N Recovery  . . . :   None needed."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD8003"
sev = 0
text = "&1 renamed to &2."
help = "&N Cause . . . . . :   The system renamed or moved &1 to &2. &N Recovery  . . . :   None needed. To undo it, rename &2 back."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD8004"
sev = 0
text = "&1 deleted."
help = "&N Cause . . . . . :   &1 was deleted on the system. A deleted file cannot be recovered from this program. &N Recovery  . . . :   None needed."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD8005"
sev = 0
text = "&1 copied to &2."
help = "&N Cause . . . . . :   The system copied &1 to &2, keeping its data and CCSID as stored. The data did not pass through this computer. &N Recovery  . . . :   None needed."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD8006"
sev = 30
text = "Deleting &1 stopped at &2: &3."
help = "&N Cause . . . . . :   The folder &1 is deleted from the inside out, one entry at a time. The system refused to delete &2, with the message shown (&3), so the delete stopped there. Entries deleted before it stay deleted; &2, the folders that hold it and anything not reached yet are still there. &N Recovery  . . . :   Correct what the system's message describes (for example, a file checked out to another user, or one you are not authorized to delete), then delete &1 again."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD8010"
sev = 10
text = "&1 already exists in &2."
help = "&N Cause . . . . . :   An entry named &1 is already in the folder &2, so the copy, move, upload or download would replace it. &N Recovery  . . . :   Choose Replace to replace it, Skip to leave it as it is, or Keep both (downloads only) to save the new file with a number added to its name."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD8011"
sev = 10
text = "&1 changed on the system since you opened it."
help = "&N Cause . . . . . :   The file &1 was changed on the system after this editor read it: its change count (on QAP version 6; before it, its last-changed time) is not the one it had when it was opened or last saved. Saving now would replace those changes. &N Recovery  . . . :   Choose Overwrite to save your text over the system's file, Reload to read the system's file again and lose your changes, or Cancel to go on editing."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD8012"
sev = 20
text = "&1 is too large to edit here; download it instead."
help = "&N Cause . . . . . :   The file &1 is larger than 64 MiB, the most the built-in editor opens. &N Recovery  . . . :   Download the file, then open it with a program on this computer that edits large files, and upload it again."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD8013"
sev = 10
text = "&1 is not a text file; opened read-only."
help = "&N Cause . . . . . :   The file &1 is binary (its CCSID is 65535, or its first 8 KiB hold NUL bytes), or it is larger than 8 MiB, so the editor shows it without letting it be changed. &N Recovery  . . . :   To change the file, download it, edit it with a program that suits it, and upload it again."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD8020"
sev = 0
text = "Transfer of &1 complete: &2 in &3."
help = "&N Cause . . . . . :   The file &1 was copied; &2 of data took &3. &N Recovery  . . . :   None needed."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD8021"
sev = 20
text = "Transfer of &1 failed: &2."
help = "&N Cause . . . . . :   The file &1 was not copied completely. The reason given was: &2. A download keeps its partial data in a temporary file beside the target; the target itself is unchanged. &N Recovery  . . . :   Correct the cause, then select Retry in the transfer list. A binary transfer, and a text download, resume from the last part the system confirmed; a text upload starts again from the beginning."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD8022"
sev = 10
text = "Transfer of &1 cancelled."
help = "&N Cause . . . . . :   The transfer of &1 was cancelled before it ended. A download keeps its partial data in a temporary file beside the target; the target itself is unchanged. &N Recovery  . . . :   Select Retry in the transfer list to go on from where it stopped, or Remove finished to drop it from the list."
vars = ["*CHAR *VARY 2"]
