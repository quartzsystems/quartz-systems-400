# QZXWMSG: Access for Web's messages and the desktop's it shares,
# installed in library QUSRSYS with QS00AFW. Made from
# net/accessweb/src/msgs.rs by its test
# (QS400_UPDATE_MSGF=1 cargo test -p accessweb --test msgf); do not edit.
# The XWA texts are ours, the QAD texts the desktop's.
name = "QZXWMSG"
text = "Access for Web messages"

[[msg]]
id = "XWA0001"
sev = 40
text = "Function &1 is not allowed for user profile &2 by the Access for Web policies."
help = "&N Cause . . . . . :   The Access for Web policy for &1 is set to Deny for &2, one of its groups or *PUBLIC. A Deny at any of these levels denies the function, whatever the object authority of the user profile. &N Recovery  . . . :   Ask your security administrator to change the policy on the Policies page of Access for Web, or use the function from a 5250 display."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "XWA0002"
sev = 0
text = "Access for Web policies for &1 changed."
help = "&N Cause . . . . . :   The policies set for &1 were saved in the policy store. They apply from the next request of every user they affect. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0003"
sev = 0
text = "Access for Web preferences for user profile &1 changed."
help = "&N Cause . . . . . :   The preferences of &1 were saved. They apply from the next page. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0004"
sev = 30
text = "Value &1 is not valid for &2."
help = "&N Cause . . . . . :   The value &1 typed for &2 is not one this field accepts. Nothing was saved. &N Recovery  . . . :   Type a value the field accepts and try again."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "XWA0005"
sev = 0
text = "Access for Web preferences for user profile &1 set to the defaults."
help = "&N Cause . . . . . :   Every preference of &1 was set back to the value the product ships with. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0010"
sev = 0
text = "Session &1 saved."
help = "&N Cause . . . . . :   The settings of 5250 session &1 were saved with your Access for Web sessions. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0011"
sev = 0
text = "Session &1 deleted."
help = "&N Cause . . . . . :   The saved 5250 session &1, its keyboard map and its macros were removed from your Access for Web sessions. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0013"
sev = 0
text = "Macro &1 saved."
help = "&N Cause . . . . . :   The steps of macro &1 were saved with its 5250 session. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0014"
sev = 0
text = "Macro &1 deleted."
help = "&N Cause . . . . . :   Macro &1 was removed from its 5250 session. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0020"
sev = 0
text = "Request &1 saved."
help = "&N Cause . . . . . :   Request &1 was saved with your Access for Web requests. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0030"
sev = 0
text = "Copy completed: &1 rows copied, &2 errors."
help = "&N Cause . . . . . :   The copy wrote &1 rows. &2 rows could not be written; the messages of the copy name them. &N Recovery  . . . :   None when there were no errors. Otherwise correct the rows named and copy them again."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "XWA0040"
sev = 0
text = "File &1 uploaded."
help = "&N Cause . . . . . :   The file &1 was written to the integrated file system as your user profile. &N Recovery  . . . :   None."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "XWA0050"
sev = 0
text = "Command submitted to job queue &1 as job &2."
help = "&N Cause . . . . . :   The command runs in batch job &2 from job queue &1, as your user profile. &N Recovery  . . . :   Look at the job from My jobs; its job log holds the command's messages."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "XWA0099"
sev = 40
text = "Function &1 of Access for Web is not available on this system."
help = "&N Cause . . . . . :   The pages of &1 are not part of this level of the product. &N Recovery  . . . :   Use the function from a 5250 display or from QS/400 Access for Desktop."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD4022"
sev = 20
text = "Password for &1 on &2 has expired."
help = "&N Cause . . . . . :   The password of user &1 on system &2 is correct but has expired. The system requires a new one before it allows a sign-on. &N Recovery  . . . :   Change the password in the Change Password dialog. The new password must meet the system's password rules, which the system reports if it is refused."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD4023"
sev = 0
text = "Password changed for &1 on &2."
help = "&N Cause . . . . . :   System &2 accepted the new password for user &1. &N Recovery  . . . :   None needed. Use the new password from now on, including at the 5250 sign-on display."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD4027"
sev = 30
text = "New password and confirmation are not the same."
help = "&N Cause . . . . . :   The new password and the confirmation of it were typed differently. Nothing was sent to the system. &N Recovery  . . . :   Type the new password again in both fields."

[[msg]]
id = "QAD4031"
sev = 10
text = "Password for &1 on &2 expires in &3 days."
help = "&N Cause . . . . . :   The password of user profile &1 on system &2 expires in &3 days, within the system's password expiration warning period (system value QPWDEXPWRN). It is counted on the system's clock from the password's last change and its expiration interval. This warning is shown once per session. &N Recovery  . . . :   Select Change Password... to change it now, or change it later with Actions > Change Password... before it expires. Once it has expired, sign-on asks for a new one."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD1002"
sev = 30
text = "Connection to &1 refused."
help = "&N Cause . . . . . :   System &1 answered, but nothing accepted the connection on the port used. The Telnet server may not be started, or the port in the system configuration may be wrong, or TLS may be selected for a system with no TLS listener. &N Recovery  . . . :   Check that the Telnet server is started on &1, and check the Telnet ports on the Ports tab of the system's properties and the TLS setting on its Security tab. Then select Reconnect."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD1003"
sev = 30
text = "Host &1 not found."
help = "&N Cause . . . . . :   The name &1 could not be turned into an address. The name may be misspelt, or the name server may not know it. &N Recovery  . . . :   Correct the system name in System Configurations, or give a fixed IP address on the Connection tab. Then start the session again."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD1004"
sev = 30
text = "Connection to &1 timed out."
help = "&N Cause . . . . . :   No answer came from system &1 within 15 seconds. The system may be down, or a firewall may be dropping the connection. &N Recovery  . . . :   Check that &1 is running and can be reached from this computer, then select Reconnect."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD1005"
sev = 20
text = "Session to &1 ended by the system."
help = "&N Cause . . . . . :   System &1 closed the connection. This happens when the job ends after sign-off, when the device is varied off, or when the connection is lost. &N Recovery  . . . :   Select Reconnect to start a new session. The last screen stays visible until then."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD1006"
sev = 0
text = "Session to &1 disconnected."
help = "&N Cause . . . . . :   The session to system &1 was disconnected at your request. What the job does now depends on the device recovery action of the system: it may end, or wait for you to sign on again. &N Recovery  . . . :   Select Reconnect to start a new session. The last screen stays visible until then."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD1010"
sev = 30
text = "TLS handshake with &1 failed: &2."
help = "&N Cause . . . . . :   A TLS session could not be set up with system &1. The reason given was: &2 &N Recovery  . . . :   Check that the port on the Ports tab is the system's TLS Telnet port and that the system's TLS configuration is complete. If the system offers no TLS, clear TLS on the Security tab."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD1011"
sev = 30
text = "Certificate for &1 is not trusted."
help = "&N Cause . . . . . :   System &1 presented a certificate that does not chain to a certificate authority this computer trusts, or that is not valid for the name &1. The reason given was: &2 &N Recovery  . . . :   Compare the certificate's SHA-256 fingerprint with the one shown on the system itself. If they match and you trust the system, select Trust for this system; the certificate is added to this system's CA list. Otherwise do not connect."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD1020"
sev = 30
text = "Device name &1 is in use."
help = "&N Cause . . . . . :   The system could not give this session the display device &1: the device is in use by another session or is not available (start-up response code &2). &N Recovery  . . . :   Select Retry without device name to let the system choose a device, or change the device name and start the session again."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD1021"
sev = 30
text = "Device name &1 is not valid."
help = "&N Cause . . . . . :   The system refused display device name &1 for this session (start-up response code &2: &3). &N Recovery  . . . :   Select Retry without device name to let the system choose a device, or give a device name of 1 to 10 letters, digits, #, $ or @, starting with a letter."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD2001"
sev = 30
text = "Session file &1 could not be read: &2."
help = "&N Cause . . . . . :   The file &1 could not be opened, or it is not a valid session, keyboard map or macro file. The reason given was: &2 &N Recovery  . . . :   Correct the file, or open another one. These files are TOML text whose first table is [qsaccess], giving the kind of file and its format version."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD2002"
sev = 30
text = "Session file &1 was made by a newer version (&2)."
help = "&N Cause . . . . . :   The file &1 is format version &2, which is newer than this release of QS/400 Access for Desktop can read. The file was not opened and has not been changed. &N Recovery  . . . :   Open the file with the release that made it, or install a newer release of QS/400 Access for Desktop."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD2010"
sev = 0
text = "Keyboard map loaded from &1."
help = "&N Cause . . . . . :   The keyboard map in the file &1 was copied. Later changes to the file do not affect the copy. &N Recovery  . . . :   None needed. Save the session to keep the map with it."
vars = ["*CHAR *VARY 2"]

[[msg]]
id = "QAD2020"
sev = 30
text = "Macro &1 stopped at step &2: &3."
help = "&N Cause . . . . . :   Macro &1 could not carry out step &2 and was stopped. The reason was: &3. The steps after it were not run. &N Recovery  . . . :   Check that the session shows the screen the macro expects at step &2, then run the macro again. To change the step, open the macro in the Macro editor."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2", "*CHAR *VARY 2"]

[[msg]]
id = "QAD2021"
sev = 0
text = "Macro &1 recorded with &2 steps."
help = "&N Cause . . . . . :   Recording ended and macro &1 was saved with &2 steps. Text typed into fields that are not displayed, such as passwords, was not recorded; a step that asks for the value when the macro runs takes its place. &N Recovery  . . . :   None needed. Run the macro from the session's Macro menu, or open it in the Macro editor to change it."
vars = ["*CHAR *VARY 2", "*CHAR *VARY 2"]
