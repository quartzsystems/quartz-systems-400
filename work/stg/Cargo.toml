[package]
name = "stg"
description = "QS/400 storage service protocol: the requests a job sends, and the job-side sources that send them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ipc = { path = "../../work/ipc", version = "0.1.0" }
mi = { path = "../../runtime/mi", version = "0.1.0" }
sql = { path = "../../database/sql", version = "0.1.0" }
ile = { path = "../../runtime/ile", version = "0.1.0" }
msgf = { path = "../../runtime/msgf", version = "0.1.0" }
sysapi = { path = "../../runtime/sysapi", version = "0.1.0" }
regfac = { path = "../../net/regfac", version = "0.1.0" }
wm = { path = "../../work/wm", version = "0.1.0" }
sec = { path = "../../security/sec", version = "0.1.0" }
ifs = { path = "../../ifs/ifs", version = "0.1.0" }
cmd = { path = "../../command/cmd", version = "0.1.0" }
svctools = { path = "../../lic/svctools", version = "0.1.0", features = ["wire"] }
tracing.workspace = true

[dev-dependencies]
blockdev = { path = "../../lic/blockdev", version = "0.1.0" }
ccsid = { path = "../../storage/ccsid", version = "0.1.0" }
db = { path = "../../database/db", version = "0.1.0" }
jrn = { path = "../../database/jrn", version = "0.1.0" }
qsname = { path = "../../storage/qsname", version = "0.1.0" }
qsyslib = { path = "../../ifs/qsyslib", version = "0.1.0" }
store = { path = "../../storage/store", version = "0.1.0" }

[lints]
workspace = true
