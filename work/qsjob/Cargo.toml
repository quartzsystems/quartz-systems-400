[package]
name = "qsjob"
description = "QS/400 job process: one Linux process per job, its programs run here, its storage through the storage service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spool = { path = "../../work/spool", version = "0.1.0" }
print = { path = "../../work/print", version = "0.1.0" }
ipc = { path = "../../work/ipc", version = "0.1.0" }
stg = { path = "../../work/stg", version = "0.1.0" }
sec = { path = "../../security/sec", version = "0.1.0" }
ifs = { path = "../../ifs/ifs", version = "0.1.0" }
ifscmd = { path = "../../ifs/ifscmd", version = "0.1.0" }
wm = { path = "../../work/wm", version = "0.1.0" }
cmncfg = { path = "../../net/cmncfg", version = "0.1.0" }
mi = { path = "../../runtime/mi", version = "0.1.0" }
ile = { path = "../../runtime/ile", version = "0.1.0" }
sysapi = { path = "../../runtime/sysapi", version = "0.1.0" }
regfac = { path = "../../net/regfac", version = "0.1.0" }
hostserver = { path = "../../net/hostserver", version = "0.1.0" }
hostsvr = { path = "../../net/hostsvr", version = "0.1.0" }
sockets = { path = "../../net/sockets", version = "0.1.0" }
qrpgrt = { path = "../../rpg/qrpgrt", version = "0.1.0" }
msgf = { path = "../../runtime/msgf", version = "0.1.0" }
ccsid = { path = "../../storage/ccsid", version = "0.1.0" }
tcpcfg = { path = "../../net/tcpcfg", version = "0.1.0" }
nettools = { path = "../../net/nettools", version = "0.1.0" }
qdecimal = { path = "../../database/qdecimal", version = "0.1.0" }
qir = { path = "../../runtime/qir", version = "0.1.0" }
cmd = { path = "../../command/cmd", version = "0.1.0" }
sys-cpps = { path = "../../command/sys-cpps", version = "0.1.0" }
tn5250 = { path = "../../ui/tn5250", version = "0.1.0" }
dspf = { path = "../../ui/dspf", version = "0.1.0" }
uim = { path = "../../ui/uim", version = "0.1.0" }
menus = { path = "../../ui/menus", version = "0.1.0" }
pdm = { path = "../../devtools/pdm", version = "0.1.0" }
dfu = { path = "../../devtools/dfu", version = "0.1.0" }
edtf = { path = "../../devtools/edtf", version = "0.1.0" }
dds = { path = "../../database/dds", version = "0.1.0" }
dbg = { path = "../../devtools/dbg", version = "0.1.0" }
release = { path = "../../lic/release", version = "0.1.0" }
seu = { path = "../../devtools/seu", version = "0.1.0", features = ["display"] }
sst = { path = "../../devtools/sst", version = "0.1.0" }
svctools = { path = "../../lic/svctools", version = "0.1.0" }
isql = { path = "../../devtools/isql", version = "0.1.0" }
sda = { path = "../../devtools/sda", version = "0.1.0" }
ddm = { path = "../../net/ddm", version = "0.1.0" }
servers = { path = "../../net/servers", version = "0.1.0" }
ntp = { path = "../../net/ntp", version = "0.1.0" }
lpd = { path = "../../net/lpd", version = "0.1.0" }
mail = { path = "../../net/mail", version = "0.1.0" }
tls = { path = "../../net/tls", version = "0.1.0" }
ftp = { path = "../../net/ftp", version = "0.1.0" }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
x509-cert = { version = "0.3.0", features = ["builder"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pem", "std"] }
libc = "0.2.190"
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["time"] }

[lints]
workspace = true
