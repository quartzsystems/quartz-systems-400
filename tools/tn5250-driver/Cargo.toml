[package]
name = "tn5250-driver"
description = "QS/400 scripted TN5250E client: captures and compares screens on QS/400 and the oracle systems"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tn5250-driver"
path = "src/main.rs"

[dependencies]
tn5250 = { path = "../../ui/tn5250", version = "0.1.0" }
ccsid = { path = "../../storage/ccsid", version = "0.1.0" }
hostsvr = { path = "../../net/hostsvr", version = "0.1.0" }
ddm = { path = "../../net/ddm", version = "0.1.0" }
anyhow.workspace = true
clap.workspace = true
regex = "1.11.0"

[lints]
workspace = true
