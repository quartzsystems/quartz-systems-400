# Outside the workspace (the root Cargo.toml's `exclude`), with its own
# Cargo.lock: the client's wire code comes from crates by other authors than
# the server, and nothing of `net/ldap` or `net/dirsrv` reaches the binary.
# `cargo run -p build -- deny` checks this graph.
[package]
name = "ldaptest"
description = "An LDAP test client for QS/400's directory server, written apart from the server, and its scenarios"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[[bin]]
name = "ldaptest"
path = "src/main.rs"

[dependencies]
# The LDAP client (MIT/Apache-2.0, Ivan Nejgebauer): BER, messages, filters,
# the controls and extended operations it has. Rustls with no provider of its
# own: ldaptest installs graviola's (pure Rust) as the process default.
ldap3 = { version = "=0.12.1", default-features = false, features = ["sync", "tls-rustls", "rustls-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "=0.4.0"
thiserror = "=2.0.21"

# The workspace's lints, repeated (an excluded crate cannot inherit them).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
many_single_char_names = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
implicit_hasher = "allow"
type_complexity = "allow"
