[package]
name = "pesign"
description = "QS/400 Secure Boot signing: Authenticode signatures on the UKIs, the db key and its EFI signature list"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pesign"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
certs = { path = "../../net/certs", version = "0.1.0" }
graviola = "0.4.1"
x509-cert = { version = "0.3.0", features = ["builder", "pem"] }
der = { version = "0.8.2", features = ["alloc", "derive", "oid", "pem"] }
spki = { version = "0.8.1", features = ["alloc"] }
signature = "3.0.0"

[lints]
workspace = true
