# Every persistent or wire format frozen at a release. `fmtcheck` hashes
# the listed sources (tokens only: comments and #[cfg(test)] items do not
# count) and fails when a hash moves without one of `version` moving too.
# After a deliberate change: bump the version, add the migration (or the
# reader of the old version), then `cargo run -p fmtcheck -- update`.

