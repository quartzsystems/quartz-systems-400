[package]
name = "build"
description = "QS/400 build orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Cargo forbids a binary target literally named `build`; the package keeps
# the name so `cargo run -p build` works.
[[bin]]
name = "qs400-build"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
conformance = { path = "../../tools/conformance", version = "0.1.0" }
diskimg = { path = "../../lic/diskimg", version = "0.1.0" }
optical = { path = "../../media/optical", version = "0.1.0" }
instmedia = { path = "../../media/instmedia", version = "0.1.0" }
release = { path = "../../lic/release", version = "0.1.0" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls-graviola = "0.4.0"
ed25519-dalek = "3.0.0"
lpbuild = { path = "../../licpgm/lpbuild", version = "0.1.0" }
getrandom = "0.4.3"

[lints]
workspace = true
