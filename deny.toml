# cargo-deny configuration for QS/400.
# Rule one: nothing in the graph may compile or link C.

[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # Build helpers that exist only to compile or bind C.
    { crate = "cc", reason = "no C code may be compiled into any QS/400 artifact" },
    { crate = "cmake", reason = "no C code may be compiled into any QS/400 artifact" },
    { crate = "bindgen", reason = "no C bindings are generated in QS/400" },
    { crate = "pkg-config", reason = "no system C libraries are linked in QS/400" },
    { crate = "vcpkg", reason = "no system C libraries are linked in QS/400" },
    # Crypto and TLS with C or assembly built by cc/cmake.
    { crate = "ring", reason = "contains C and assembly built with cc" },
    { crate = "aws-lc-rs", reason = "builds C via cmake" },
    { crate = "aws-lc-sys", reason = "builds C via cmake" },
    { crate = "openssl", reason = "links OpenSSL" },
    { crate = "openssl-sys", reason = "links OpenSSL" },
    { crate = "native-tls", reason = "links a system TLS library" },
    # Compression libraries wrapping C.
    { crate = "libz-sys", reason = "links zlib" },
    { crate = "lzma-sys", reason = "links liblzma" },
    { crate = "xz2", reason = "links liblzma" },
    { crate = "bzip2-sys", reason = "links libbz2" },
    { crate = "zstd-sys", reason = "links libzstd" },
    { crate = "libsqlite3-sys", reason = "links sqlite" },
    { crate = "curl-sys", reason = "links libcurl" },
    { crate = "libgit2-sys", reason = "links libgit2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
